<!doctype html>
<html lang="en">
<head>
<script>try { if (localStorage.getItem("ren-hide-ai") === "1") document.documentElement.classList.add("hide-ai"); } catch (e) {}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ren's emporium{% endblock %}</title>
<meta name="description" content="{% block description %}games, 3d, drawings and writing by dani deetvleet{% endblock %}">
{% block meta %}{% endblock %}
<link rel="icon" href="{{ root }}static/img/icon.png">
<link rel="stylesheet" href="{{ root }}static/css/site.css?v={{ css_v }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block aitoggle %}
<button class="ai-toggle" id="ai-toggle" type="button" aria-pressed="false">ai work: <span>shown</span></button>
<script>
(function () {
  const btn = document.getElementById("ai-toggle"), root = document.documentElement;
  function paint() { const hid = root.classList.contains("hide-ai"); btn.querySelector("span").textContent = hid ? "hidden" : "shown"; btn.setAttribute("aria-pressed", hid); }
  btn.addEventListener("click", function () {
    root.classList.toggle("hide-ai");
    try { localStorage.setItem("ren-hide-ai", root.classList.contains("hide-ai") ? "1" : "0"); } catch (e) {}
    paint();
  });
  paint();
})();
</script>
{% endblock %}
{% block back %}
<a class="back" href="{{ root }}" aria-label="back to the map">
  <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 12 L14 7 L26 12 L35 7 L35 29 L26 34 L14 29 L5 34 Z M14 7 L14 29 M26 12 L26 34" fill="#fff6d8" stroke="#5d5f6e" stroke-width="2.6" stroke-linejoin="round"/></svg>
  map
</a>
{% endblock %}
<main class="page">
{% block main %}{% endblock %}
</main>
<footer class="footer">
  {% block footer %}{% endblock %}
  <p><a href="{{ root }}about/">about</a> · <a href="{{ root }}gazetteer/">gazetteer</a></p>
</footer>
</body>
</html>
