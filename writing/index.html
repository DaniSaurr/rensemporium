  function paint() { const hid = root.classList.contains("hide-ai"); btn.querySelector("span").textContent = hid ? "hidden" : "shown"; btn.setAttribute("aria-pressed", hid); }

    root.classList.toggle("hide-ai");
    try { localStorage.setItem("ren-hide-ai", root.classList.contains("hide-ai") ? "1" : "0"); } catch (e) {}
    paint();
  });
  paint();
})();
</script>
