<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>universal creature viewer</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        background: #f7f4fb;
      }

      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: center;
        padding: 14px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #333;
      }

      #controls .seed-controls {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      #controls button,
      #controls select,
      #controls input {
        font-size: 14px;
      }

      button {
        padding: 6px 10px;
        cursor: pointer;
      }

      canvas {
        border: 1px solid #d3d3d3;
        background: #fcfbff;
        margin: 12px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>
        modetriangle
        <select id="viewModeInput">
          <option value="grid" selected>grid</option>
          <option value="single">single</option>
        </select>
      </label>

      <label>
        cols
        <input id="colsInput" type="number" min="1" max="12" value="1" style="width:60px;">
      </label>

      <label>
        rows
        <input id="rowsInput" type="number" min="1" max="12" value="1" style="width:60px;">
      </label>

      <span class="seed-controls">
        <label>
          creature #
          <input id="seedInput" type="number" min="1" step="1" value="1" style="width:90px;">
        </label>
        <button id="prevSeedBtn" type="button">previous</button>
        <button id="nextSeedBtn" type="button">next</button>
        <button id="randomSeedBtn" type="button">random</button>
      </span>

      <label><input id="randomB" type="checkbox" checked> random B</label>
      <label><input id="randomE" type="checkbox" checked> random E</label>
      <label><input id="randomN" type="checkbox" checked> random N</label>
      <label><input id="randomM" type="checkbox" checked> random M</label>
      <label><input id="bodyConstellation" type="checkbox" checked> body constellation</label>
    </div>

    <canvas id="myCanvas" width="1024" height="1024">
      Your browser does not support the HTML canvas tag.
    </canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");

      const viewModeInput = document.getElementById("viewModeInput");
      const colsInput = document.getElementById("colsInput");
      const rowsInput = document.getElementById("rowsInput");
      const seedInput = document.getElementById("seedInput");
      const prevSeedBtn = document.getElementById("prevSeedBtn");
      const nextSeedBtn = document.getElementById("nextSeedBtn");
      const randomSeedBtn = document.getElementById("randomSeedBtn");
      const randomBInput = document.getElementById("randomB");
      const randomEInput = document.getElementById("randomE");
      const randomNInput = document.getElementById("randomN");
      const randomMInput = document.getElementById("randomM");
      const bodyConstellationInput = document.getElementById("bodyConstellation");

      const DEFAULT_FEATURES = {
        B: "triangle",
        E: "square",
        N: "circle",
        M: "v"
      };

      function getControls() {
        return {
          viewMode: viewModeInput.value,
          cols: parseInt(colsInput.value, 10),
          rows: parseInt(rowsInput.value, 10),
          selectedSeed: getSafeSeedValue(),
          bodyConstellation: bodyConstellationInput.checked,
          randomize: {
            B: randomBInput.checked,
            E: randomEInput.checked,
            N: randomNInput.checked,
            M: randomMInput.checked
          }
        };
      }

      function getSafeSeedValue() {
        const raw = parseInt(seedInput.value, 10);
        if (!Number.isFinite(raw) || raw < 1) return 1;
        return raw;
      }

      function setSeedValue(seed) {
        seedInput.value = Math.max(1, Math.floor(seed));
      }

      function createRNG(seed) {
        let s = seed;
        return function() {
          s = Math.sin(s * 9999) * 10000;
          return s - Math.floor(s);
        };
      }

      function range(rng, min, max) {
        return min + rng() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function weightedChoice(pool, rng) {
        const totalWeight = pool.reduce((sum, item) => sum + item.weight, 0);
        let roll = rng() * totalWeight;
        for (const item of pool) {
          if (roll < item.weight) return item.name;
          roll -= item.weight;
        }
        return pool[pool.length - 1].name;
      }

      function chooseOne(array, rng) {
        return array[Math.floor(rng() * array.length)];
      }

      function parseHslString(hsl) {
        const match = /hsl\((\d+),\s*([\d.]+)%,\s*([\d.]+)%\)/.exec(hsl);
        if (!match) return null;
        return { h: Number(match[1]), s: Number(match[2]), l: Number(match[3]) };
      }

      function darkerColour(hsl, amount = 12) {
        const parsed = parseHslString(hsl);
        if (!parsed) return hsl;
        const l = clamp(parsed.l - amount, 0, 100);
        return `hsl(${parsed.h}, ${parsed.s}%, ${l}%)`;
      }

      function lighterColour(hsl, amount = 12) {
        const parsed = parseHslString(hsl);
        if (!parsed) return hsl;
        const l = clamp(parsed.l + amount, 0, 100);
        return `hsl(${parsed.h}, ${parsed.s}%, ${l}%)`;
      }

      function shiftedColour(hsl, hueShift = 0, satShift = 0, lightShift = 0) {
        const parsed = parseHslString(hsl);
        if (!parsed) return hsl;
        const h = (parsed.h + hueShift + 360) % 360;
        const s = clamp(parsed.s + satShift, 0, 100);
        const l = clamp(parsed.l + lightShift, 0, 100);
        return `hsl(${h}, ${s}%, ${l}%)`;
      }

      function pastelColour(rng) {
        const hue = Math.floor(rng() * 360);
        const sat = 55 + rng() * 20;
        const light = 78 + rng() * 10;
        return `hsl(${hue}, ${sat}%, ${light}%)`;
      }

      function jitterBlendValue(baseTime, speed, amount, waveFn, cadence = 1.1, hold = 0.68) {
        const cycleTime = baseTime * cadence;
        const cycleIndex = Math.floor(cycleTime);
        const phase = cycleTime - cycleIndex;
        const t0 = cycleIndex / cadence;
        const t1 = (cycleIndex + 1) / cadence;
        const v0 = waveFn(t0 * speed) * amount;
        const v1 = waveFn(t1 * speed) * amount;
        if (phase <= hold) return v0;
        const u = (phase - hold) / (1 - hold);
        const eased = u * u * (3 - 2 * u);
        return v0 + (v1 - v0) * eased;
      }

      function makeRegularPolygonPoints(sides, radius, rotation = 0) {
        const points = [];
        for (let i = 0; i < sides; i++) {
          const angle = rotation + (Math.PI * 2 * i) / sides - Math.PI / 2;
          points.push({ x: Math.cos(angle) * radius, y: Math.sin(angle) * radius });
        }
        return points;
      }

      function drawRoundedPolygonPath(points, cornerRadius) {
        if (!points || points.length < 3) return;

        const radius = Math.max(0, cornerRadius);
        const getPoint = (index) => points[(index + points.length) % points.length];

        ctx.beginPath();

        for (let i = 0; i < points.length; i++) {
          const prev = getPoint(i - 1);
          const curr = getPoint(i);
          const next = getPoint(i + 1);

          const vx1 = prev.x - curr.x;
          const vy1 = prev.y - curr.y;
          const len1 = Math.hypot(vx1, vy1) || 1;

          const vx2 = next.x - curr.x;
          const vy2 = next.y - curr.y;
          const len2 = Math.hypot(vx2, vy2) || 1;

          const usableRadius = Math.min(radius, len1 * 0.45, len2 * 0.45);

          const startX = curr.x + (vx1 / len1) * usableRadius;
          const startY = curr.y + (vy1 / len1) * usableRadius;
          const endX = curr.x + (vx2 / len2) * usableRadius;
          const endY = curr.y + (vy2 / len2) * usableRadius;

          if (i === 0) ctx.moveTo(startX, startY);
          else ctx.lineTo(startX, startY);

          ctx.quadraticCurveTo(curr.x, curr.y, endX, endY);
        }

        ctx.closePath();
      }

      function lineThickness(baseSize, style, multiplier = 1) {
        const base = Math.max(2, baseSize * 0.06);
        const styleBoost = style && style.thicknessMode === "double" ? 1.6 : 1;
        return base * styleBoost * multiplier;
      }

      function pointOnCircle(radius, angle) {
        return { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
      }

      function varyAroundBase(rng, base, spread = 0.2, min = 0) {
        return Math.max(min, base * range(rng, 1 - spread, 1 + spread));
      }

      function buildAnchorAngleSequence(rng, count, looseness) {
        const angles = [];
        const slots = [];
        for (let i = 0; i < count; i++) {
          const baseAngle = (Math.PI * 2 * i) / count;
          const evenJitter = range(rng, -0.15, 0.15) * (1 - looseness);
          const looseJitter = range(rng, -Math.PI / 2.2, Math.PI / 2.2) * looseness;
          slots.push(baseAngle + evenJitter + looseJitter);
        }
        slots.sort((a, b) => a - b);
        for (let i = 0; i < slots.length; i++) angles.push(slots[i]);
        return angles;
      }

      function samplePerimeterAnchors(rng, radius, count, looseness) {
        return buildAnchorAngleSequence(rng, count, looseness).map((angle, index) => {
          const p = pointOnCircle(radius, angle);
          return { index, angle, x: p.x, y: p.y };
        });
      }

      function samplePerimeterAnchorsNormalized(rng, count, looseness) {
        return buildAnchorAngleSequence(rng, count, looseness).map((angle, index) => ({
          index,
          angle,
          x: Math.cos(angle),
          y: Math.sin(angle)
        }));
      }

      function drawSoftCurlPath(size) {
        ctx.beginPath();
        ctx.moveTo(size * 0.28, -size * 0.48);
        ctx.quadraticCurveTo(-size * 0.16, -size * 0.62, -size * 0.34, -size * 0.16);
        ctx.quadraticCurveTo(-size * 0.45, size * 0.2, -size * 0.1, size * 0.28);
        ctx.quadraticCurveTo(size * 0.22, size * 0.34, size * 0.28, 0);
      }

      class DriftyShape {
        constructor(x, y, colour) {
          this.baseX = x;
          this.baseY = y;
          this.x = x;
          this.y = y;
          this.colour = colour;
          this.rotation = 0;
          this.scaleX = 1;
          this.scaleY = 1;
          this.driftAmountX = 0;
          this.driftAmountY = 0;
          this.driftSpeedX = 0;
          this.driftSpeedY = 0;
          this.timeOffset = 0;
          this.shimmerStrength = 0;
          this.shimmerRate = 5;
          this.localPhaseOffset = 0;
          this.driftGroup = null;
          this.profile = null;
          this.motionLayer = "feature";
        }

        update(time) {
          if (this.driftGroup) {
            this.x = this.baseX + this.driftGroup.x;
            this.y = this.baseY + this.driftGroup.y;
            return;
          }
          const t = time * 0.001 + this.timeOffset;
          this.x = this.baseX + Math.sin(t * this.driftSpeedX) * this.driftAmountX;
          this.y = this.baseY + Math.cos(t * this.driftSpeedY) * this.driftAmountY;
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.scale(this.scaleX, this.scaleY);
          this.drawSelf();
          ctx.restore();
        }

        drawSelf() {}
      }
      let driftGroups = [];
        let shapes = [];
      class TaurusHornShape extends DriftyShape {
        constructor(x, y, length, width, colour, side) {
          super(x, y, colour);
          this.length = length;
          this.width = width;
          this.side = side;
        }

        drawSelf() {
          const halfW = this.width / 2;
          const r = halfW;
          const shaft = Math.max(0, this.length - r);
          ctx.fillStyle = this.colour;
          ctx.beginPath();
          ctx.moveTo(-halfW, 0);
          ctx.lineTo(-halfW, -shaft);
          ctx.arc(0, -shaft, r, Math.PI, 0, false);
          ctx.lineTo(halfW, 0);
          ctx.closePath();
          ctx.fill();
        }
      }
    class CapriHornShape extends DriftyShape {
      constructor(x, y, length, width, colour, side) {
        super(x, y, colour);
        this.length = length;
        this.width = width;
        this.side = side; 
      }
    
      drawSelf() {
        const dir = this.side === "left" ? -1 : 1;
        const stroke = this.width;
    
        ctx.strokeStyle = this.colour;
        ctx.lineWidth = stroke;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
    
        ctx.beginPath();
        ctx.moveTo(0, 0);
    
        ctx.bezierCurveTo(
          dir * this.length * 0.18, -this.length * 0.18,
          dir * this.length * 0.34, -this.length * 0.48,
          dir * this.length * 0.18, -this.length * 0.72
        );
    
        ctx.bezierCurveTo(
          dir * this.length * 0.02, -this.length * 0.96,
          -dir * this.length * 0.18, -this.length * 0.92,
          -dir * this.length * 0.12, -this.length * 0.68
        );
    
        ctx.stroke();
      }
    }

      const MOTION_PRESETS = {
        creature: {
          amountXMin: 2.5, amountXMax: 7.5,
          amountYMin: 2.0, amountYMax: 6.5,
          speedXMin: 0.08, speedXMax: 0.16,
          speedYMin: 0.08, speedYMax: 0.16,
          shimmerStrength: 0
        },
        faceGroup: {
          amountXMin: 2.2, amountXMax: 4.8,
          amountYMin: 0.4, amountYMax: 1.3,
          speedXMin: 0.18, speedXMax: 0.32,
          speedYMin: 0.12, speedYMax: 0.2,
          shimmerStrength: 0.15,
          jitterHold: 0.68,
          jitterBurst: 3.3
        }
      };

      function getAmplitudeClass(rng) {
        const roll = rng();
        if (roll < 0.5) return { name: "tiny", multiplier: 0.75 };
        if (roll < 0.82) return { name: "medium", multiplier: 1.0 };
        if (roll < 0.95) return { name: "loose", multiplier: 1.35 };
        return { name: "galaxy", multiplier: 1.8 };
      }

      function getActivityType(rng) {
        const roll = rng();
        if (roll < 0.35) return "hover";
        if (roll < 0.62) return "scan";
        if (roll < 0.82) return "sine";
        if (roll < 0.92) return "float";
        return "still";
      }

      function getShimmerStrength(rng) {
        const roll = rng();
        if (roll < 0.58) return 0;
        if (roll < 0.86) return 0.45;
        return 0.9;
      }

      function buildMotionProfile(seed) {
        const rng = createRNG(seed * 13.17 + 91);
        const amplitudeClass = getAmplitudeClass(rng);
        const wobbleType = rng() < 0.28 ? "jittery" : "normal";
        const shimmerStrength = getShimmerStrength(rng);
        const calmness = range(rng, 0.15, 0.92);
        const elasticity = range(rng, 0.25, 1.8);
        const activityType = getActivityType(rng);
        const activityLevel = Math.pow(range(rng, 0.05, 0.7), 1.4);
        const axisBias = range(rng, -1, 1);
        const speedMultiplier = range(rng, 0.7, 1.35);
        const masterFrequency = range(rng, 0.65, 1.25);
        const masterPhase = rng() * Math.PI * 2;

        return {
          seed,
          amplitudeClass,
          wobbleType,
          shimmerStrength,
          calmness,
          elasticity,
          activityType,
          activityLevel,
          axisBias,
          speedMultiplier,
          amplitudeMultiplier: amplitudeClass.multiplier,
          masterFrequency,
          masterPhase,

          getPulseTime(time, localPhaseOffset = 0) {
            return time * 0.001 * this.masterFrequency + this.masterPhase + localPhaseOffset * (1 - this.calmness) * 2.6;
          },

          getActivityVector(time, localPhaseOffset = 0) {
            const t = time * 0.001 * this.masterFrequency + this.masterPhase + localPhaseOffset;
            const level = this.activityLevel;
            const stillness = 1 - level;
            const horizontalFavor = 1 + Math.max(0, this.axisBias) * 0.85;
            const verticalFavor = 1 + Math.max(0, -this.axisBias) * 0.85;

            if (this.activityType === "still") {
              return { xScale: 0.5 + level * 0.4, yScale: 0.5 + level * 0.35, speedScaleX: 0.9, speedScaleY: 0.9 };
            }
            if (this.activityType === "scan") {
              return {
                xScale: (0.72 + level * 0.9) * horizontalFavor,
                yScale: 0.3 + level * 0.18,
                speedScaleX: 1.08 + level * 0.34,
                speedScaleY: 0.82 + level * 0.12
              };
            }
            if (this.activityType === "sine") {
              return {
                xScale: 0.68 + level * 0.5,
                yScale: (0.58 + level * 0.65) * verticalFavor,
                speedScaleX: 0.92 + level * 0.18,
                speedScaleY: 1.08 + level * 0.28
              };
            }
            if (this.activityType === "float") {
              return {
                xScale: 0.6 + level * 0.48,
                yScale: 0.6 + level * 0.52,
                speedScaleX: 0.85 + Math.sin(t * 0.7) * 0.08,
                speedScaleY: 0.88 + Math.cos(t * 0.76) * 0.08
              };
            }
            return {
              xScale: 0.55 + level * 0.32 + (1 - stillness) * Math.max(0, this.axisBias) * 0.15,
              yScale: 0.55 + level * 0.32 + (1 - stillness) * Math.max(0, -this.axisBias) * 0.15,
              speedScaleX: 0.95 + level * 0.12,
              speedScaleY: 0.95 + level * 0.12
            };
          },

          getLayerSync(layerName) {
            const calm = this.calmness;
            const axisX = this.axisBias >= 0 ? 1 + this.axisBias * 0.4 : 1 + this.axisBias * 0.12;
            const axisY = this.axisBias <= 0 ? 1 + (-this.axisBias) * 0.22 : 0.75;
            const loose = 1 + this.elasticity * 0.34;

            if (layerName === "head") return { x: 0.12, y: 0.12, speedX: 0.92, speedY: 0.92 };
            if (layerName === "creature") {
              return {
                x: 0.48 * axisX,
                y: 0.38 * (axisY + 0.25),
                speedX: 0.82 + calm * 0.18,
                speedY: 0.82 + calm * 0.18
              };
            }
            if (layerName === "faceGroup") {
              return {
                x: 1.08 * axisX,
                y: 0.36 + Math.max(0, -this.axisBias) * 0.1,
                speedX: 0.94 + (1 - calm) * 0.16,
                speedY: 0.88 + (1 - calm) * 0.08
              };
            }
            if (layerName === "faceFeature") {
              return {
                x: 0.18 + (1 - calm) * 0.14,
                y: 0.08 + (1 - calm) * 0.06,
                speedX: 0.96,
                speedY: 0.96
              };
            }
            if (layerName === "bodyNode") {
              return {
                x: 0.82 * loose,
                y: 0.82 * loose,
                speedX: 0.92 + (1 - calm) * 0.14,
                speedY: 0.92 + (1 - calm) * 0.14
              };
            }
            if (layerName === "connector") {
              return {
                x: 1.1 * loose,
                y: 1.1 * loose,
                speedX: 1 + (1 - calm) * 0.22,
                speedY: 1 + (1 - calm) * 0.22
              };
            }
            return { x: 1, y: 1, speedX: 1, speedY: 1 };
          }
        };
      }

            class DriftGroup {
        constructor(config = {}) {
          this.kind = config.kind || "group";
          this.profile = config.profile || null;
          this.baseAmountX = config.baseAmountX || 0;
          this.baseAmountY = config.baseAmountY || 0;
          this.amountX = this.baseAmountX;
          this.amountY = this.baseAmountY;
          this.baseSpeedX = config.baseSpeedX || 0.2;
          this.baseSpeedY = config.baseSpeedY || 0.2;
          this.speedX = this.baseSpeedX;
          this.speedY = this.baseSpeedY;
          this.timeOffset = config.timeOffset || 0;
          this.localPhaseOffset = config.localPhaseOffset || 0;
          this.x = 0;
          this.y = 0;
          this.shimmerStrength = config.shimmerStrength || 0;
          this.shimmerRate = config.shimmerRate || 4;
          this.jitterHold = config.jitterHold || 0.55;
          this.jitterBurst = config.jitterBurst || 3.8;
          this.layerName = config.layerName || "group";
          this.parentGroup = config.parentGroup || null;
        }

        update(time) {
          const profile = this.profile;
          if (!profile) {
            const t = time * 0.001 + this.timeOffset;
            this.x = Math.sin(t * this.speedX) * this.amountX;
            this.y = Math.cos(t * this.speedY) * this.amountY;
            return;
          }

          const pulseT = profile.getPulseTime(time, this.localPhaseOffset);
          const activity = profile.getActivityVector(time, this.localPhaseOffset);
          const sync = profile.getLayerSync(this.layerName);

          this.amountX = this.baseAmountX * profile.amplitudeMultiplier * activity.xScale * sync.x;
          this.amountY = this.baseAmountY * profile.amplitudeMultiplier * activity.yScale * sync.y;
          this.speedX = this.baseSpeedX * profile.speedMultiplier * activity.speedScaleX * sync.speedX;
          this.speedY = this.baseSpeedY * profile.speedMultiplier * activity.speedScaleY * sync.speedY;

          let sx = Math.sin(pulseT * this.speedX) * this.amountX;
          let sy = Math.cos(pulseT * this.speedY) * this.amountY;

          if (profile.wobbleType === "jittery") {
            const cadence = 0.75 * this.jitterBurst;
            sx = jitterBlendValue(pulseT, this.speedX, this.amountX, Math.sin, cadence, this.jitterHold);
            sy = jitterBlendValue(pulseT, this.speedY, this.amountY, Math.cos, cadence, this.jitterHold);
          }

          if (profile.shimmerStrength > 0 && this.shimmerStrength > 0) {
            const shimmerT = time * 0.001 * (profile.speedMultiplier * this.shimmerRate) + this.timeOffset + this.localPhaseOffset * 4;
            sx += Math.sin(shimmerT) * this.shimmerStrength * profile.shimmerStrength;
            sy += Math.cos(shimmerT * 1.13) * this.shimmerStrength * profile.shimmerStrength;
          }

          const parentX = this.parentGroup ? this.parentGroup.x : 0;
          const parentY = this.parentGroup ? this.parentGroup.y : 0;
          this.x = parentX + sx;
          this.y = parentY + sy;
        }
      }
      function createDriftGroup(config) {
        const group = new DriftGroup(config);
        driftGroups.push(group);
        return group;
      }

      function createCreatureDriftGroup(rng, profile, presetName, layerName) {
        const preset = MOTION_PRESETS[presetName];
        return createDriftGroup({
          kind: presetName,
          profile,
          baseAmountX: range(rng, preset.amountXMin, preset.amountXMax),
          baseAmountY: range(rng, preset.amountYMin, preset.amountYMax),
          baseSpeedX: range(rng, preset.speedXMin, preset.speedXMax),
          baseSpeedY: range(rng, preset.speedYMin, preset.speedYMax),
          timeOffset: rng() * 1000,
          localPhaseOffset: range(rng, 0, 1),
          shimmerStrength: preset.shimmerStrength || 0,
          shimmerRate: preset.shimmerRate || 4,
          jitterHold: preset.jitterHold || 0.55,
          jitterBurst: preset.jitterBurst || 3.8,
          layerName,
          parentGroup: null
        });
      }

if (headSpec.type === "circle" && headSpec.circleVariant === "gemini") {

      function getSeededBodyMutationSpec(seed) {
        const rng = createRNG(seed * 211.13 + 3.9);
        const choice = weightedChoice([
          { name: "triangle", weight: 7 },
          { name: "roundedTriangle", weight: 4 },
          { name: "roundedSquare", weight: 4 },
          { name: "roundedDiamond", weight: 4 },
          { name: "pentagon", weight: 2 },
          { name: "ellipseHorizontal", weight: 2 },
          { name: "ellipseVertical", weight: 2 },
          { name: "doubleLump", weight: 0.5 },
          { name: "gemini", weight: 0.15 }
        ], rng);

        if (choice === "triangle" || choice === "roundedTriangle") return { type: "roundedTriangle", localRotation: 0 };
        if (choice === "roundedSquare") return { type: "roundedSquare", localRotation: 0 };
        if (choice === "roundedDiamond") return { type: "roundedDiamond", localRotation: 0 };
        if (choice === "pentagon") return { type: "pentagon", localRotation: 0 };
        if (choice === "ellipseHorizontal") return { type: "circle", circleVariant: "ellipseHorizontal", localRotation: 0 };
        if (choice === "ellipseVertical") return { type: "circle", circleVariant: "ellipseVertical", localRotation: 0 };
        if (choice === "doubleLump") {
          return {
            type: "circle",
            circleVariant: "doubleLump",
            circleRotation: range(rng, -Math.PI / 7, Math.PI / 7),
            lumpOffsetX: range(rng, -3, 3),
            lumpOffsetY: range(rng, -3, 3),
            localRotation: 0
          };
        }

        return {
          type: "circle",
          circleVariant: "gemini",
          geminiAngle: rng() * Math.PI * 2,
          geminiRadiusScale: range(rng, 0.6, 1.0),
          geminiOffsetScale: range(rng, 0.38, 0.58),
          localRotation: 0
        };
      }

      function getSeededBodySequenceRule(seed) {
        const rng = createRNG(seed * 317.77 + 19.2);
        const sequenceName = weightedChoice([
          { name: "every2", weight: 2.5 },
          { name: "every3", weight: 5 },
          { name: "every4", weight: 2 },
          { name: "CCM", weight: 5 },
          { name: "MMC", weight: 2.5 },
          { name: "CCMM", weight: 4 },
          { name: "CCCM", weight: 1.5 },
          { name: "MMMC", weight: 0.8 },
          { name: "prime", weight: 0.6 },
          { name: "fibonacci", weight: 0.35 }
        ], rng);

        const checkPrime = (n) => {
          if (n < 2) return false;
          for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
          return true;
        };
        const checkFibonacci = (n) => {
          if (n < 0) return false;
          let a = 0, b = 1;
          while (a < n) {
            const next = a + b;
            a = b;
            b = next;
          }
          return a === n;
        };
        const checkPeriodic = (index, every, phase = 0) => ((index - phase) % every + every) % every === 0;
        const checkGroupedPattern = (index, pattern) => pattern[index % pattern.length] === "M";

        if (sequenceName === "every2") return { label: "every2", kind: "periodic", isMutationTrigger(index) { return checkPeriodic(index, 2, 1); } };
        if (sequenceName === "every3") return { label: "every3", kind: "periodic", isMutationTrigger(index) { return checkPeriodic(index, 3, 2); } };
        if (sequenceName === "every4") return { label: "every4", kind: "periodic", isMutationTrigger(index) { return checkPeriodic(index, 4, 3); } };
        if (sequenceName === "CCM") return { label: "CCM", kind: "grouped", isMutationTrigger(index) { return checkGroupedPattern(index, ["C", "C", "M"]); } };
        if (sequenceName === "MMC") return { label: "MMC", kind: "grouped", isMutationTrigger(index) { return checkGroupedPattern(index, ["M", "M", "C"]); } };
        if (sequenceName === "CCMM") return { label: "CCMM", kind: "grouped", isMutationTrigger(index) { return checkGroupedPattern(index, ["C", "C", "M", "M"]); } };
        if (sequenceName === "CCCM") return { label: "CCCM", kind: "grouped", isMutationTrigger(index) { return checkGroupedPattern(index, ["C", "C", "C", "M"]); } };
        if (sequenceName === "MMMC") return { label: "MMMC", kind: "grouped", isMutationTrigger(index) { return checkGroupedPattern(index, ["M", "M", "M", "C"]); } };
        if (sequenceName === "prime") return { label: "prime", kind: "prime", isMutationTrigger(index) { return checkPrime(index); } };
        return { label: "fibonacci", kind: "fibonacci", isMutationTrigger(index) { return checkFibonacci(index); } };
      }

      function getSeededPrimaryBodySpec(seed, headSpec) {
        const rng = createRNG(seed * 457.91 + 23.4);
        const law = headSpec && headSpec.headLaw ? headSpec.headLaw : "standard";

        if (law === "gemini") {
          return {
            headLaw: "gemini",
            type: "circle",
            circleVariant: "gemini",
            geminiAngle: rng() * Math.PI * 2,
            geminiRadiusScale: range(rng, 0.62, 0.94),
            geminiOffsetScale: range(rng, 0.34, 0.52),
            localRotation: 0
          };
        }
        if (law === "leo") {
          return {
            headLaw: "standard",
            zodiacBodyLaw: "leo",
            type: "circle",
            circleVariant: "trueCircle",
            localRotation: 0,
            leoBodyQuality: {
              pointCount: Math.floor(range(rng, 6, 13)),

              shape: weightedChoice([
                { name: "triangle", weight: 6 },

              ], rng),

              overlapBase: range(rng, -0.03, 0.05),
              colourLift: range(rng, 4, 12)
            }
          };
        }
        if (law === "cancer") {
          return {
            headLaw: "standard",
            zodiacBodyLaw: "cancer",
            type: "circle",
            circleVariant: "trueCircle",
            localRotation: 0,
            cancerBodyQuality: {
              pointCount: Math.floor(range(rng, 2, 6)),

              tipShape: weightedChoice([
                { name: "circle", weight: 6 },
                { name: "roundedTriangle", weight: 4 },
                { name: "roundedSquare", weight: 4 }
              ], rng),
              stemLengthBase: range(rng, 0.14, 0.28),
              stemThicknessBase: range(rng, 0.04, 0.09),
              tipSizeBase: range(rng, 0.06, 0.13),
              stemLightShift: range(rng, -8, 6)
            }
          };
        }
        if (law === "libra") {
          return {
            headLaw: "standard",
            zodiacBodyLaw: "libra",
            type: "circle",
            circleVariant: "trueCircle",
            localRotation: 0,
            libraScale: range(rng, 1.05, 1.16)
          };
        }
        return { headLaw: "standard", type: "circle", circleVariant: "trueCircle", localRotation: 0 };
      }

      function getSeededBodyPlan(seed, headSpec) {
        return {
          zodiacLaw: headSpec && headSpec.headLaw ? headSpec.headLaw : "standard",
          primarySpec: getSeededPrimaryBodySpec(seed, headSpec),
          mutationSpec: getSeededBodyMutationSpec(seed),

        };

      function buildLeoBodyExtras(leoBodyQuality, nodeRadius, nodeColour, rng) {
        const anchors = samplePerimeterAnchorsNormalized(rng, leoBodyQuality.pointCount, leoBodyQuality.anchorLooseness);
        return {
          kind: "leoBodyExtras",
          parts: anchors.map(anchor => ({
            shape: leoBodyQuality.shape,

            distance: nodeRadius + leoBodyQuality.overlapBase * nodeRadius,

          }))

      }

      function buildCancerBodyExtras(cancerBodyQuality, nodeRadius, nodeColour, rng) {
        const anchors = samplePerimeterAnchorsNormalized(rng, cancerBodyQuality.pointCount, cancerBodyQuality.anchorLooseness);
        return {
          kind: "cancerBodyExtras",

          }))
        };

      function getBodyNodeExtrasForIndex(index, bodyPlan, nodeRadius, nodeColour, seed) {
        if (bodyPlan.sequenceRule.isMutationTrigger(index)) return null;
        const spec = bodyPlan.primarySpec;
        const law = spec.zodiacBodyLaw || "standard";
        const rng = createRNG(seed * 613.7 + index * 17.2 + 9);
        if (law === "leo") return buildLeoBodyExtras(spec.leoBodyQuality, nodeRadius, nodeColour, rng);
        if (law === "cancer") return buildCancerBodyExtras(spec.cancerBodyQuality, nodeRadius, nodeColour, rng);
        return null;
      }

      function copySpec(spec) {
        return JSON.parse(JSON.stringify(spec));
      }

      function getBodyNodeSpecForIndex(index, bodyPlan) {
        return bodyPlan.sequenceRule.isMutationTrigger(index)
          ? copySpec(bodyPlan.mutationSpec)
          : copySpec(bodyPlan.primarySpec);
      }

      function instantiateBodyNodeAt(x, y, radius, colour, bodyPlan, index) {
        return new MorphShape(x, y, radius, colour, getBodyNodeSpecForIndex(index, bodyPlan));
      }

      function getConstellationSignature(rng) {
        const archetypes = ["quadruped", "serpentine", "upright", "winged", "cluster"];
        return {
          archetype: chooseOne(archetypes, rng),
          readability: range(rng, 0.35, 0.9),
          bodyNodeCount: Math.floor(range(rng, 5, 11)),
          widthBias: range(rng, 0.6, 1.35),
          heightBias: range(rng, 0.55, 1.3),
          asymmetry: range(rng, 0.05, 0.35),
          connectorDensity: range(rng, 0.45, 0.95),
          orbitalChance: range(rng, 0.1, 0.35)
        };
      }

      function jitterPoint(point, rng, amount) {
        return { x: point.x + (rng() - 0.5) * amount, y: point.y + (rng() - 0.5) * amount };
      }

      function buildBaseConstellationPoints(signature, headRadius, rng) {
        const hr = headRadius;
        const spreadX = hr * 1.15 * signature.widthBias;
        const spreadY = hr * 1.1 * signature.heightBias;
        const archetype = signature.archetype;

        if (archetype === "quadruped") {
          return [
            { x: 0, y: 0 },
            { x: spreadX * 0.35, y: spreadY * 0.05 },
            { x: spreadX * 0.68, y: spreadY * -0.08 },
            { x: spreadX * 0.9, y: spreadY * -0.15 },
            { x: spreadX * 0.15, y: spreadY * 0.55 },
            { x: spreadX * 0.55, y: spreadY * 0.58 },
            { x: spreadX * 0.85, y: spreadY * 0.4 }
          ].slice(0, signature.bodyNodeCount);
        }

        if (archetype === "serpentine") {
          const points = [];
          const count = signature.bodyNodeCount;
          for (let i = 0; i < count; i++) {
            const t = count === 1 ? 0 : i / (count - 1);
            points.push({
              x: (t - 0.5) * spreadX * 1.4,
              y: Math.sin(t * Math.PI * 1.4) * spreadY * 0.45 + t * spreadY * 0.3
            });
          }
          return points;
        }

        if (archetype === "upright") {
          return [
            { x: 0, y: 0 },
            { x: 0, y: spreadY * 0.35 },
            { x: 0, y: spreadY * 0.7 },
            { x: -spreadX * 0.3, y: spreadY * 0.35 },
            { x: spreadX * 0.3, y: spreadY * 0.35 },
            { x: -spreadX * 0.18, y: spreadY * 1.08 },
            { x: spreadX * 0.18, y: spreadY * 1.08 }
          ].slice(0, signature.bodyNodeCount);
        }

        if (archetype === "winged") {
          return [
            { x: 0, y: 0 },
            { x: -spreadX * 0.32, y: spreadY * 0.18 },
            { x: spreadX * 0.32, y: spreadY * 0.18 },
            { x: -spreadX * 0.7, y: spreadY * -0.1 },
            { x: spreadX * 0.7, y: spreadY * -0.1 },
            { x: 0, y: spreadY * 0.52 },
            { x: 0, y: spreadY * 0.92 }
          ].slice(0, signature.bodyNodeCount);
        }

        const clusterPoints = [];
        for (let i = 0; i < signature.bodyNodeCount; i++) {
          const angle = (Math.PI * 2 * i) / signature.bodyNodeCount;
          const ring = hr * range(rng, 0.25, 1.0);
          clusterPoints.push({
            x: Math.cos(angle) * ring * signature.widthBias,
            y: Math.sin(angle) * ring * signature.heightBias + spreadY * 0.4
          });
        }
        return clusterPoints;
      }

      function deriveCreatureSpace(cx, cy, headRadius) {
        return {
          head: { x: cx, y: cy },
          bodyAnchor: { x: cx, y: cy + headRadius * 1.15 }
        };

      function generateConstellationBody(bodyAnchor, headRadius, headColour, rng, profile, creatureGroup, bodyPlan, seed) {
        const signature = getConstellationSignature(rng);
        const bodyNodeRadius = headRadius * 0.75;
        const glyphColour = darkerColour(headColour, 28);
        const bodyNodeColour = darkerColour(headColour, 10);

        const basePoints = buildBaseConstellationPoints(signature, headRadius, rng)
          .map(p => jitterPoint(p, rng, headRadius * (1 - signature.readability) * 0.7 + headRadius * 0.08))
          .map(p => ({
            x: p.x + (rng() - 0.5) * headRadius * signature.asymmetry,
            y: p.y
          }));

        const bodyNodes = basePoints.map(p => ({
          x: bodyAnchor.x + p.x,
          y: bodyAnchor.y + p.y
        }));

        const bodyNodeConfig = {
          amountXMin: 1.8, amountXMax: 4.8,
          amountYMin: 1.8, amountYMax: 4.8,
          speedXMin: 0.12, speedXMax: 0.24,
          speedYMin: 0.12, speedYMax: 0.24,
          shimmerStrength: 0.16,
          shimmerRate: 6,
          driftGroup: creatureGroup,
          profile,
          layerName: "bodyNode"
        };

        const connectorConfig = {
          amountXMin: 3.4, amountXMax: 8.2,
          amountYMin: 3.4, amountYMax: 8.2,
          speedXMin: 0.16, speedXMax: 0.3,
          speedYMin: 0.16, speedYMax: 0.3,
          shimmerStrength: 0.28,
          shimmerRate: 7,
          driftGroup: creatureGroup,
          profile,
          layerName: "connector"
        };

        bodyNodes.forEach((bodyNode, index) => {
          const nodeRadius = bodyNodeRadius * range(rng, 0.38, 0.52);
          const instance = instantiateBodyNodeAt(bodyNode.x, bodyNode.y, nodeRadius, bodyNodeColour, bodyPlan, index);
          instance.bodyExtras = getBodyNodeExtrasForIndex(index, bodyPlan, nodeRadius, bodyNodeColour, seed);
          applyMotionToPart(instance, bodyNodeConfig, index, rng);
          shapes.push(instance);
        });

        const edges = [];
        for (let i = 0; i < bodyNodes.length - 1; i++) {
          if (rng() < signature.connectorDensity || i === 0) edges.push([i, i + 1]);
        }

        if (signature.archetype === "quadruped" && bodyNodes.length >= 6) edges.push([0, 4], [1, 5]);
        if (signature.archetype === "winged" && bodyNodes.length >= 5) edges.push([1, 3], [2, 4]);

        edges.forEach((edge) => {
          const a = bodyNodes[edge[0]];
          const b = bodyNodes[edge[1]];
          const midCount = 1 + Math.floor(range(rng, 1, 4));

          for (let i = 0; i < midCount; i++) {
            const t = (i + 1) / (midCount + 1);
            const gx = a.x + (b.x - a.x) * t + (rng() - 0.5) * headRadius * 0.16;
            const gy = a.y + (b.y - a.y) * t + (rng() - 0.5) * headRadius * 0.16;
            const glyphName = weightedChoice(FEATURE_POOLS.connector, rng);
            const style = chooseStyleForGlyph(glyphName, rng);
            const scale = range(rng, 0.42, 0.72);
            const parts = createGlyphAt(glyphName, gx, gy, headRadius, glyphColour, style, {
              featureScale: scale,
              slotSide: i % 2 === 0 ? "left" : "right"
            });
            addParts(parts, rng, connectorConfig);
          }

          if (rng() < signature.orbitalChance) {
            const anchor = rng() < 0.5 ? a : b;
            const orbitGlyph = weightedChoice(FEATURE_POOLS.connector, rng);
            const orbitStyle = chooseStyleForGlyph(orbitGlyph, rng);
            const angle = rng() * Math.PI * 2;
            const dist = headRadius * range(rng, 0.18, 0.32);
            const ox = anchor.x + Math.cos(angle) * dist;
            const oy = anchor.y + Math.sin(angle) * dist;
            const orbitParts = createGlyphAt(orbitGlyph, ox, oy, headRadius, glyphColour, orbitStyle, {
              featureScale: range(rng, 0.3, 0.55),
              slotSide: chooseOne(["left", "right", "center"], rng)
            });
            addParts(orbitParts, rng, connectorConfig);
          }
        });
      }

      function buildCreatureAt(cx, cy, headRadius, featureScale, headColour, controls, seed) {
        const creatureSpace = deriveCreatureSpace(cx, cy, headRadius);
        const profile = buildMotionProfile(seed);
        const masterRng = createRNG(seed * 97.3 + 11);
        const creatureGroup = createCreatureDriftGroup(masterRng, profile, "creature", "creature");
        const faceGroup = createCreatureDriftGroup(masterRng, profile, "faceGroup", "faceGroup");
        faceGroup.parentGroup = creatureGroup;

        const headSpec = getSeededHeadSpec(seed);
        const faceLayoutSpec = getSeededFaceLayoutSpec(seed);
        const bodyPlan = getSeededBodyPlan(seed, headSpec);

        if (controls.bodyConstellation) {
          generateConstellationBody(
            creatureSpace.bodyAnchor,
            headRadius,
            headColour,
            createRNG(seed * 53 + 17),
            profile,
            creatureGroup,
            bodyPlan,
            seed
          );

        const head = new MorphShape(creatureSpace.head.x, creatureSpace.head.y, headRadius, headColour, headSpec);
        head.rotation = headSpec.localRotation || 0;
        applyMotionToPart(head, {
          amountXMin: 0.02, amountXMax: 0.08,

          speedXMin: 0.05, speedXMax: 0.09,
          speedYMin: 0.05, speedYMax: 0.09,
          shimmerStrength: 0,
          driftGroup: creatureGroup,
          profile,
          layerName: "head"
        }, 0, masterRng);
        shapes.push(head);

        buildFaceGlyphs(
          creatureSpace.head.x,
          creatureSpace.head.y,
          headRadius,
          featureScale,
          "#222",
          controls,
          createRNG(seed * 71 + 31),
          faceGroup,
          profile,
          headSpec,
          faceLayoutSpec,
          headColour
        );
      }

      function populateScene() {
        shapes = [];
        driftGroups = [];

        const controls = getControls();

        if (controls.viewMode === "single") {
          const seed = controls.selectedSeed;
          const cx = canvas.width / 2;
          const cy = canvas.height / 2 - 20;
          const sizeRng = createRNG(seed * 2);
          const featureRng = createRNG(seed * 3);
          const colourRng = createRNG(seed);

          const radius = range(sizeRng, 90, 100);
          const featureScale = range(featureRng, 0.8, 1.1);
          const colour = pastelColour(colourRng);

          buildCreatureAt(cx, cy, radius, featureScale, colour, controls, seed);
          return;
        }

        const cols = Math.max(1, controls.cols);
        const rows = Math.max(1, controls.rows);

        const padX = cols === 1 ? 40 : 80;
        const padY = rows === 1 ? 40 : 80;
        const minX = padX;
        const maxX = canvas.width - padX;
        const minY = padY;
        const maxY = canvas.height - padY;

        const xPositions = [];
        const yPositions = [];

        if (cols === 1) {
          xPositions.push(canvas.width / 2);
        } else {
          const stepX = (maxX - minX) / (cols - 1);
          for (let col = 0; col < cols; col++) xPositions.push(minX + col * stepX);
        }

        if (rows === 1) {
          yPositions.push(canvas.height / 2);
        } else {
          const stepY = (maxY - minY) / (rows - 1);
          for (let row = 0; row < rows; row++) yPositions.push(minY + row * stepY);
        }

        let positionSeed = 1;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const cx = xPositions[col];
            const cy = yPositions[row];
            const sizeRng = createRNG(positionSeed * 2);
            const featureRng = createRNG(positionSeed * 3);
            const colourRng = createRNG(positionSeed);

            const radius = range(sizeRng, 65, 70);
            const featureScale = range(featureRng, 0.7, 1.05);
            const colour = pastelColour(colourRng);

            buildCreatureAt(cx, cy, radius, featureScale, colour, controls, positionSeed);
            positionSeed++;
          }
        }
      }

      function update(time) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        driftGroups.forEach(group => group.update(time));
        shapes.forEach(shape => {
          shape.update(time);
          shape.draw();
        });
        requestAnimationFrame(update);
      }

      function syncModeUI() {
        const isSingle = viewModeInput.value === "single";
        seedInput.disabled = false;
        prevSeedBtn.disabled = false;
        nextSeedBtn.disabled = false;
        randomSeedBtn.disabled = false;
        seedInput.style.opacity = isSingle ? "1" : "0.9";
      }

      function switchToSingleMode() {
        viewModeInput.value = "single";
        syncModeUI();
      }

      function randomSeed() {
        switchToSingleMode();
        const seed = Math.floor(Math.random() * 1000000) + 1;
        setSeedValue(seed);
        populateScene();
      }

      function gameStart() {
        syncModeUI();
        populateScene();
        requestAnimationFrame(update);
      }

      [viewModeInput, colsInput, rowsInput, seedInput, randomBInput, randomEInput, randomNInput, randomMInput, bodyConstellationInput].forEach(input => {
        input.addEventListener("change", () => {
          if (input === viewModeInput) syncModeUI();
          if (input === seedInput) {
            switchToSingleMode();
            setSeedValue(getSafeSeedValue());
          }
          populateScene();
        });
        input.addEventListener("input", () => {
          if (input === seedInput) {
            switchToSingleMode();
            setSeedValue(getSafeSeedValue());
          }
          populateScene();
        });
      });

      prevSeedBtn.addEventListener("click", () => {
        switchToSingleMode();
        setSeedValue(getSafeSeedValue() - 1);
        populateScene();
      });

      nextSeedBtn.addEventListener("click", () => {
        switchToSingleMode();
        setSeedValue(getSafeSeedValue() + 1);
        populateScene();
      });

      randomSeedBtn.addEventListener("click", randomSeed);

      gameStart();
    </script>
  </body>
</html>
