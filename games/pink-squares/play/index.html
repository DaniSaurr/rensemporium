

    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>pink squares!</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
      </head>
      <body>
        <canvas id="myCanvas" width="1200" height="800" style="border:1px solid #d3d3d3;">
        </canvas>
          <br/>
          <p1>
              hi everyone 
          </p1>

          <button onclick = "smooth()"> smooth </button> 
          <button onclick = "generateMap()"> generate new map </button> 
        <script>

          const canvas = document.getElementById("myCanvas");
          const ctx = canvas.getContext("2d");
          canvas.addEventListener('mousemove', mouseMove);
          let mousePos = [];
          let map_width = canvas.width / 5;
          let map_height = canvas.height / 5;
          let map = [[],[]];
          let tempMap = [[],[]]; 
          let density = randomRange(55,69);

          gameStart();

          function mouseMove(event){
            mousePos[0] = event.offsetX;
            mousePos[1] = event.offsetY;
          }
          function gameStart() {
            //initialist the game state
            generateMap();
            update();
          }
          function update()
          {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            if(map)
                {
                    drawMap();
                }
            window.requestAnimationFrame(update);
          }
          function drawMap()
            {
                for(let i = 0; i < map_width; i++)
                    {
                        for(let j = 0; j < map_height; j++)
                            {
                                if(map[i][j] == 0)
                                    {
                                        ctx.fillStyle = "lightpink";
                                        ctx.fillRect(i*5,j*5,5,5)
                                    }
                                else{
                                    ctx.fillStyle = "mistyrose";
                                    ctx.fillRect(i*5,j*5,5,5)
                                }
                            }
                    }
            }

        function generateMap()
            {
                map = [];
                density = randomRange(62,67);
                for(let i = 0; i < map_width; i++)
                    {
                        map[i] = new Array(map_height);
                        tempMap[i] = new Array(map_height);
                    }
                randomFillMap();
                addWalls();
            }
        function generateSmooth()
            {
                generateMap();
                smooth();
            }
            
        function randomFillMap()
            {
                for(let i = 0; i < map_width; i++)
                    {
                        for(let j = 0; j < map_height; j++)
                            {
                                if(randomRange(1,100) > density)
                                    {
                                        map[i][j] = 0;
                                    }
                                else
                                    {
                                        map[i][j] = 1;
                                    }
                            }
                    }
            }
        function updateTempMap()
            {
                for(let i = 0; i < map_width; i++)
                    {
                        for(let j = 0; j < map_height; j++)
                            {
                                tempMap[i][j] = map[i][j];
                            }
                    }
            }
        function updateRealMap()
            {
                for(let i = 1; i < map_width - 1; i++)
                    {
                        for(let j = 0; j < map_height; j++)
                            {
                                map[i][j] = tempMap[i][j];
                            }
                    }
            }
        function addWalls()
            {
                for(let i = 0; i < map_width; i++)
                    {
                        for(let j = 0; j < map_height; j++)
                            {
                                if(i == 0 || i == map_width-1 || j == 0 || j == map_height -1)
                                    {
                                        map[i][j] = 0;
                                    }
                            }
                    }
            }
        
        function smooth()
            {
                updateTempMap();
                for(let i = 0; i < map_width; i++)
                    {
                        for(let j = 0; j < map_height; j++)
                            {
                                if(GetSurroundingWall(i,j) > 4)
                                {
                                    tempMap[i][j] = 1;
                                }
                                else
                                {
                                    tempMap[i][j] = 0;
                                }

                            }
                    }
                updateRealMap();
                addWalls();
            }
        function GetSurroundingWall(x, y)
            {
                let a = checkNorthWest(x,y);
                let b = checkNorth(x,y);
                let c = checkNorthEast(x,y);
                let d = checkEast(x,y);
                let e = checkWest(x,y);
                let f = checkSouthWest(x,y);
                let g = checkSouth(x,y);
                let h = checkSouthEast(x,y);
                
                let count = a+b+c+d+e+f+g+h;
                return count; 
            }

            function checkNorthWest(x,y)
            {
                if(x>0 && x<map_width && y>0 && y<map_height)
                    {
                        let i = map[x-1][y-1];
                        if(i == 1)
                                {
                                    return 1;
                                }
                                else
                                {
                                    return 0;
                                }
                    }
                else{
                    return 1;
                }

            }
            function checkNorth(x,y)
            {
                if(x>0 && x<map_width && y>0 && y<map_height)
                    {
                        let i = map[x][y-1];
                        if(i == 1)
                                {
                                    return 1;
                                }
                                else
                                {
                                    return 0;
                                }
                    }
                else{
                    return 1;
                }

            }
            function checkNorthEast(x, y) 
            {
                if (x < map_width - 1 && y > 0 && y < map_height) 
                {
                    let i = map[x + 1][y - 1];
                    return i == 1 ? 1 : 0;
                } 
                else 
                {
                    return 1;
                }
            }
            function checkWest(x,y)
            {
                if(x>0 && x<map_width && y>0 && y<map_height)
                    {
                        let i = map[x-1][y];
                        if(i == 1)
                                {
                                    return 1;
                                }
                                else
                                {
                                    return 0;
                                }
                    }
                else{
                    return 1;
                }

            }
            function checkEast(x, y) 
            {
                if (x < map_width - 1 && y > 0 && y < map_height) 
                {
                    let i = map[x + 1][y];
                    return i == 1 ? 1 : 0;
                } 
                else 
                {
                    return 1;
                }
            }
            function checkSouthWest(x,y)
            {
                if(x > 0 && x < map_width - 1 && y > 0 && y < map_height - 1)
                    {
                        let i = map[x-1][y-1];
                        if(i == 1)
                                {
                                    return 1;
                                }
                                else
                                {
                                    return 0;
                                }
                    }
                else{
                    return 1;
                }

            }
            function checkSouth(x,y)
            {
                if(x>0 && x<map_width && y>0 && y<map_height)
                    {
                        let i = map[x][y+1];
                        if(i == 1)
                                {
                                    return 1;
                                }
                                else
                                {
                                    return 0;
                                }
                    }
                    else
                    {
                        return 1;
                    }

            }
            function checkSouthEast(x, y) 
            {
                if (x < map_width - 1 && y < map_height - 1) 
                {
                    let i = map[x + 1][y + 1];
                    return i == 1 ? 1 : 0;
                } 
                else 
                {
                    return 1;
                }
            }

          //utility functions
          function randomRange(min, max) {
            return Math.floor(Math.random()*(max-min+1))+min;
          }
          function randomColour() {
            let num = Math.floor(Math.random()*(16777215-1+1))+1;
            return '#'+num.toString(16);
          }
          function isBetween(number, lowerBound, upperBound) {
            return number >= lowerBound && number <= upperBound;
          }

        </script>

      </body>
    </html>
