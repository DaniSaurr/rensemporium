<style>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';

/* ============================================================================
/* == GENERATOR (from building-lab.html) == */
/* ============================================================================
   BUILDING GENERATOR — pure functions, no Three.js.
   Emits a list of primitive placement instructions:
     { shape: 'box'|'cylinder'|'cone'|'sphere'|'arch',
       pos: [x,y,z], rot: [x,y,z], scale: [x,y,z], mat: <material key> }
   Tile-local coords: tile spans x/z in [-0.5, 0.5], y up from 0.
   Unit shapes (box 1x1x1, cylinder r=0.5 h=1, cone r=0.5 h=1, sphere r=0.5,
   arch = half-torus, outer r=0.5, tube r=0.1).
   ------------------------------------------------------------------------- */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashSeed(globalSeed, x, y, birthGen) {
  let h = globalSeed >>> 0;
  h = Math.imul(h ^ x, 0x85EBCA6B);
  h = Math.imul(h ^ y, 0xC2B2AE35);
  h = Math.imul(h ^ birthGen, 0x27D4EB2F);
  h ^= h >>> 16;
  return h >>> 0;
}

// material keys: sand/sandLight/sandDark (mudbrick ramp), window (dark inset),
// wood, cloth (awning), lapis/gold (sacred, neighbour 7-8 + ziggurat top only), palm.

function I(shape, mat, pos, scale, rot = [0, 0, 0]) {
  return { shape, mat, pos, scale, rot };
}

const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const range = (rng, a, b) => a + rng() * (b - a);

function palmTree(rng, out, cx = 0, cz = 0, heightScale = 1) {
  const h = range(rng, 0.5, 0.75) * heightScale;
  const lean = range(rng, -0.08, 0.08);
  out.push(I('cone', 'wood', [cx + lean * 0.5, h / 2, cz], [0.1, h, 0.1], [0, 0, lean]));
  // fronds radiate from the crown: base anchored at the trunk top, tip arching outward
  const crownX = cx + lean, crownY = h, crownZ = cz;
  const fronds = 6 + Math.floor(rng() * 3);
  for (let i = 0; i < fronds; i++) {
    const ang = (i / fronds) * Math.PI * 2 + rng() * 0.3;
    const tilt = range(rng, 0.05, 0.4);                 // arch up-and-out from horizontal
    const len = range(rng, 0.3, 0.42) * heightScale;
    const ct = Math.cos(tilt);
    const ax = ct * Math.cos(ang), ay = Math.sin(tilt), az = ct * Math.sin(ang);
    out.push(I('cone', 'palm',
      [crownX + ax * len / 2, crownY + ay * len / 2, crownZ + az * len / 2],
      [0.09, len, 0.02], [0, -ang, -(Math.PI / 2 - tilt)]));
  }
}

// Rows of dark inset window boxes flush against each wall face of a storey box.
function windows(rng, out, box, perFace, rows) {
  const [bx, by, bz] = box.pos, [sx, sy, sz] = box.scale;
  const wS = 0.055, wH = 0.08, d = 0.012;
  for (let r = 0; r < rows; r++) {
    const wy = by - sy / 2 + sy * ((r + 0.6) / (rows + 0.4));
    for (const [nx, nz, faceW] of [[0, 1, sx], [0, -1, sx], [1, 0, sz], [-1, 0, sz]]) {
      const n = Math.max(1, Math.min(perFace, Math.floor(faceW / 0.16)));
      for (let i = 0; i < n; i++) {
        const t = (i + 1) / (n + 1) - 0.5;
        const px = bx + (nz !== 0 ? t * faceW : nx * (sx / 2 + d));
        const pz = bz + (nx !== 0 ? t * faceW : nz * (sz / 2 + d));
        out.push(I('box', 'window', [px, wy, pz],
          nx !== 0 ? [d * 2, wH, wS] : [wS, wH, d * 2]));
      }
    }
  }
}

// Roofline trim of a storey box.
//   beaded=true  -> protruding round roof-beam ends (viga look): short horizontal
//                   cylinders poking out of each wall face just under the top edge.
//   beaded=false -> crenellation teeth (boxes) around the roofline perimeter.
// skip: optional [nx,nz] face direction to leave clear (e.g. the ziggurat stair face).
function cornice(rng, out, box, mat, beaded, skip) {
  const [bx, by, bz] = box.pos, [sx, sy, sz] = box.scale;
  if (beaded) {
    const y = by + sy / 2 - 0.06;
    const L = 0.17, r = 0.03, step = 0.115;
    for (const [nx, nz, faceW] of [[0, 1, sx], [0, -1, sx], [1, 0, sz], [-1, 0, sz]]) {
      if (skip && nx === skip[0] && nz === skip[1]) continue;   // leave stair face clear
      const n = Math.max(2, Math.round(faceW / step));
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n - 0.5;               // spaced inside, skips corners
        const px = bx + (nz !== 0 ? t * faceW : nx * (sx / 2 + L * 0.42));
        const pz = bz + (nx !== 0 ? t * faceW : nz * (sz / 2 + L * 0.42));
        out.push(I('cylinder', mat, [px, y, pz], [r * 2, L, r * 2],
          nz !== 0 ? [Math.PI / 2, 0, 0] : [0, 0, Math.PI / 2]));  // lie flat, point outward
      }
    }
    return;
  }
  const y = by + sy / 2 + 0.03;
  const step = 0.11;
  const emit = (px, pz) => out.push(I('box', mat, [px, y, pz], [0.05, 0.06, 0.05]));
  const nx = Math.max(2, Math.round(sx / step)), nz = Math.max(2, Math.round(sz / step));
  const skipPZ = skip && skip[0] === 0 ? skip[1] : 0;   // +1 clears +z edge, -1 clears -z
  const skipPX = skip && skip[1] === 0 ? skip[0] : 0;
  for (let i = 0; i <= nx; i++) {
    const px = bx - sx / 2 + (i / nx) * sx;
    if (skipPZ !== -1) emit(px, bz - sz / 2);
    if (skipPZ !== 1) emit(px, bz + sz / 2);
  }
  for (let i = 1; i < nz; i++) {
    const pz = bz - sz / 2 + (i / nz) * sz;
    if (skipPX !== -1) emit(bx - sx / 2, pz);
    if (skipPX !== 1) emit(bx + sx / 2, pz);
  }
}

// Slightly-protruding tall thin boxes along wall faces (mudbrick facade rhythm).
// skip: optional [nx,nz] face direction to leave clear (e.g. the stair face).
function buttresses(rng, out, box, skip) {
  const [bx, by, bz] = box.pos, [sx, sy, sz] = box.scale;
  for (const [nx, nz, faceW] of [[0, 1, sx], [0, -1, sx], [1, 0, sz], [-1, 0, sz]]) {
    if (skip && nx === skip[0] && nz === skip[1]) continue;   // leave the stair face clear
    const n = 2 + Math.floor(rng() * 2);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n - 0.5;
      const px = bx + (nz !== 0 ? t * faceW : nx * (sx / 2 + 0.02));
      const pz = bz + (nx !== 0 ? t * faceW : nz * (sz / 2 + 0.02));
      out.push(I('box', 'sandDark', [px, by, pz],
        nx !== 0 ? [0.05, sy * 0.96, 0.09] : [0.09, sy * 0.96, 0.05]));
    }
  }
}

// Doorway with optional faceted round arch over it, on the ground storey.
function doorway(rng, out, box, arched, archMat) {
  const [bx, by, bz] = box.pos, [sx, , sz] = box.scale;
  const side = pick(rng, [[0, 1], [0, -1], [1, 0], [-1, 0]]);
  const [nx, nz] = side;
  const dw = 0.13, dh = 0.22, d = 0.014;
  const px = bx + nx * (sx / 2 + d), pz = bz + nz * (sz / 2 + d);
  out.push(I('box', 'window', [px, dh / 2, pz],
    nx !== 0 ? [d * 2, dh, dw] : [dw, dh, d * 2]));
  if (arched) {
    archHead(out, px, dh, pz, dw * 1.3, dw * 0.65, 0.035, d * 2.4,
      nx !== 0 ? 'z' : 'x', archMat);
  }
  return side;
}

// Rooftop awning: thin roof plane + 4 skinny posts.
function awning(rng, out, topBox) {
  const [bx, by, bz] = topBox.pos, [sx, sy, sz] = topBox.scale;
  const aw = Math.min(sx, sz) * range(rng, 0.45, 0.6);
  const ax = bx + range(rng, -1, 1) * (sx / 2 - aw / 2) * 0.8;
  const az = bz + range(rng, -1, 1) * (sz / 2 - aw / 2) * 0.8;
  const roofY = by + sy / 2, ah = 0.16;
  for (const [ox, oz] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {
    out.push(I('cylinder', 'wood',
      [ax + ox * aw * 0.45, roofY + ah / 2, az + oz * aw * 0.45], [0.02, ah, 0.02]));
  }
  out.push(I('box', 'cloth', [ax, roofY + ah, az], [aw, 0.018, aw]));
}

// Projecting lean-to shade over a wall opening: a roof resting across the vigas,
// sloping down and out, held up by two posts to the ground. Fabric on fancy houses,
// wooden slats on plain ones. side = optional [nx,nz] face to attach to (e.g. the door).
function shadeCanopy(rng, out, box, fabric, side) {
  const [bx, by, bz] = box.pos, [sx, sy, sz] = box.scale;
  const [nx, nz] = side || pick(rng, [[0, 1], [0, -1], [1, 0], [-1, 0]]);
  const proj = 0.28, width = 0.34, tilt = 0.18;
  const topY = by + sy / 2 - 0.09;            // rests just under the viga line
  const midY = topY - 0.03;
  const wallX = bx + nx * (sx / 2), wallZ = bz + nz * (sz / 2);
  const cX = wallX + nx * proj / 2, cZ = wallZ + nz * proj / 2;
  const rot = nx !== 0 ? [0, 0, -nx * tilt] : [nz * tilt, 0, 0];  // slope outer edge down
  if (fabric) {
    const mat = pick(rng, ['clothRed', 'clothPlum', 'clothOchre']);
    // thin draped sheet
    out.push(I('box', mat, [cX, midY, cZ],
      nx !== 0 ? [proj, 0.008, width] : [width, 0.008, proj], rot));
    // valance hanging down at the outer edge — the cue that reads as cloth, not slab
    const vX = wallX + nx * proj, vZ = wallZ + nz * proj;
    out.push(I('box', mat, [vX, midY - 0.055, vZ],
      nx !== 0 ? [0.008, 0.08, width] : [width, 0.08, 0.008]));
  } else {
    const slats = 4;
    for (let s = 0; s < slats; s++) {
      const f = (s + 0.5) / slats - 0.5;
      const ox = nx !== 0 ? 0 : f * width, oz = nz !== 0 ? 0 : f * width;
      out.push(I('box', 'wood', [cX + ox, midY, cZ + oz],
        nx !== 0 ? [proj, 0.015, width / slats * 0.8] : [width / slats * 0.8, 0.015, proj], rot));
    }
  }
  const outX = wallX + nx * proj, outZ = wallZ + nz * proj, postH = midY - 0.02;
  for (const e of [-1, 1]) {
    const ex = outX + (nx !== 0 ? 0 : e * width / 2);
    const ez = outZ + (nz !== 0 ? 0 : e * width / 2);
    out.push(I('cylinder', 'wood', [ex, postH / 2, ez], [0.018, postH, 0.018]));
  }
  return [nx, nz];
}

// Solid external staircase sitting fully outside one wall, climbing to its roof.
// avoidList = [[nx,nz],...] faces to keep clear. Returns the face it used, or null.
function exteriorStairs(rng, out, box, avoidList) {
  const [bx, by, bz] = box.pos, [sx, sy, sz] = box.scale;
  const faces = [[0, 1], [0, -1], [1, 0], [-1, 0]]
    .filter(f => !avoidList.some(a => a[0] === f[0] && a[1] === f[1]));
  if (!faces.length) return null;
  const [nx, nz] = pick(rng, faces);
  const groundY = by - sy / 2, rise = sy;
  const wallW = nx !== 0 ? sz : sx, halfWall = nx !== 0 ? sx / 2 : sz / 2;
  const run = Math.min(0.72, wallW * 0.82), steps = 6, stepW = run / steps, proj = 0.13;
  const dir = rng() < 0.5 ? 1 : -1;
  for (let i = 0; i < steps; i++) {
    const along = dir * ((i + 0.5) / steps - 0.5) * run;
    const cx = bx + nx * (halfWall + proj / 2) + nz * along;
    const cz = bz + nz * (halfWall + proj / 2) + (-nx) * along;
    const hgt = ((i + 0.5) / steps) * rise;      // solid riser down to the ground
    out.push(I('box', 'sandLight', [cx, groundY + hgt / 2, cz],
      [nx !== 0 ? proj : stepW, hgt, nz !== 0 ? proj : stepW]));
  }
  return [nx, nz];
}

// Ladder leaning against a wall, reaching the roof. totalH = full building height,
// avoid = optional [nx,nz] face to keep clear (the canopy/door face).
function ladder(rng, out, box, totalH, avoidList) {
  const [bx, by, bz] = box.pos, [sx, sy, sz] = box.scale;
  const groundY = by - sy / 2;
  const faces = [[0, 1], [0, -1], [1, 0], [-1, 0]]
    .filter(f => !avoidList.some(a => a[0] === f[0] && a[1] === f[1]));
  if (!faces.length) return;
  const [nx, nz] = pick(rng, faces);
  const h = totalH * 1.02 + 0.06;               // reaches just past the roofline
  const lean = 0.2, s = Math.sin(lean), c = Math.cos(lean);
  const baseOut = 0.12;                          // stand off the wall onto the viga tips
  const rot = nx !== 0 ? [0, 0, nx * lean] : [-nz * lean, 0, 0];  // top rests on the wall
  const railOff = 0.055;
  for (const o of [-railOff, railOff]) {
    const px = bx + (nx !== 0 ? nx * (sx / 2 + baseOut + s * h / 2) : o);
    const pz = bz + (nz !== 0 ? nz * (sz / 2 + baseOut + s * h / 2) : o);
    out.push(I('cylinder', 'wood', [px, groundY + c * h / 2, pz], [0.016, h, 0.016], rot));
  }
  const rungs = Math.max(3, Math.round(h / 0.12));
  for (let i = 1; i < rungs; i++) {
    const t = i / rungs, off = s * h * (1 - t);
    const px = bx + (nx !== 0 ? nx * (sx / 2 + baseOut + off) : 0);
    const pz = bz + (nz !== 0 ? nz * (sz / 2 + baseOut + off) : 0);
    out.push(I('cylinder', 'wood', [px, groundY + c * h * t, pz],
      [0.012, railOff * 2, 0.012], nx !== 0 ? [Math.PI / 2, 0, 0] : [0, 0, Math.PI / 2]));
  }
}

function rubble(rng, out, cx, cz, n) {
  for (let i = 0; i < n; i++) {
    const s = range(rng, 0.05, 0.13);
    out.push(I('box', pick(rng, ['sandDark', 'sand']),
      [cx + range(rng, -0.42, 0.42), s / 2, cz + range(rng, -0.42, 0.42)],
      [s, s, s], [0, rng() * Math.PI, 0]));
  }
}

// Age-based weathering. Buildings that survive many generations visibly
// mature: repair patches (age 6+), a roof access hatch (10+), damp-stained
// base course + prop timber (15+). Runs on its own rng stream, so the base
// form never changes as age ticks up — features only accumulate at thresholds.
function agePatina(seed, out, ground, top, age) {
  if (age < 6) return;
  const rng = mulberry32((seed ^ 0xA6EDA7E) >>> 0);
  const [gx, gy, gz] = ground.pos, [gw, gh, gd] = ground.scale;

  if (age >= 10) {                              // roof access: hatch + coaming + stub ladder
    // own rng stream so the hatch stays put as later thresholds add features
    const r2 = mulberry32((seed ^ 0x40FFA7) >>> 0);
    const [tx, ty, tz] = top.pos, [tw, th, td] = top.scale;
    const roofY = ty + th / 2;
    const hw = 0.11;
    const yaw = range(r2, 0, Math.PI / 2);                          // random orientation (square repeats every 90°)
    const halfDiag = (hw + 0.05) / 2 * Math.SQRT2;                  // rotated coaming reaches its corners
    const marginX = Math.max(0, tw / 2 - halfDiag - 0.01);
    const marginZ = Math.max(0, td / 2 - halfDiag - 0.01);
    const hx = tx + range(r2, -1, 1) * marginX * 0.55;             // bias toward the roof centre
    const hz = tz + range(r2, -1, 1) * marginZ * 0.55;
    out.push(I('box', 'sandDark', [hx, roofY + 0.012, hz], [hw + 0.05, 0.024, hw + 0.05], [0, yaw, 0]));  // raised coaming rim
    out.push(I('box', 'window',   [hx, roofY + 0.022, hz], [hw, 0.03, hw], [0, yaw, 0]));                 // dark opening
  }
  const patches = 1 + Math.floor(rng() * 2) + (age >= 15 ? 1 : 0);
  for (let i = 0; i < patches; i++) {           // fresh-mud repair rectangles
    const [nx, nz] = pick(rng, [[0, 1], [0, -1], [1, 0], [-1, 0]]);
    const t = range(rng, -0.3, 0.3);
    const pw = range(rng, 0.1, 0.2), ph = range(rng, 0.08, 0.16);
    const py = gy + range(rng, -0.25, 0.25) * gh;
    const px = gx + (nx !== 0 ? nx * (gw / 2 + 0.008) : t * gw);
    const pz = gz + (nz !== 0 ? nz * (gd / 2 + 0.008) : t * gd);
    out.push(I('box', pick(rng, ['sandLight', 'sandDark']), [px, py, pz],
      nx !== 0 ? [0.016, ph, pw] : [pw, ph, 0.016]));
  }
  if (age >= 15) {
    // damp-stained skirt at the wall foot
    out.push(I('box', 'sandDark', [gx, 0.035, gz], [gw + 0.015, 0.07, gd + 0.015]));
    // prop timber leaning against one wall (same lean convention as ladder)
    const [nx, nz] = pick(rng, [[0, 1], [0, -1], [1, 0], [-1, 0]]);
    const L = gh * 1.1, lean = 0.35, s = Math.sin(lean), c = Math.cos(lean);
    const px = gx + (nx !== 0 ? nx * (gw / 2 + s * L / 2) : range(rng, -0.3, 0.3) * gw);
    const pz = gz + (nz !== 0 ? nz * (gd / 2 + s * L / 2) : range(rng, -0.3, 0.3) * gd);
    out.push(I('cylinder', 'wood', [px, c * L / 2, pz], [0.03, L, 0.03],
      nx !== 0 ? [0, 0, nx * lean] : [-nz * lean, 0, 0]));
  }
}

// neighbours: 0-8 Moore count at birth. variant: 'normal' | 'ruin' | 'scaffold'
// age: generations survived since birth (drives agePatina weathering).
// senes: GOD MODE senescence, fraction of lifetime lived (0..1) or null.
//   Overrides the age-based tone ramp: fresh dark -> mature mid -> bleached
//   pale (60%+). From 85% the building is STRIPPED: decor removed in reverse
//   order of value (gold/lapis salvaged, cloth taken, wood beams pulled),
//   leaving a bare bleached shell — the visible telegraph before ruin.
function generateBuilding(neighbours, seed, variant = 'normal', age = 0, senes = null) {
  if (variant === 'scaffold') return generateScaffold(seed);
  const rng = mulberry32(seed);
  const out = [];
  const ruined = variant === 'ruin';
  const stripped = !ruined && senes !== null && senes >= 0.85;

  if (neighbours === 0) {
    if (ruined) { rubble(rng, out, 0, 0, 3); return out; }
    if (rng() < 0.15) {                             // occasional lone lion statue instead
      lionStatue(rng, out, range(rng, -0.12, 0.12), range(rng, -0.12, 0.12));
      return out;
    }
    palmTree(rng, out, range(rng, -0.15, 0.15), range(rng, -0.15, 0.15));
    if (rng() < 0.4) palmTree(rng, out, range(rng, -0.3, 0.3), range(rng, -0.3, 0.3), 0.7);
    return out;
  }

  const storeyCounts = [0, 1, 1, 2, 3, 3, 3, 3, 3];
  let storeys = storeyCounts[neighbours];
  const deco = Math.max(0, neighbours - 4);

  if (ruined && storeys > 1) storeys -= 1;

  // Mudbrick tone ramps up with age: freshly-built walls read dark and damp,
  // then sun-bleach paler over the generations. Ruins keep the mid tone.
  const ramp = ['sandDark', 'sand', 'sandLight'];
  const tone = ruined ? 1
    : senes !== null ? (senes >= 0.6 ? 2 : senes >= 0.15 ? 1 : 0)   // lifetime-fraction ramp
    : (age >= 15 ? 2 : age >= 6 ? 1 : 0);

  const boxes = [];
  let y = 0, w = 1.0, d = 1.0, cx = 0, cz = 0;
  for (let s = 0; s < storeys; s++) {
    let h = range(rng, 0.3, 0.38);
    if (s > 0) {
      const nw = w * range(rng, 0.55, 0.8), nd = d * range(rng, 0.55, 0.8);
      cx += range(rng, -1, 1) * (w - nw) / 2;
      cz += range(rng, -1, 1) * (d - nd) / 2;
      w = nw; d = nd;
    }
    if (ruined && s === storeys - 1) h *= range(rng, 0.4, 0.7);
    const box = I('box', s === 0 ? ramp[tone] : pick(rng, [ramp[tone], ramp[Math.min(tone + 1, 2)]]),
      [cx, y + h / 2, cz], [w, h, d]);
    boxes.push(box);
    out.push(box);
    y += h;
  }

  const ground = boxes[0], top = boxes[boxes.length - 1];

  windows(rng, out, ground, 2 + deco, 1);
  for (let s = 1; s < boxes.length; s++) windows(rng, out, boxes[s], 1 + Math.ceil(deco / 2), 1);

  const doorSide = doorway(rng, out, ground, deco >= 4, deco >= 4 ? 'gold' : 'sandDark');

  if (!ruined && !stripped) {                    // stripped: wood cornices pulled for salvage
    const beaded = deco < 2;
    const trimMat = deco >= 3 ? (rng() < 0.5 ? 'lapis' : 'gold') : 'sandDark';
    cornice(rng, out, top, beaded ? 'wood' : trimMat, beaded);
    if (deco >= 1) for (let s = 0; s < boxes.length - 1; s++)
      cornice(rng, out, boxes[s], 'wood', true);
  }

  if (deco >= 2) buttresses(rng, out, ground);   // structural: survives stripping

  if (deco >= 3 && !ruined && !stripped) {       // stripped: gold/lapis salvaged first
    out.push(I('box', 'lapis',
      [top.pos[0], top.pos[1] + top.scale[1] * 0.32, top.pos[2]],
      [top.scale[0] + 0.02, 0.045, top.scale[2] + 0.02]));
    if (deco >= 4) out.push(I('box', 'gold',
      [top.pos[0], top.pos[1] + top.scale[1] * 0.32 + 0.045, top.pos[2]],
      [top.scale[0] + 0.01, 0.02, top.scale[2] + 0.01]));
  }

  if (!ruined && !stripped) {
    const fancy = deco >= 1;                     // neighbour 5+ get fabric, others planks
    const used = [doorSide];                      // faces already occupied by add-ons
    if (rng() < (fancy ? 0.75 : 0.5)) shadeCanopy(rng, out, ground, fancy, doorSide);
    if (fancy && rng() < 0.4) used.push(shadeCanopy(rng, out, ground, true));  // over a window
    if (storeys >= 2 && rng() < 0.45) {
      const f = exteriorStairs(rng, out, ground, used);
      if (f) used.push(f);
    }
    if (rng() < 0.35) awning(rng, out, top);
    agePatina(seed, out, ground, top, age);
  } else if (ruined) {
    rubble(rng, out, 0, 0, 4 + Math.floor(rng() * 3));
  }
  // stripped shells get neither add-ons nor rubble: bare bleached walls

  return out;
}

function generateScaffold(seed) {
  const rng = mulberry32(seed);
  const out = [];
  const h = range(rng, 0.5, 0.8);
  const half = 0.38;
  for (const [x, z] of [[-half, -half], [-half, half], [half, -half], [half, half],
                        [0, -half], [0, half], [-half, 0], [half, 0]]) {
    out.push(I('cylinder', 'wood', [x, h / 2, z], [0.02, h, 0.02]));
  }
  for (const ly of [h * 0.45, h * 0.95]) {
    out.push(I('cylinder', 'wood', [0, ly, -half], [0.015, half * 2, 0.015], [0, 0, Math.PI / 2]));
    out.push(I('cylinder', 'wood', [0, ly, half], [0.015, half * 2, 0.015], [0, 0, Math.PI / 2]));
    out.push(I('cylinder', 'wood', [-half, ly, 0], [0.015, half * 2, 0.015], [Math.PI / 2, 0, 0]));
    out.push(I('cylinder', 'wood', [half, ly, 0], [0.015, half * 2, 0.015], [Math.PI / 2, 0, 0]));
  }
  // plank platform deck at the lower lashing level — parallel slats spanning the frame
  {
    const ly = h * 0.45, slats = 5, slatW = (half * 2) / slats;
    for (let i = 0; i < slats; i++) {
      const sx = -half + (i + 0.5) * slatW;
      out.push(I('box', 'wood', [sx, ly + 0.015, 0], [slatW * 0.85, 0.02, half * 2 - 0.03]));
    }
  }
  out.push(I('box', 'sandLight', [range(rng, -0.25, 0.25), 0.05, range(rng, -0.25, 0.25)], [0.18, 0.1, 0.14]));
  // upright ladder standing flush against the scaffold frame — construction-in-progress cue
  {
    const lx = half, lz = range(rng, -half * 0.5, half * 0.5), railOff = 0.05;
    for (const o of [-railOff, railOff]) {
      out.push(I('cylinder', 'wood', [lx, h / 2, lz + o], [0.014, h, 0.014]));
    }
    const rungs = Math.max(3, Math.round(h / 0.12));
    for (let i = 1; i < rungs; i++) {
      out.push(I('cylinder', 'wood', [lx, (i / rungs) * h, lz],
        [0.011, railOff * 2, 0.011], [Math.PI / 2, 0, 0]));
    }
  }
  return out;
}

// Riverbank dock, built from the scaffold's vocabulary (poles, lashings, plank
// deck). Sits where a building would on a tile touching water; (wx,wz) points at
// the water, and a pier finger + mooring post reach out over it.
function generateDock(seed, wx, wz) {
  const rng = mulberry32(seed);
  const out = [];
  const half = 0.44, deckY = 0.2, poleH = deckY + 0.55;   // poles drop into the water
  const pole = (px, pz, r = 0.028) => out.push(I('cylinder', 'wood', [px, deckY - poleH / 2 + 0.05, pz], [r, poleH, r]));
  for (const [px, pz] of [[-half, -half], [-half, half], [half, -half], [half, half], [0, 0]]) pole(px, pz);
  // horizontal lashings around the frame, just under the deck (scaffold look)
  for (const s of [-1, 1]) {
    out.push(I('cylinder', 'wood', [0, deckY - 0.05, s * half], [0.016, half * 2, 0.016], [0, 0, Math.PI / 2]));
    out.push(I('cylinder', 'wood', [s * half, deckY - 0.05, 0], [0.016, half * 2, 0.016], [Math.PI / 2, 0, 0]));
  }
  // plank deck over the tile
  const slats = 6, sw = (half * 2) / slats;
  for (let s = 0; s < slats; s++) out.push(I('box', 'wood', [-half + (s + 0.5) * sw, deckY, 0], [sw * 0.82, 0.03, half * 2]));
  // pier finger reaching out over the water
  if (wx || wz) {
    const steps = 3, seg = 0.42 / steps;
    for (let k = 1; k <= steps; k++) {
      const d = half + (k - 0.5) * seg * 2;
      const cx = wx * d, cz = wz * d;
      for (const s of [-1, 1]) pole(cx + (wx ? 0 : s * 0.15), cz + (wz ? 0 : s * 0.15), 0.022);
      out.push(I('box', 'wood', [cx, deckY, cz], wx ? [seg * 2 * 0.9, 0.03, 0.32] : [0.32, 0.03, seg * 2 * 0.9]));
    }
    const ex = wx * (half + 0.42), ez = wz * (half + 0.42);
    out.push(I('cylinder', 'wood', [ex, deckY + 0.12, ez], [0.035, 0.4, 0.035]));   // mooring post
  }
  // a few cargo crates and jars on the deck
  const crates = Math.floor(rng() * 3);
  for (let c = 0; c < crates; c++) {
    const s = range(rng, 0.11, 0.16);
    out.push(I('box', pick(rng, ['sand', 'sandDark']),
      [range(rng, -0.28, 0.28), deckY + s / 2 + 0.02, range(rng, -0.28, 0.28)], [s, s, s], [0, rng() * 1.5, 0]));
  }
  return out;
}

// The civ's guardian statue — Babylon's seated lion or Assyria's lamassu.
// Every call site (ziggurat stairs, gates, courtyards, desert statues) goes
// through this dispatcher, so the whole city re-themes from one pointer.
function goldGuardian(...args) { currentCiv.guardian(...args); }

// Little seated lion, facing (fx,fz) (axis-aligned), base sitting at baseY.
function lionGuardian(out, cx, baseY, cz, fx, fz, mat = 'gold') {
  const g = mat;
  const P = (fwd, side, up) => [cx + fx * fwd - fz * side, baseY + up, cz + fz * fwd + fx * side];
  const S = (len, wid, h) => fx !== 0 ? [len, h, wid] : [wid, h, len];
  out.push(I('box', g, P(-0.05, 0, 0.06), S(0.12, 0.14, 0.12)));   // haunches (rear, low)
  out.push(I('box', g, P(0.05, 0, 0.10), S(0.10, 0.12, 0.17)));    // upright chest
  out.push(I('cylinder', g, P(0.10, 0.045, 0.045), [0.03, 0.09, 0.03]));   // front legs
  out.push(I('cylinder', g, P(0.10, -0.045, 0.045), [0.03, 0.09, 0.03]));
  out.push(I('box', g, P(0.11, 0, 0.21), S(0.09, 0.09, 0.09)));    // head
  out.push(I('box', g, P(0.17, 0, 0.19), S(0.05, 0.06, 0.05)));    // snout
  for (let i = 0; i < 7; i++) {                                    // mane ring around the face
    const a = (i / 7) * Math.PI * 2;
    out.push(I('sphere', g, P(0.08 + Math.cos(a) * 0.02, Math.sin(a) * 0.07, 0.21 + Math.sin(a) * 0.055),
      [0.03, 0.03, 0.03]));
  }
  out.push(I('sphere', g, P(0.09, 0.045, 0.26), [0.022, 0.022, 0.022]));   // ears
  out.push(I('sphere', g, P(0.09, -0.045, 0.26), [0.022, 0.022, 0.022]));
  out.push(I('cylinder', g, P(-0.10, 0.05, 0.11), [0.018, 0.12, 0.018], [0.5, 0, 0]));  // tail
}

// LAMASSU — the Assyrian winged human-headed bull (geometry tuned in
// assyria-lab.html). Same signature as the lion so call sites are shared.
function lamassuGuardian(out, cx, baseY, cz, fx, fz, mat = 'sandLight') {
  const g = mat;
  const P = (fwd, side, up) => [cx + fx * fwd - fz * side, baseY + up, cz + fz * fwd + fx * side];
  const S = (len, wid, h) => fx !== 0 ? [len, h, wid] : [wid, h, len];
  out.push(I('box', g, P(-0.02, 0, 0.14), S(0.30, 0.12, 0.12)));   // standing bull body
  for (const f of [-0.11, 0.10]) for (const s of [-0.04, 0.04])    // four straight legs
    out.push(I('cylinder', g, P(f, s, 0.04), [0.032, 0.08, 0.032]));
  out.push(I('box', g, P(0.13, 0, 0.19), S(0.06, 0.07, 0.09)));    // neck rising from the shoulders
  out.push(I('box', g, P(0.16, 0, 0.24), S(0.08, 0.08, 0.09)));    // human head
  out.push(I('box', g, P(0.175, 0, 0.165), S(0.045, 0.055, 0.075))); // square beard to the chest
  out.push(I('box', g, P(0.16, 0, 0.30), S(0.065, 0.065, 0.03)));  // horned-crown band
  out.push(I('sphere', g, P(0.16, 0.045, 0.315), [0.022, 0.028, 0.022]));  // crown horns
  out.push(I('sphere', g, P(0.16, -0.045, 0.315), [0.022, 0.028, 0.022]));
  const wingRot = fx !== 0 ? [0, 0, fx * 0.5] : [-fz * 0.5, 0, 0]; // wings swept up toward the rear
  for (const s of [-1, 1]) {
    out.push(I('box', 'gold', P(-0.07, s * 0.062, 0.21), S(0.24, 0.012, 0.085), wingRot));
    out.push(I('box', 'gold', P(-0.10, s * 0.068, 0.245), S(0.17, 0.010, 0.06), wingRot));
  }
  out.push(I('cylinder', g, P(-0.16, 0.03, 0.12), [0.016, 0.11, 0.016], [0.35, 0, 0]));  // tail
}

// War banner: pole, bronze finial, blood-red standard — the Assyrian accent.
function banner(out, cx, cz, h = 0.9, baseY = 0) {
  out.push(I('cylinder', 'wood', [cx, baseY + h / 2, cz], [0.022, h, 0.022]));
  out.push(I('sphere', 'gold', [cx, baseY + h + 0.02, cz], [0.045, 0.045, 0.045]));
  out.push(I('cylinder', 'gold', [cx, baseY + h - 0.05, cz], [0.014, 0.16, 0.014], [Math.PI / 2, 0, 0]));
  out.push(I('box', 'clothRed', [cx, baseY + h - 0.21, cz], [0.016, 0.3, 0.14]));
}

// GIANT FLOWER — tree-scale bloom for the Assyrian trophy-garden (tuned in
// assyria-lab.html): green stem, ring of fat petals, gold heart, one leaf.
const BLOOMS = ['#b5383d', '#ddd3c2', '#c98ba8', '#cfa952'];
function giantFlower(rng, out, cx, cz, h) {
  const bloom = pick(rng, BLOOMS);
  const lean = range(rng, -0.07, 0.07);
  out.push(I('cylinder', 'palm', [cx + lean * 0.5, h / 2, cz], [0.05, h, 0.05], [0, 0, lean]));
  const hx = cx + lean, hy = h, hz = cz;
  const petals = 5 + Math.floor(rng() * 2);
  const pr = range(rng, 0.16, 0.22);
  for (let i = 0; i < petals; i++) {
    const a = (i / petals) * Math.PI * 2 + rng() * 0.3;
    out.push(I('sphere', bloom, [hx + Math.cos(a) * pr, hy + 0.02, hz + Math.sin(a) * pr],
      [pr * 1.15, pr * 0.5, pr * 1.15]));
  }
  out.push(I('sphere', 'gold', [hx, hy + 0.05, hz], [pr * 0.8, pr * 0.6, pr * 0.8]));
  out.push(I('cone', 'palm', [cx + lean * 0.3, h * 0.45, cz + 0.05], [0.16, 0.05, 0.05], [0, 0, -Math.PI / 2.3]));
}

// Free-standing guardian statue on a low plinth — desert filler, like the palms.
function lionStatue(rng, out, cx = 0, cz = 0) {
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const [fx, fz] = pick(rng, dirs);
  const plinthY = 0.09;
  out.push(I('box', 'sandDark', [cx, plinthY / 2, cz], [0.34, plinthY, 0.30]));
  goldGuardian(out, cx, plinthY, cz, fx, fz, pick(rng, ['sand', 'sandLight']));
}

/* ----------------------------------------------------------------------------
   VERTEX FURNITURE — small structures placed where four tiles meet, read off
   the alive/dead pattern of those four cells (the "lines and vertices" layer).
   All centred at the local origin; the vertex pass positions them.
   ------------------------------------------------------------------------- */

// Neighbourhood well: stone rim + water + a leaning shaduf pole. Courtyard corner.
function well(rng, out) {
  out.push(I('cylinder', 'sandDark', [0, 0.09, 0], [0.26, 0.18, 0.26]));    // rim
  out.push(I('cylinder', 'lapis', [0, 0.17, 0], [0.19, 0.03, 0.19]));       // water
  const a = 0.4 + rng() * 0.2;
  out.push(I('cylinder', 'wood', [0.14, 0.26, 0], [0.028, 0.55, 0.028], [0, 0, a]));  // shaduf pole
}

// Fire brazier: pillar + gold bowl + ember dome. City-edge frontage light.
function brazier(rng, out) {
  out.push(I('cylinder', 'sandDark', [0, 0.14, 0], [0.08, 0.28, 0.08]));    // pillar
  out.push(I('cylinder', 'gold', [0, 0.29, 0], [0.18, 0.05, 0.18]));        // bowl
  out.push(I('sphere', 'gold', [0, 0.34, 0], [0.13, 0.1, 0.13]));           // embers
}

// Standing stone with a gilded pyramidion. Outer corner marker.
function obelisk(rng, out) {
  const h = 0.5 + rng() * 0.35;
  out.push(I('box', 'sandLight', [0, h / 2, 0], [0.13, h, 0.13]));
  out.push(I('cone', 'gold', [0, h + 0.06, 0], [0.15, 0.13, 0.15]));
}

const CLOTHS = ['clothRed', 'clothPlum', 'clothOchre'];   // awning fabric palette

// Market stall set against a built neighbour's wall, projecting into a sand
// tile. (dx,dy) points at the built neighbour; the awning slopes down away from
// it. Tile-local coords: tile spans [-0.5, 0.5]. This is the "edge" layer —
// street frontage read off the built|sand boundary.
function marketStall(out, dx, dy, mat) {
  const proj = 0.34, roofY = 0.24, tilt = 0.22;
  const ex = dx * 0.5, ez = dy * 0.5;               // shared edge (the neighbour's wall)
  const cx = ex - dx * proj * 0.5, cz = ez - dy * proj * 0.5;
  const rot = dx !== 0 ? [0, 0, dx * tilt] : [-dy * tilt, 0, 0];   // slope out from the wall
  out.push(I('box', mat, [cx, roofY, cz],
    dx !== 0 ? [proj, 0.012, 0.32] : [0.32, 0.012, proj], rot));   // cloth roof
  const ox = ex - dx * proj, oz = ez - dy * proj;
  for (const s of [-1, 1]) {                                       // outer posts
    const px = ox + (dx !== 0 ? 0 : s * 0.15), pz = oz + (dy !== 0 ? 0 : s * 0.15);
    out.push(I('cylinder', 'wood', [px, roofY / 2, pz], [0.016, roofY, 0.016]));
  }
  out.push(I('box', 'wood', [cx, 0.09, cz], dx !== 0 ? [0.14, 0.02, 0.26] : [0.26, 0.02, 0.14]));  // goods table
}

// Reed/wood river barge: hull with upturned ends + a mast or cargo. Floats on
// the canal; long axis along x (the canal runs in rows).
function boat(rng, out) {
  const L = 0.5 + rng() * 0.22;
  out.push(I('box', 'wood', [0, 0.04, 0], [L, 0.07, 0.17]));                    // hull
  for (const s of [-1, 1]) out.push(I('box', 'wood', [s * L / 2, 0.08, 0],      // upturned prow/stern
    [0.1, 0.07, 0.15], [0, 0, s * 0.5]));
  if (rng() < 0.5) out.push(I('cylinder', 'wood', [0, 0.22, 0], [0.02, 0.34, 0.02]));  // mast
  else out.push(I('box', pick(rng, ['sand', 'sandDark']), [0, 0.13, 0], [0.16, 0.11, 0.13]));  // cargo
}

// Irrigated crop plot: a low soil bed with parallel rows of green crop. Sits on
// the floodplain near the canal.
function cropField(rng, out) {
  const rows = 5 + Math.floor(rng() * 3);
  const along = rng() < 0.5;
  out.push(I('box', 'sandDark', [0, 0.02, 0], [0.9, 0.04, 0.9]));               // tilled soil bed
  for (let r = 0; r < rows; r++) {
    const t = -0.4 + ((r + 0.5) / rows) * 0.8, w = (0.8 / rows) * 0.6;
    out.push(I('box', 'palm', along ? [t, 0.06, 0] : [0, 0.06, t],
      along ? [w, 0.05, 0.82] : [0.82, 0.05, w]));
  }
}

// Mušḫuššu ("sirrush") mosaic — pixel-art bitmap of the Ishtar Gate dragon,
// drawn side-on facing right: single horn, serpent head with forked tongue,
// long slim neck, scaly body, feline forelegs, taloned birdlike hind legs,
// long tail rising behind. '#' = one gold glazed tile.
const SIRRUSH_ART = [
  '.....................#....',
  '.....................#....',
  '....................####..',
  '....................###.##',
  '....................###...',
  '...................##.....',
  '..................##......',
  '.................##.......',
  '#...............##........',
  '##.............###........',
  '.##....#.#.#.####.........',
  '..##..############........',
  '...##############.........',
  '...#############..........',
  '.....##.....##..##........',
  '.....##.....##...##.......',
  '....##......##....##......',
];

// Lamassu mosaic — the Assyrian winged human-headed bull, side-on facing
// right: horned crown, bearded face, great wing sweeping back, four legs.
// Same frieze system; bronze tiles on a blood-red backing (tuned in assyria-lab).
const LAMASSU_ART = [
  '......................#.#.',
  '......................###.',
  '..##..................###.',
  '..###.................###.',
  '..####................###.',
  '...####...............##..',
  '...#####..............##..',
  '....#####............###..',
  '....######..........###...',
  '.....#######......#####...',
  '#....###################..',
  '##..####################..',
  '.#######################..',
  '..######################..',
  '...##....##.....##...##...',
  '...##....##.....##...##...',
  '..###...###....###..####..',
];

// Glazed-brick mosaic frieze: a lapis backing wall with sirrush figures picked
// out in raised gold tiles, one box per tile. length = wall span along `axis`,
// centred at cx0/cz0; outward = +1/-1 face direction. Rosette-strip borders
// top and bottom, Ishtar Gate style.
function sirrushFrieze(out, cx0, cz0, axis, length, baseY, outward, bgMat) {
  const ART = currentCiv.friezeArt;                   // sirrush (Babylon) or lamassu (Assyria)
  const rows = ART.length, cols = ART[0].length;
  const px = 0.026;                                   // one glazed brick
  const figW = cols * px, figH = rows * px;
  const border = px * 1.6;
  const h = figH + border * 2 + px * 2;
  const bandT = 0.04;
  // backing wall
  if (axis === 'x') out.push(I('box', bgMat, [cx0, baseY + h / 2, cz0 + outward * bandT / 2], [length, h, bandT]));
  else out.push(I('box', bgMat, [cx0 + outward * bandT / 2, baseY + h / 2, cz0], [bandT, h, length]));
  const faceX = axis === 'z' ? cx0 + outward * bandT : cx0;
  const faceZ = axis === 'x' ? cz0 + outward * bandT : cz0;
  const tile = (u, v, w = px) => {                    // one raised gold tile at (u,v) on the face
    if (axis === 'x') out.push(I('box', 'gold', [faceX + u, baseY + v, faceZ], [w, px, px]));
    else out.push(I('box', 'gold', [faceX, baseY + v, faceZ + u], [px, px, w]));
  };
  // gold border strips top and bottom
  tile(0, border / 2, length * 0.98);
  tile(0, h - border / 2, length * 0.98);
  // repeat the figure along the band
  const n = Math.max(1, Math.floor(length / (figW * 1.25)));
  const gap = length / n;
  for (let k = 0; k < n; k++) {
    const u0 = -length / 2 + (k + 0.5) * gap - figW / 2;
    for (let r = 0; r < rows; r++) {
      const rowStr = ART[r];
      const v = border + px + (rows - 1 - r) * px + px / 2;  // row 0 is the top
      // emit runs of adjacent tiles as single boxes (fewer instances)
      let run = -1;
      for (let c = 0; c <= cols; c++) {
        const on = c < cols && rowStr[c] === '#';
        if (on && run < 0) run = c;
        else if (!on && run >= 0) {
          const w = (c - run) * px;
          tile(u0 + run * px + w / 2, v, w);
          run = -1;
        }
      }
    }
  }
}

// Gold/lapis guardian decor for a monument courtyard: two lions flanking one
// entrance, a tiled sirrush relief frieze on the wall facing the opposite one.
// cx/cz local to the platform.
function courtyardGuardians(rng, out, topY, halfW, halfD) {
  const lz = halfD * 0.9;
  for (const sx of [-1, 1]) {
    const lx = sx * halfW * 0.55;
    out.push(I('box', 'sandDark', [lx, topY + 0.045, lz], [0.16, 0.09, 0.16]));  // plinth
    goldGuardian(out, lx, topY + 0.09, lz, 0, -sx, 'gold');
  }
  const sz = -halfD * 0.94;
  sirrushFrieze(out, 0, sz, 'x', halfW * 1.5, topY, -1, 'lapis');
}

// size: footprint NxN tiles (>=3), footprint spans [-size/2, size/2]. variant: 'normal' | 'ruin'
// stairFaceOverride: 0..3 (0 -> +z, 1 -> +x, 2 -> -z, 3 -> -x) to aim the ramp at open ground.
function generateZiggurat(size, seed, variant = 'normal', stairFaceOverride = null, special = false) {
  const rng = mulberry32(seed);
  const out = [];
  const tiers = Math.min(size, 6);
  const ruined = variant === 'ruin';
  const shownTiers = ruined ? Math.max(1, tiers - 2) : tiers;
  const baseW = size * 0.98;
  const tierH = 0.55;
  const stairFace = stairFaceOverride !== null ? stairFaceOverride : pick(rng, [0, 1, 2, 3]);
  // exact integer axis components (sin/cos of n*PI/2 leave 1e-16 residues that
  // break truthiness checks and leak into positions)
  const dirX = [0, 1, 0, -1][stairFace], dirZ = [1, 0, -1, 0][stairFace];
  const skipDir = [dirX, dirZ];                          // face the ramp-stair climbs

  let y = 0;
  const tierWidths = [];
  for (let t = 0; t < tiers; t++) tierWidths.push(baseW * (1 - t / tiers) * 0.98 + baseW * 0.02);

  // stair slot: constant width, sized to still fit inside the narrow top tier
  const topW = tierWidths[Math.min(shownTiers, tiers) - 1];
  const stairW = Math.min(baseW * 0.14, topW * 0.5);
  const chW = stairW * 1.15;                       // channel a touch wider than the steps

  for (let t = 0; t < shownTiers; t++) {
    let w = tierWidths[t];
    let h = tierH;
    if (ruined && t === shownTiers - 1) h *= 0.5;
    const isTop = !ruined && t === tiers - 1;
    const tierMat = special
      ? (isTop ? 'orange' : 'bitumen')                // the reference photo's palette
      : (isTop ? 'lapis' : (t % 2 ? 'sandLight' : 'sand'));
    const cy = y + h / 2;
    // Each tier is a solid box, except a stair slot is cut through the front
    // (the stair face): a solid back block + two front flank blocks leave a gap
    // of width chW down the middle for the steps. The top (shrine) tier and
    // ruins stay whole — the stair lands on the terrace below the shrine.
    if (ruined || isTop) {
      out.push(I('box', tierMat, [0, cy, 0], [w, h, w]));
    } else {
      const flankW = (w - chW) / 2;
      if (dirX) {
        out.push(I('box', tierMat, [-dirX * 0.325 * w, cy, 0], [0.35 * w, h, w]));           // solid back
        for (const s of [-1, 1])                                                             // front flanks
          out.push(I('box', tierMat, [dirX * 0.175 * w, cy, s * (chW / 2 + flankW / 2)], [0.65 * w, h, flankW]));
      } else {
        out.push(I('box', tierMat, [0, cy, -dirZ * 0.325 * w], [w, h, 0.35 * w]));
        for (const s of [-1, 1])
          out.push(I('box', tierMat, [s * (chW / 2 + flankW / 2), cy, dirZ * 0.175 * w], [flankW, h, 0.65 * w]));
      }
    }
    if (!ruined || t < shownTiers - 1) {
      cornice(rng, out, { pos: [0, cy, 0], scale: [w, h, w] },
        special ? (isTop ? 'skyBlue' : 'bitumen') : (isTop ? 'gold' : 'sandDark'), t >= tiers - 2, skipDir);
    }
    if (t < 2) buttresses(rng, out, { pos: [0, cy, 0], scale: [w, h, w] }, skipDir);
    y += h;
  }

  if (!ruined) {
    const shrineMat = special ? 'skyBlue' : 'gold';
    const shrineW = tierWidths[tiers - 1] * 0.4;
    out.push(I('box', shrineMat, [0, y + shrineW * 0.35, 0], [shrineW, shrineW * 0.7, shrineW]));
    archHead(out, 0, y + shrineW * 0.5, shrineW / 2 + 0.01,
      shrineW * 0.5, shrineW * 0.25, shrineW * 0.1, 0.02, 'x', shrineMat);
  } else {
    rubble(rng, out, 0, 0, 10);
    for (let i = 0; i < 6; i++) {
      const s = range(rng, 0.08, 0.2);
      out.push(I('box', 'sandDark',
        [range(rng, -1, 1) * tierWidths[shownTiers - 1] * 0.35, y + s / 2,
         range(rng, -1, 1) * tierWidths[shownTiers - 1] * 0.35], [s, s, s],
        [0, rng() * Math.PI, 0]));
    }
  }

  const totalH = y;

  // Recessed central staircase: a straight run of plain step-boxes climbing the
  // slot cut through the tiers, from the plaza at the base front up to the top
  // platform. Flanked by tier masonry, fully inside the footprint — no ramp
  // slab, no parapets, just stacked boxes like the reference.
  const stairTopY = ruined ? totalH : totalH - tierH;   // land on the terrace below the shrine
  const aFoot = baseW / 2, aHead = topW * 0.55;         // base front edge -> just before the shrine
  const nSteps = Math.max(5, Math.round(stairTopY / 0.06));
  for (let i = 0; i < nSteps; i++) {
    const t = (i + 0.5) / nSteps;
    const a = aFoot * (1 - t) + aHead * t;
    out.push(I('box', 'sandLight', [dirX * a, t * stairTopY, dirZ * a],
      dirX ? [0.13, 0.035, stairW] : [stairW, 0.035, 0.13]));
  }

  // lions stand against the base face, flanking the stair's foot
  for (const side of [-1, 1]) {
    const px = dirX * (baseW / 2 + 0.02) + dirZ * side * stairW * 0.7;
    const pz = dirZ * (baseW / 2 + 0.02) + dirX * side * stairW * 0.7;
    out.push(I('box', 'sandDark', [px, 0.15, pz], [0.18, 0.3, 0.18]));
    if (!ruined) goldGuardian(out, px, 0.3, pz, Math.round(dirX), Math.round(dirZ));  // guardian (dropped in ruins)
  }
  // Assyria flies war banners flanking the approach
  if (!ruined && currentCiv.banners) for (const side of [-1, 1]) {
    const px = dirX * (baseW / 2 + 0.35) + dirZ * side * stairW * 1.5;
    const pz = dirZ * (baseW / 2 + 0.35) + dirX * side * stairW * 1.5;
    banner(out, px, pz, 1.0);
  }
  return out;
}

/* ============================================================================
   MONUMENTS — larger footprints (5x5+) become special structures instead of
   ziggurats. All share monumentBase() so they read as one family: same wide
   podium, different superstructure. size = footprint in tiles, spans
   [-size/2, size/2], y up from 0.
   ------------------------------------------------------------------------- */

// Wide stepped podium every monument sits on. Returns the platform top height.
function monumentBase(seed, out, size) {
  const baseW = size * 0.98;
  const h = Math.max(0.4, size * 0.1);
  out.push(I('box', 'sandDark', [0, h * 0.11, 0], [baseW + 0.05, h * 0.22, baseW + 0.05]));  // plinth lip
  out.push(I('box', 'sand', [0, h * 0.22 + h / 2, 0], [baseW, h, baseW]));                    // platform
  return { topY: h * 0.22 + h, baseW };
}

// Tall slim cypress: short trunk + narrow green cone. h = total height.
function cypress(rng, out, cx, cz, h, w) {
  out.push(I('cylinder', 'wood', [cx, h * 0.08, cz], [w * 0.35, h * 0.16, w * 0.35]));
  out.push(I('cone', 'palm', [cx, h * 0.16 + (h * 0.84) / 2, cz], [w, h * 0.84, w]));
}

// Low rounded shrub: a cluster of squashed spheres on a short stub. h = total height.
function shrub(rng, out, cx, cz, h, w) {
  const stub = h * 0.22;
  out.push(I('cylinder', 'wood', [cx, stub / 2, cz], [w * 0.2, stub, w * 0.2]));
  const lobes = 2 + Math.floor(rng() * 3);
  for (let i = 0; i < lobes; i++) {
    const a = rng() * Math.PI * 2, r = range(rng, 0, w * 0.28);
    const ly = stub + range(rng, 0.3, 0.6) * (h - stub);
    const s = range(rng, 0.75, 1) * w * 0.6;
    out.push(I('sphere', 'palm', [cx + Math.cos(a) * r, ly, cz + Math.sin(a) * r], [s, s * 0.85, s]));
  }
}

// Randomly picks a plant type for a garden row, matching the given envelope
// (h = height budget, w = width budget) so mixed planting stays in scale.
// Dispatched per civ: Babylon's dark evergreen grove vs Assyria's bloom.
function gardenPlant(...args) { currentCiv.gardenPlant(...args); }

function babylonPlant(rng, out, cx, cz, h, w) {
  const roll = rng();
  if (roll < 0.55) cypress(rng, out, cx, cz, h, w);
  else if (roll < 0.8) palmTree(rng, out, cx, cz, h * 1.05);
  else shrub(rng, out, cx, cz, h * 0.55, w * 1.3);
}

function assyriaPlant(rng, out, cx, cz, h, w) {
  const roll = rng();
  if (roll < 0.3) cypress(rng, out, cx, cz, h, w);
  else if (roll < 0.5) palmTree(rng, out, cx, cz, h * 1.05);
  else giantFlower(rng, out, cx, cz, h * range(rng, 0.55, 0.8));
}

// Faceted round (Roman) arch. Emits box segments tracing a semicircle up each
// side to a rounded crown — low-poly. Springs from (cx,cz) at height springY,
// spans `span` along the wall axis, rises `rise` (=span/2 for a true semicircle).
// thick = radial band thickness, depth = wall thickness. axis 'x' spans world X
// (band depth along Z); axis 'z' spans world Z (band depth along X).
function archHead(out, cx, springY, cz, span, rise, thick, depth, axis, mat) {
  const h = span / 2;
  const pts = [                       // right half, springline -> crown, sampled on a quarter circle
    [h, 0], [h * 0.924, rise * 0.383], [h * 0.707, rise * 0.707],
    [h * 0.383, rise * 0.924], [0, rise],
  ];
  const emit = (a, b, mir) => {
    const s = mir ? -1 : 1;
    const ax = s * a[0], ay = a[1], bx = s * b[0], by = b[1];
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const len = Math.hypot(bx - ax, by - ay) + thick;   // overlap joints
    const angle = Math.atan2(by - ay, bx - ax);
    if (axis === 'x') {
      out.push(I('box', mat, [cx + mx, springY + my, cz], [len, thick, depth], [0, 0, angle]));
    } else {
      out.push(I('box', mat, [cx, springY + my, cz + mx], [depth, thick, len], [-angle, 0, 0]));
    }
  };
  for (let i = 0; i < pts.length - 1; i++) { emit(pts[i], pts[i + 1], false); emit(pts[i], pts[i + 1], true); }
}

// HSL -> "#rrggbb". h,s,l in [0,1].
function hslHex(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h * 12) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(c * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

// Random textile colour — a warm dyed-cloth palette (reds, ochres, plums, teal).
function clothColor(rng) {
  const centres = [0.01, 0.05, 0.09, 0.92, 0.86, 0.54];   // hue anchors
  const h = (pick(rng, centres) + range(rng, -0.02, 0.02) + 1) % 1;
  return hslHex(h, range(rng, 0.42, 0.66), range(rng, 0.4, 0.55));
}

// Vine pergola: posts carrying a lattice of girders + cross-joists, draped with
// climbing-vine foliage and trailing tendrils. Open and green — a garden roof.
function pergola(rng, out, cx, cz, width, depth, postH, y0) {
  const postR = Math.min(width, depth) * 0.028;
  const topY = y0 + postH;
  const nz = Math.max(2, Math.round(depth / 0.8));
  for (const sx of [-1, 1]) for (let i = 0; i <= nz; i++) {   // posts down both long edges
    const pz = cz - depth / 2 + (i / nz) * depth;
    out.push(I('cylinder', 'wood', [cx + sx * width / 2, y0 + postH / 2, pz], [postR * 2, postH, postR * 2]));
  }
  for (const sx of [-1, 1])                                    // girders along the length
    out.push(I('box', 'wood', [cx + sx * width / 2, topY, cz], [postR * 1.6, postR * 1.5, depth]));
  const nJ = Math.max(3, Math.round(depth / 0.3));
  for (let i = 0; i <= nJ; i++) {                              // cross-joists
    const pz = cz - depth / 2 + (i / nJ) * depth;
    out.push(I('box', 'wood', [cx, topY + postR, pz], [width + postR * 3, postR, postR]));
  }
  const leaves = Math.round(width * depth * 5);
  for (let i = 0; i < leaves; i++)                             // vine canopy draped over the top
    out.push(I('sphere', 'palm',
      [cx + range(rng, -0.5, 0.5) * width, topY + postR + range(rng, 0, 0.07), cz + range(rng, -0.5, 0.5) * depth],
      [0.15, 0.08, 0.15]));
  const tendrils = Math.round(leaves * 0.5);
  for (let i = 0; i < tendrils; i++) {                         // trailing tendrils hanging down
    const hl = range(rng, 0.12, 0.38);
    out.push(I('box', 'palm',
      [cx + range(rng, -0.5, 0.5) * width, topY - hl / 2, cz + range(rng, -0.5, 0.5) * depth],
      [0.03, hl, 0.03]));
  }
}

// Open arcade wall: piers carrying round arches, open above. No top frame —
// the garden drapes a fabric plane over the whole wing instead.
// axis 'x' runs along x (faces ±z); 'z' runs along z (faces ±x). x0/z0 is the
// wall's centre line, y0 its foot, H its full height.
// rng + keep (0..1, optional): ruin mode — each pier/arch only survives with
// probability keep (arches a little less), leaving broken colonnade stumps.
function arcadeWall(out, x0, z0, axis, length, y0, H, wallT, mat, rng, keep = 1) {
  const bays = Math.max(2, Math.round(length / 0.85));
  const bayW = length / bays;
  const pierW = Math.min(wallT * 1.6, bayW * 0.25);
  const openW = Math.min(bayW - pierW, H * 0.85);
  const springH = H * 0.52;
  const rise = Math.min(openW / 2, H - springH);
  const capH = Math.max(0.02, wallT * 0.5);
  for (let i = 0; i <= bays; i++) {                       // piers at each bay boundary
    const along = -length / 2 + i * bayW;
    const px = axis === 'x' ? x0 + along : x0;
    const pz = axis === 'z' ? z0 + along : z0;
    if (keep < 1 && rng() >= keep) {                      // fallen pier: stump only
      out.push(I('box', mat, [px, y0 + springH * 0.15, pz],
        axis === 'x' ? [pierW, springH * 0.3, wallT] : [wallT, springH * 0.3, pierW]));
      continue;
    }
    out.push(I('box', mat, [px, y0 + springH / 2, pz],
      axis === 'x' ? [pierW, springH, wallT] : [wallT, springH, pierW]));
    out.push(I('box', mat, [px, y0 + springH + capH / 2, pz],       // cap: hides the pier/arch seam
      axis === 'x' ? [pierW * 1.5, capH, wallT * 1.3] : [wallT * 1.3, capH, pierW * 1.5]));
  }
  for (let i = 0; i < bays; i++) {                        // round arch over each bay
    if (keep < 1 && rng() >= keep * 0.7) continue;        // collapsed arch
    const along = -length / 2 + (i + 0.5) * bayW;
    const px = axis === 'x' ? x0 + along : x0;
    const pz = axis === 'z' ? z0 + along : z0;
    archHead(out, px, y0 + springH, pz, openW, rise, Math.max(0.03, openW * 0.16), wallT, axis, mat);
  }
}

// GARDEN — two raised arcaded tree-groves under flat fabric canopies, flanking
// a central courtyard with a vine pergola over a reflecting pool. Negative space.
function generateGarden(size, seed, variant = 'normal') {
  if (variant === 'scaffold') return monumentConstruction(size, seed ^ 0x9A2);
  const rng = mulberry32(seed);
  const out = [];
  const ruined = variant === 'ruin';
  const { topY, baseW } = monumentBase(seed ^ 0x51A, out, size);

  const wallH = size * 0.26;
  const wallT = baseW * 0.03;
  const wingHalfW = baseW * 0.15;
  const wingHalfD = baseW * 0.42;
  const wingCxAbs = baseW / 2 - wingHalfW - baseW * 0.02;
  const keep = ruined ? 0.5 : 1;                   // ruin: broken colonnades

  for (const sx of [-1, 1]) {
    const cx = sx * wingCxAbs;
    arcadeWall(out, cx, wingHalfD, 'x', wingHalfW * 2, topY, wallH, wallT, 'sandLight', rng, keep);            // +z
    arcadeWall(out, cx, -wingHalfD, 'x', wingHalfW * 2, topY, wallH, wallT, 'sandLight', rng, keep);           // -z
    arcadeWall(out, cx + sx * wingHalfW, 0, 'z', wingHalfD * 2, topY, wallH, wallT, 'sandLight', rng, keep);   // outer
    arcadeWall(out, cx - sx * wingHalfW, 0, 'z', wingHalfD * 2, topY, wallH, wallT, 'sandLight', rng, keep);   // inner
    out.push(I('box', 'sandDark', [cx, topY + 0.06, 0],
      [wingHalfW * 2 - wallT, 0.12, wingHalfD * 2 - wallT]));                                        // soil bed
    // Fixed absolute spacing (not size-relative): a bigger garden packs in more
    // plants at the same size, rather than the same count of bigger plants.
    const spacing = 0.42;
    const rows = Math.max(2, Math.round((wingHalfD * 2) / spacing));
    const cols = Math.max(1, Math.round((wingHalfW * 2 * 0.7) / spacing));
    for (let r = 0; r < rows; r++) {
      const tz = -wingHalfD + ((r + 0.5) / rows) * wingHalfD * 2;
      for (let c = 0; c < cols; c++) {
        const tx = cols > 1 ? -wingHalfW * 0.7 + ((c + 0.5) / cols) * wingHalfW * 1.4 : 0;
        const px = cx + tx + range(rng, -0.06, 0.06), pz = tz + range(rng, -0.06, 0.06);
        if (ruined) {                              // the garden died with the water: stumps
          if (rng() < 0.7) out.push(I('cylinder', 'wood', [px, topY + 0.17, pz],
            [0.1, range(rng, 0.1, 0.35), 0.1]));
        } else {
          gardenPlant(rng, out, px, pz, range(rng, 1.9, 2.6), 0.4);
        }
      }
    }
  }

  const courtHalfW = wingCxAbs - wingHalfW - baseW * 0.02;
  out.push(I('box', 'sandLight', [0, topY + 0.05, 0], [courtHalfW * 2, 0.1, wingHalfD * 2 * 0.95]));  // dais
  if (ruined) {
    // dry cracked basin, sand-drifted courtyard
    out.push(I('box', 'sandDark', [0, topY + 0.09, 0], [courtHalfW * 1.1, 0.04, wingHalfD * 0.95]));
    for (let i = 0; i < 6; i++) {
      const s = range(rng, 0.06, 0.16);
      out.push(I('box', pick(rng, ['sand', 'sandDark']),
        [range(rng, -0.8, 0.8) * courtHalfW, topY + 0.1 + s / 2, range(rng, -0.8, 0.8) * wingHalfD],
        [s, s, s], [0, rng() * Math.PI, 0]));
    }
  } else {
    out.push(I('box', 'gold', [0, topY + 0.088, 0], [courtHalfW * 1.1 + 0.02, 0.02, wingHalfD * 0.95 + 0.02]));  // gold rim
    out.push(I('box', 'lapis', [0, topY + 0.09, 0], [courtHalfW * 1.1, 0.04, wingHalfD * 0.95]));     // reflecting pool
    pergola(rng, out, 0, 0, courtHalfW * 2, wingHalfD * 2 * 0.9, wallH * 0.82, topY + 0.1);           // vine pergola over the pool
    courtyardGuardians(rng, out, topY, courtHalfW, wingHalfD);                                        // lions + sirrush
  }
  return out;
}

// Shift a generated instruction list up by dy and scale it about the origin —
// lets one monument sit on top of another (composition, not new geometry).
function liftInstructions(instr, dy, s = 1) {
  for (const ins of instr) {
    ins.pos = [ins.pos[0] * s, ins.pos[1] * s + dy, ins.pos[2] * s];
    ins.scale = [ins.scale[0] * s, ins.scale[1] * s, ins.scale[2] * s];
  }
  return instr;
}

// UNDER CONSTRUCTION — shared scaffold variant for every monument type: the
// podium is laid, low unfinished wall stubs trace the future structure, and
// wooden scaffold frames and brick piles cover the site.
function monumentConstruction(size, seed) {
  const rng = mulberry32(seed);
  const out = [];
  const { topY, baseW } = monumentBase(seed ^ 0x5CA, out, size);
  const half = baseW * 0.35;
  for (const [x0, z0, w, d] of [                       // unfinished wall stubs
    [0, half, half * 2, 0.08], [0, -half, half * 2, 0.08],
    [half, 0, 0.08, half * 2], [-half, 0, 0.08, half * 2],
  ]) {
    if (rng() < 0.75) {
      const wallH = range(rng, 0.1, 0.28);
      out.push(I('box', 'sand', [x0, topY + wallH / 2, z0],
        [w === 0.08 ? w : w * range(rng, 0.4, 1), wallH, d === 0.08 ? d : d * range(rng, 0.4, 1)]));
    }
  }
  const frames = 2 + Math.floor(rng() * 2) + Math.floor(size / 3);   // scaffold frames
  for (let i = 0; i < frames; i++) {
    const f = generateScaffold(hashSeed(seed, i, 0x5C, 0));
    liftInstructions(f, topY);
    const fx = range(rng, -0.32, 0.32) * baseW, fz = range(rng, -0.32, 0.32) * baseW;
    for (const ins of f) { ins.pos[0] += fx; ins.pos[2] += fz; }
    out.push(...f);
  }
  const piles = 3 + Math.floor(rng() * 4);             // brick piles
  for (let i = 0; i < piles; i++) {
    out.push(I('box', 'sandLight',
      [range(rng, -0.4, 0.4) * baseW, topY + 0.05, range(rng, -0.4, 0.4) * baseW],
      [range(rng, 0.15, 0.3), 0.1, range(rng, 0.12, 0.25)], [0, rng() * Math.PI, 0]));
  }
  return out;
}

// PODIUM BUILDING — a sprawling palace compound: box rooms of varying size
// arranged across a shared platform, using the ordinary house vocabulary
// (windows, cornices, doorways, awnings). Horizontal silhouette, not vertical.
function generatePodium(size, seed, variant = 'normal') {
  if (variant === 'scaffold') return monumentConstruction(size, seed ^ 0x90E);
  const rng = mulberry32(seed);
  const out = [];
  const ruined = variant === 'ruin';
  const { topY, baseW } = monumentBase(seed ^ 0x90D, out, size);

  // grand central hall, entrance facing +z (ruin: collapsed to a low shell)
  const hallW = baseW * 0.42, hallD = baseW * 0.34;
  const hallH = size * 0.28 * (ruined ? range(rng, 0.35, 0.55) : 1);
  const hall = I('box', ruined ? 'sand' : 'sandLight', [0, topY + hallH / 2, -baseW * 0.12], [hallW, hallH, hallD]);
  out.push(hall);
  windows(rng, out, hall, 3, 1);
  if (!ruined) {
    cornice(rng, out, hall, 'gold', false);            // gold crenellation on the hall
    const dw = 0.16, dh = hallH * 0.62;
    const doorZ = hall.pos[2] + hallD / 2 + 0.014;
    out.push(I('box', 'window', [0, topY + dh / 2, doorZ], [dw, dh, 0.028]));
    archHead(out, 0, topY + dh, doorZ, dw * 1.3, dw * 0.65, 0.04, 0.03, 'x', 'gold');
  }

  // annex rooms scattered around the hall, varied heights, wood-beaded cornices
  const annexes = 3 + Math.floor(rng() * 3);
  for (let i = 0; i < annexes; i++) {
    const aw = baseW * range(rng, 0.14, 0.26), ad = baseW * range(rng, 0.14, 0.26);
    const ah = hallH * range(rng, 0.45, 0.75);
    const side = i % 2 ? 1 : -1;
    const ax = side * range(rng, 0.24, 0.42) * baseW;
    const az = range(rng, -0.3, 0.3) * baseW;
    const annex = I('box', pick(rng, ['sand', 'sandLight']), [ax, topY + ah / 2, az], [aw, ah, ad]);
    out.push(annex);
    windows(rng, out, annex, 2, 1);
    if (!ruined) {
      cornice(rng, out, annex, 'wood', true);
      if (rng() < 0.5) awning(rng, out, annex);
    }
  }

  if (ruined) {                                        // debris across the platform
    for (let i = 0; i < 8; i++) {
      const s = range(rng, 0.06, 0.18);
      out.push(I('box', pick(rng, ['sand', 'sandDark']),
        [range(rng, -0.42, 0.42) * baseW, topY + s / 2, range(rng, -0.42, 0.42) * baseW],
        [s, s, s], [0, rng() * Math.PI, 0]));
    }
  } else {
    // forecourt in front of the hall: lions flanking the approach
    for (const sx of [-1, 1]) {
      const lx = sx * hallW * 0.42, lz = baseW * 0.36;
      out.push(I('box', 'sandDark', [lx, topY + 0.045, lz], [0.16, 0.09, 0.16]));
      goldGuardian(out, lx, topY + 0.09, lz, 0, 1, 'gold');
    }
  }
  return out;
}

// GRAND ZIGGURAT — a ziggurat raised on a monumental podium: pure composition.
// The ziggurat is generated normally, then lifted onto the platform and shrunk
// slightly so its ramp stays within the podium footprint.
function generateGrandZiggurat(size, seed, variant = 'normal', special = false) {
  if (variant === 'scaffold') return monumentConstruction(size, seed ^ 0x62B);
  const rng = mulberry32(seed);
  const out = [];
  const { topY, baseW } = monumentBase(seed ^ 0x62A, out, size);
  const zig = generateZiggurat(Math.max(3, size - 2), seed ^ 0x216, variant === 'ruin' ? 'ruin' : 'normal', 0, special);
  out.push(...liftInstructions(zig, topY, 0.9));
  // sirrush mosaic on the podium's front face flanking the ziggurat's stair
  for (const sx of [-1, 1]) {
    sirrushFrieze(out, sx * baseW * 0.28, baseW / 2, 'x', baseW * 0.34, topY * 0.25, 1, 'lapis');
  }
  return out;
}

// PROCESSIONAL GATE — Ishtar Gate: two lapis towers flanking a grand arch,
// gold crenellation, sirrush mosaic friezes. Built entirely from existing parts.
function generateGate(size, seed, variant = 'normal') {
  if (variant === 'scaffold') return monumentConstruction(size, seed ^ 0x6A7E);
  const rng = mulberry32(seed);
  const out = [];
  const w = size * 0.98;
  const towerW = w * 0.3, towerD = w * 0.34, towerH = size * 0.85;
  const spanW = w - towerW * 2;                        // clear opening between towers
  const archSpring = towerH * 0.42;
  const archRise = Math.min(spanW / 2, towerH * 0.25);

  const ruined = variant === 'ruin';
  // ruin: the two towers survive to different heights, everything between fell
  const towerHs = ruined
    ? [towerH * range(rng, 0.35, 0.55), towerH * range(rng, 0.6, 0.85)]
    : [towerH, towerH];
  for (const sx of [-1, 1]) {                          // towers
    const tx = sx * (w / 2 - towerW / 2);
    const th = towerHs[(sx + 1) / 2];
    const tower = I('box', ruined ? 'sand' : 'lapis', [tx, th / 2, 0], [towerW, th, towerD]);
    out.push(tower);
    if (!ruined) {
      cornice(rng, out, tower, 'gold', false);         // gold crenellation
      // mosaic friezes on the outward (+z) face, two bands
      sirrushFrieze(out, tx, towerD / 2, 'x', towerW * 0.9, towerH * 0.12, 1, 'lapis');
      sirrushFrieze(out, tx, towerD / 2, 'x', towerW * 0.9, towerH * 0.55, 1, 'lapis');
    }
  }

  if (ruined) {                                        // collapsed span: rubble choking the passage
    rubble(rng, out, 0, 0, 6);
    for (let i = 0; i < 4; i++) {
      const s = range(rng, 0.1, 0.22);
      out.push(I('box', pick(rng, ['sand', 'sandDark']),
        [range(rng, -0.5, 0.5) * spanW, s / 2, range(rng, -0.4, 0.4) * towerD],
        [s, s, s], [0, rng() * Math.PI, 0]));
    }
    return out;
  }

  // wall above the arch connecting the towers, resting on the arch crown
  const wallD = towerD * 0.85;
  const lintelY0 = archSpring + archRise;
  const lintel = I('box', 'lapis', [0, (lintelY0 + towerH * 0.92) / 2, 0],
    [spanW + 0.04, towerH * 0.92 - lintelY0, wallD]);
  out.push(lintel);
  cornice(rng, out, lintel, 'gold', false);
  sirrushFrieze(out, 0, wallD / 2, 'x', spanW * 0.9, lintelY0 + towerH * 0.08, 1, 'lapis');

  // the passage is a real opening — you can see straight through the gate.
  // Gold arch bands frame the void on both faces; stepped lapis spandrels fill
  // only the corners between the curve and the lintel above.
  const innerHalf = spanW * 0.94 / 2;
  const spandrelRows = 3;
  for (let i = 0; i < spandrelRows; i++) {
    const fTop = (i + 1) / spandrelRows;
    const wCurve = innerHalf * Math.sqrt(Math.max(0, 1 - fTop * fTop));
    const bw = spanW / 2 - wCurve + 0.02;
    if (bw <= 0.01) continue;
    for (const sx of [-1, 1]) {
      out.push(I('box', 'lapis',
        [sx * (wCurve + bw / 2), archSpring + (i + 0.5) * (archRise / spandrelRows), 0],
        [bw, archRise / spandrelRows + 0.01, wallD]));
    }
  }
  for (const fz of [-1, 1]) {
    archHead(out, 0, archSpring, fz * wallD / 2, spanW * 0.94, archRise, 0.09, 0.06, 'x', 'gold');
  }

  // guardian lions flanking the approach
  for (const sx of [-1, 1]) {
    const lx = sx * (spanW / 2 + towerW * 0.3), lz = towerD * 0.75;
    out.push(I('box', 'sandDark', [lx, 0.06, lz], [0.2, 0.12, 0.2]));
    goldGuardian(out, lx, 0.12, lz, 0, 1, 'gold');
  }
  return out;
}

// Size-band dispatch: what a detected solid square becomes as it grows.
// 3-4 ziggurat, 5-7 garden, 8-9 podium palace, 10+ grand ziggurat-on-podium.
function generateMonument(size, seed, variant, stairFace, special = false) {
  if (size <= 4) return generateZiggurat(size, seed, variant, stairFace, special);
  if (size <= 7) return generateGarden(size, seed, variant);
  if (size <= 9) return generatePodium(size, seed, variant);
  return generateGrandZiggurat(size, seed, variant, special);
}


/* ============================================================================
   GRID / AUTOMATON LAYER — no rendering knowledge.
   ------------------------------------------------------------------------- */

let N = 64;                          // grid size, user-editable (simulation cost is trivial even large;
                                      // it's per-tile full-detail generation that's capped, see buildingCap)

// hash a lattice/tile coordinate to [0,1) deterministically from the global seed
function hash01(globalSeed, x, y, salt) {
  return mulberry32(hashSeed(globalSeed, x, y, salt))();
}

function seedGrid(globalSeed, density) {
  const g = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    g[y * N + x] = hash01(globalSeed, x, y, 0xBEEF) < density ? 1 : 0;
  }
  return g;
}

// Moore neighbour counts, dead edges (no wraparound). Grid values are faction
// ids (0 empty, 1 Babylon, 2 Assyria): neighbourCount = any occupancy,
// neighbourCountF = same-faction only (drives building form + growth rules).
function neighbourCount(g, x, y) {
  let c = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < N && ny >= 0 && ny < N && g[ny * N + nx]) c++;
  }
  return c;
}
function neighbourCountF(g, x, y, f) {
  let c = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < N && ny >= 0 && ny < N && g[ny * N + nx] === f) c++;
  }
  return c;
}

// One Life step under B/S rule sets (arrays of counts)
function stepGrid(g, B, S) {
  const out = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const n = neighbourCount(g, x, y);
    out[y * N + x] = g[y * N + x] ? (S.includes(n) ? 1 : 0) : (B.includes(n) ? 1 : 0);
  }
  return out;
}

function parseRule(str) {           // "B3/S12345" -> { B:[3], S:[1,2,3,4,5] }
  const m = str.match(/B(\d*)\/S(\d*)/i);
  return { B: [...m[1]].map(Number), S: [...m[2]].map(Number) };
}

/* ============================================================================
   GENERATION PRESETS — each is a pure step function (grid, gen) -> grid.
   Life-like B/S rules plus custom automata. The custom ones use the seeded
   hash (global seed + cell + generation), so they stay fully deterministic:
   same seed -> same city, always.
   ------------------------------------------------------------------------- */

function bsStep(ruleStr) {
  const { B, S } = parseRule(ruleStr);
  return (g) => stepGrid(g, B, S);
}

// hash a cell+generation to [0,1) — the dice roll of the custom automata
function roll(x, y, gen, salt) {
  return hash01(globalSeed, x, y, Math.imul(gen + 1, 0x9E37) ^ salt);
}

// Caravan Sprawl: settlements spread to adjacent open ground, old quarters are
// slowly abandoned. Growth chance scales with how much city already borders a lot.
function sprawlStep(g, gen) {
  const out = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, n = neighbourCount(g, x, y);
    if (g[i]) {
      out[i] = (n === 0 || roll(x, y, gen, 0xA8A1) < 0.02) ? 0 : 1;   // lonely or abandoned
    } else {
      // god-game tune: ~4x slower spread than the toy so the player's paint
      // stays the majority author of the city (playtest-notes.md #2)
      out[i] = (n >= 1 && roll(x, y, gen, 0x5EED) < 0.015 * n) ? 1 : 0;
    }
  }
  return out;
}

// Wandering City: quarters decay behind and rebuild ahead, so the whole city
// slowly migrates east across the desert, leaving ruins in its wake.
function driftStep(g, gen) {
  const out = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, n = neighbourCount(g, x, y);
    if (g[i]) {
      out[i] = (n === 0 || roll(x, y, gen, 0xDEAD) < 0.16) ? 0 : 1;   // decay
    } else {
      const westAlive = x > 0 && g[i - 1];
      out[i] = (westAlive && roll(x, y, gen, 0xCAFE) < 0.5) ||
               (n >= 5 && roll(x, y, gen, 0xF00D) < 0.3) ? 1 : 0;     // rebuild ahead / infill
    }
  }
  return out;
}

// Great Flood: Conway life with a trickle of returning settlers (so the city
// never dies out), plus a flood band sweeping across the grid on a long cycle
// that clears everything it touches. Ruins telegraph its arrival; scaffolds
// mark the resettlement behind the receding waters.
function floodStep(g, gen) {
  const out = stepGrid(g, [3], [2, 3]);
  const period = 48, bandW = 5;
  const t = ((gen + 1) % period) / period;                            // where the flood is
  const bandCentre = -bandW + t * (N + bandW * 2);
  for (let y = 0; y < N; y++) {
    const flooded = Math.abs(y - bandCentre) <= bandW / 2;
    for (let x = 0; x < N; x++) {
      const i = y * N + x;
      if (flooded) { out[i] = 0; continue; }                          // swept away
      // settlers return as a 2x2 camp (a still life, so it survives to grow)
      if (roll(x, y, gen, 0x5E77) < 0.003 && x < N - 1 && y < N - 1 &&
          Math.abs(y + 1 - bandCentre) > bandW / 2) {
        out[i] = out[i + 1] = out[i + N] = out[i + N + 1] = 1;
      }
    }
  }
  return out;
}

const PRESETS = [
  { name: 'Old Quarter',     step: bsStep('B3/S12345'),    density: 0.40 },
  { name: 'Villages',        step: bsStep('B3/S23'),       density: 0.40 },
  { name: 'Planned Quarter', step: bsStep('B3/S1234'),     density: 0.40 },
  { name: 'Coral',           step: bsStep('B3/S45678'),    density: 0.40 },
  { name: 'Day & Night',     step: bsStep('B3678/S34678'), density: 0.50 },
  { name: 'Eternal City',    step: bsStep('B3/S012345678'), density: 0.30 },  // Life without Death: only ever grows
  { name: 'Temple Wards',    step: bsStep('B5678/S45678'), density: 0.50 },   // Vote: coarsens into big solid districts
  { name: 'Shifting Sands',  step: bsStep('B4678/S35678'), density: 0.50 },   // Anneal: districts that slowly morph
  { name: 'Nomad Camps',     step: bsStep('B2/S'),         density: 0.03 },   // Seeds: everything is perpetually temporary
  { name: 'Walled Cities',   step: bsStep('B45678/S2345'), density: 0.20 },   // stabilises into dense towns ringed by solid walls
  { name: 'Twin Dynasties',  step: bsStep('B36/S23'),      density: 0.40 },   // HighLife: like Villages but replicators copy districts
  { name: 'Oasis Blooms',    step: bsStep('B35678/S5678'), density: 0.48 },   // Diamoeba: huge amoeba districts with writhing edges
  { name: 'Old Ink',         step: bsStep('B3678/S235678'), density: 0.40 },  // Stains: growth congeals into permanent blot districts
  { name: 'Caravan Sprawl',  step: sprawlStep,             density: 0.05 },
  { name: 'Wandering City',  step: driftStep,              density: 0.25 },
  { name: 'Great Flood',     step: floodStep,              density: 0.40 },
];

/* ============================================================================
   JITTERED LATTICE — shared (N+1)x(N+1) vertex grid, each point offset once,
   so adjacent tiles agree on their shared edge. Offsets are seeded from the
   global seed: same seed -> same city, jitter included.
   ------------------------------------------------------------------------- */

const JITTER = 0.1;                 // max offset, fraction of cell width

let lattice = null;                 // [j][i] -> {x, z}
let circularIsland = false;         // toggle: circular island vs rectangular grid

function buildLattice(globalSeed) {
  lattice = [];
  for (let j = 0; j <= N; j++) {
    const row = [];
    for (let i = 0; i <= N; i++) {
      let x = i - N / 2 + (hash01(globalSeed, i, j, 0xA11CE) * 2 - 1) * JITTER;
      let z = j - N / 2 + (hash01(globalSeed, i, j, 0xB0B) * 2 - 1) * JITTER;

      // Circular island: elliptical grid mapping (square [-1,1]² -> unit disc).
      // Unlike a polar grid, the interior stays near-identity (cells keep their
      // square shape, no squish at the centre); only the corners stretch out to
      // meet the circle's rim. That's the "square tiles arranged on a circle"
      // read we want. https://arxiv.org/abs/1509.06344
      if (circularIsland) {
        const u = x / (N / 2), v = z / (N / 2);          // normalise to [-1, 1]
        const du = u * Math.sqrt(1 - v * v / 2);
        const dv = v * Math.sqrt(1 - u * u / 2);
        const R = N / 2;                                 // island radius in world units
        x = du * R;
        z = dv * R;
      }

      row.push({ x, z });
    }
    lattice.push(row);
  }
}

// Per-tile affine placement from its 4 jittered corners: centroid + mean yaw +
// mean edge lengths. Buildings stay rigid (instancing-friendly), just nudged.
function tileTransform(x, y) {
  const p00 = lattice[y][x], p10 = lattice[y][x + 1],
        p01 = lattice[y + 1][x], p11 = lattice[y + 1][x + 1];
  const cx = (p00.x + p10.x + p01.x + p11.x) / 4;
  const cz = (p00.z + p10.z + p01.z + p11.z) / 4;
  const yawBottom = Math.atan2(p10.z - p00.z, p10.x - p00.x);
  const yawTop = Math.atan2(p11.z - p01.z, p11.x - p01.x);
  const yaw = (yawBottom + yawTop) / 2;
  const len = (a, b) => Math.hypot(b.x - a.x, b.z - a.z);
  const sx = (len(p00, p10) + len(p01, p11)) / 2;
  const sz = (len(p00, p01) + len(p10, p11)) / 2;
  // terrain: sit at the mean corner height, lean toward the terrain normal.
  // tx/tz are the FULL tilt angles — callers scale them (dense blocks barely
  // tilt so fused quarters stay coherent; lone huts lean into the slope).
  const h00 = terrainHeight(x, y), h10 = terrainHeight(x + 1, y),
        h01 = terrainHeight(x, y + 1), h11 = terrainHeight(x + 1, y + 1);
  const cy = (h00 + h10 + h01 + h11) / 4;
  const slopeX = ((h10 + h11) - (h00 + h01)) / 2 / sx;   // rise toward +x
  const slopeZ = ((h01 + h11) - (h00 + h10)) / 2 / sz;   // rise toward +z
  const tx = -Math.atan(slopeZ), tz = Math.atan(slopeX);
  return { cx, cy, cz, yaw: -yaw, sx, sz, tx, tz };
}

/* ============================================================================
   RENDER LAYER — Three.js, render-on-demand (no continuous loop).
   ------------------------------------------------------------------------- */

/* ----------------------------------------------------------------------------
   CIVILIZATIONS — the mirror principle (BABYLON-2.md): one generator, two
   flags. Material KEYS are shared; each civ resolves them to its own palette.
   Geometry differences (guardian, frieze art, garden mix, banners) dispatch
   through `currentCiv`, set per tile during rebuild.
   ------------------------------------------------------------------------- */

const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.95, ...extra });
const clothM = c => std(c, { roughness: 1.0, side: THREE.DoubleSide });
const SHARED_MATS = {

  wood:    std(0x7a5a38, { roughness: 0.9 }),
  palm:    std(0x4e7a34, { roughness: 0.9 }),
  // reserved for the single crowned great ziggurat (see rebuildInstances)
  bitumen: std(0x241a12, { roughness: 0.85, metalness: 0.05 }),
  skyBlue: std(0x6bb8d6, { roughness: 0.4, metalness: 0.05 }),
  orange:  std(0xdb7b2e, { roughness: 0.55, metalness: 0.05 }),
};
const MATS_BABYLON = {                                   // warm mudbrick, lapis + gold

  sand:       std(0xd9c197), sandLight: std(0xe9d8b0), sandDark: std(0xb99e6f),
  cloth:      clothM(0x6b4a3a), clothRed: clothM(0xbe4a35),
  clothPlum:  clothM(0x99506e), clothOchre: clothM(0xcf9a44),
  lapis:      std(0x1f4e9c, { roughness: 0.35, metalness: 0.15 }),
  gold:       std(0xd4a437, { roughness: 0.3, metalness: 0.6 }),
};
const MATS_ASSYRIA = {                                   // grey gypsum, blood-red + bronze
  ...SHARED_MATS,
  wood:       std(0x6b4e30, { roughness: 0.9 }),
  sand:       std(0xb5ad9c), sandLight: std(0xcdc6b6), sandDark: std(0x8b8373),
  cloth:      clothM(0x5a3a32), clothRed: clothM(0x9e2b1e),
  clothPlum:  clothM(0x6e2430), clothOchre: clothM(0x3a322c),
  lapis:      std(0x8e2620, { roughness: 0.35, metalness: 0.15 }),   // glazed blood-red
  gold:       std(0xb07c3a, { roughness: 0.35, metalness: 0.55 }),   // bronze
};
const MATS = MATS_BABYLON;                               // legacy references (ground tints etc.)

const CIVS = {
  1: { id: 'bab', name: 'Babylon', mats: MATS_BABYLON, friezeArt: SIRRUSH_ART,
       guardian: lionGuardian, gardenPlant: babylonPlant, banners: false },
  2: { id: 'assy', name: 'Assyria', mats: MATS_ASSYRIA, friezeArt: LAMASSU_ART,
       guardian: lamassuGuardian, gardenPlant: assyriaPlant, banners: true },
};
const BABYLON = 1, ASSYRIA = 2;
let currentCiv = CIVS[BABYLON];                          // set per tile in rebuildInstances

const GEOS = {
  box:      new THREE.BoxGeometry(1, 1, 1),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 8),
  cone:     new THREE.CylinderGeometry(0.06, 0.5, 1, 7),
  sphere:   new THREE.SphereGeometry(0.5, 8, 6),
  arch:     new THREE.TorusGeometry(0.5, 0.1, 8, 12, Math.PI),
};

/* ============================================================================
   CANAL — a seeded meandering river (the Euphrates) crossing the grid west to
   east, two tiles wide. Canal cells are forced dead in the automaton, so the
   city grows along its banks. Tiles near the river form a green floodplain
   with palms and reeds. Both ends are faked out to the horizon.
   ------------------------------------------------------------------------- */

let canalOn = true;
let oceanOn = false;
let canalMask = null;               // Uint8Array N*N, 1 = water
let floodDist = null;               // Uint8Array N*N, Chebyshev distance to water (255 = far)
let canalRows = null;               // per column x: upper row of the channel
let canalWidths = null;             // per column x: channel width in cells (varies under a flow preset)
let riverWidth = 1;                 // channel width in cells, user-controllable (baseline under a flow preset)

// River flow presets — every active one is a TRAVELLING wave. Each defines a
// waveform `wave(g)` in [0,1] over (fractional) generation g, and `travel`, the
// number of generations the wave takes to cross the river. buildCanal() samples
// it per column at a time lag of x/N * travel, so the waveform sweeps DOWN the
// channel (west -> east) instead of the whole river pulsing in unison — the
// "traveling crest" read, generalised. At any instant width varies smoothly
// along X; over generations the pattern drifts downstream.
//
// riverWidth is the MINIMUM (the wave only ever adds width on top, up to
// FLOW_AMP); buildCanal() also floors at riverWidth and caps at 6, so the floor
// is a hard guarantee. Manual disables modulation entirely (wave: null).
const FLOW_AMP = 3;
const wrapPhase = (g, period) => (((g % period) + period) % period) / period;   // 0..1, safe for negative g
const RIVER_FLOWS = [
  { name: 'Manual', wave: null, travel: 0 },
  { name: 'Seasonal', travel: 113, wave: g =>              // a gentle swell drifting downstream (~one wavelength spans the river)
      0.5 + 0.5 * Math.sin(g / 18) },
  { name: 'Annual flood', travel: 60, wave: g => {         // slow rise, sharp crest, long recede — the flood sweeps down the valley
      const period = 60, riseLen = period * 0.4;
      const t = ((g % period) + period) % period;
      const s = t < riseLen ? t / riseLen : 1 - (t - riseLen) / (period - riseLen);
      return Math.pow(Math.max(0, s), 2.2);
    } },
