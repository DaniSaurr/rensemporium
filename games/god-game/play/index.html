      seed: hashSeed(globalSeed, tile.x, tile.y, gYear ^ 0xB3B3),
      hasClay: tile.terrain==='wet',
      readyYear: tile.terrain==='wet' ? gYear+1 : null,
    };
  }
  for (const tile of placement.tiles) {
    for (const n of gNeighbours4(tile.x, tile.y)) {
      if (gIsScaffold(n, f) && n.content.placedYear===gYear && n.content.groupId!==gid) {
        const oldGid = n.content.groupId;
        for (const q of gTiles) if (gIsScaffold(q, f) && q.content.groupId===oldGid) q.content.groupId = gid;
      }
    }
  }
  if (f==='bab') gToast(`⛏ ${size===1?'Scaffold':size+' scaffolds'} staked (\u{1F33E}${size})`);
  else gToast('⚑ Assyria stakes out new ground', 'assy');
  return true;
}

// ---------- god-hand actions ----------
// 'year' = consumes a year; 'free' = planning; false = nothing happened
function gGodAction(t, f) {
  if (!t || t.terrain==='water') return false;
  if (gSideOf(t.x, t.y) !== f) return false;
  const S = gF[f];
  if (gIsReed(t, true, f)) {
    const targets = gNearestN(t.x, t.y, S.hand, tt => gIsReed(tt, true, f));
    for (const tt of targets) { tt.content = null; S.reed++; }
    gCheckDoom(f);
    return 'year';
  }
  if (gIsReed(t, false, f)) { t.content = null; return 'year'; }
  if (t.terrain==='wet' && !t.content && gHasReedNb(t.x, t.y, f)) {
    const targets = gNearestN(t.x, t.y, S.hand,
      tt => tt.terrain==='wet' && !tt.content && gSideOf(tt.x,tt.y)===f && gHasReedNb(tt.x,tt.y,f));
    for (const tt of targets) tt.content = { kind:'reed', f, mature:false, readyYear:gYear+2 };
    return 'year';
  }
  if (!t.content && (t.terrain==='wet' || t.terrain==='dry')) {
    return gStampShape(f, t, S.hand) ? 'free' : false;
  }
  return false;
}
function gTryBuildFarm(t, f) {
  if (!gIsReed(t, true, f)) return false;
  const arms = [[t.x+1,t.y],[t.x-1,t.y],[t.x,t.y+1],[t.x,t.y-1]].map(([a,b]) => gAt(a,b));
  if (arms.every(a => gIsReed(a, true, f))) {
    arms.forEach(a => a.content = null);
    t.content = { kind:'building', f, building:'farm', cells:[[0,0]],
      seed: hashSeed(globalSeed, t.x, t.y, gYear ^ 0xFA53) };
    if (f==='bab') gToast('\u{1F33E} Farm built — click it each year to work reed at range');
    else gToast('⚑ Assyria raised a farm', 'assy');
    return true;
  }
  return false;
}

// ---------- free dispatch ----------
function gDispatch(t, icon) {
  const b = t.content, f = b.f, S = gF[f];
  if (b.lastActed === gYear) return false;
  if (b.building === 'barracks') {
    const want = (icon==='defend') ? 'defend' : (icon==='work') ? 'work' : 'muster';
    if (want === b.stance) { b.pending = null; return false; }
    b.pending = want;
    b.lastActed = gYear;
    if (f==='bab')
      gToast(want==='defend' ? '\u{1F6E1} The houses take up shields — ready next year'
           : want==='work'   ? '\u{1F3E0} The houses stand down — back to work next year'
                             : '⚔ The houses muster — army ready next year');
    return true;
  }
  // workers can't cross the river on foot: every task must lie on the bank
  // this building physically stands on (matters for converted holdings —
  // a captured house on the far bank works the far bank, or idles)
  const mySide = gSideOf(t.x, t.y);
  if (b.building === 'farm') {
    const harv = gNearestN(t.x, t.y, 1, tt =>
      gIsReed(tt,true,f) && gSideOf(tt.x,tt.y)===mySide &&
      Math.max(Math.abs(tt.x-t.x),Math.abs(tt.y-t.y))<=GAME.FARM_REACH);
    if (harv.length) { harv[0].content=null; S.reed++; b.lastActed=gYear; gCheckDoom(f); return true; }
    const plant = gNearestN(t.x, t.y, 1, tt =>
      tt.terrain==='wet' && !tt.content && gSideOf(tt.x,tt.y)===mySide && gHasReedNb(tt.x,tt.y,f) &&
      Math.max(Math.abs(tt.x-t.x),Math.abs(tt.y-t.y))<=GAME.FARM_REACH);
    if (plant.length) { plant[0].content={kind:'reed',f,mature:false,readyYear:gYear+1}; b.lastActed=gYear; return true; }
    return false;
  }
  const scaf = gNearestN(t.x, t.y, 1, tt =>
    gIsScaffold(tt, f) && !tt.content.hasClay && gSideOf(tt.x,tt.y)===mySide);
  if (scaf.length) {
    scaf[0].content.hasClay = true; scaf[0].content.readyYear = gYear+1;
    b.lastActed = gYear; if (f==='bab') gToast('\u{1F9F1} Clay delivered');
    return true;
  }
  const harv = gNearestN(t.x, t.y, 1, tt => gIsReed(tt,true,f) && gSideOf(tt.x,tt.y)===mySide);
  if (harv.length) { harv[0].content=null; S.reed++; b.lastActed=gYear; gCheckDoom(f); return true; }
  return false;
}
function gHasTask(t) {
  const b = t.content;
  if (!gIsBuilding(t)) return false;
  if (b.lastActed === gYear) return false;
  if (b.building === 'port') return false;
  if (b.building === 'barracks') return true;
  const f = b.f;
  const mySide = gSideOf(t.x, t.y);   // same bank-bound rule as gDispatch
  if (b.building === 'farm') {
    return gTiles.some(tt =>
      Math.max(Math.abs(tt.x-t.x),Math.abs(tt.y-t.y))<=GAME.FARM_REACH &&
      gSideOf(tt.x,tt.y)===mySide &&
      (gIsReed(tt,true,f) || (tt.terrain==='wet' && !tt.content && gHasReedNb(tt.x,tt.y,f))));
  }
  return gTiles.some(tt => gIsScaffold(tt, f) && !tt.content.hasClay && gSideOf(tt.x,tt.y)===mySide)
      || gTiles.some(tt => gIsReed(tt,true,f) && gSideOf(tt.x,tt.y)===mySide);
}

// ---------- war ----------
function gHasPort(f) { return gTiles.some(t => gIsBuilding(t,f) && t.content.building==='port'); }
function gBarracksCount(f) { return gTiles.filter(t => gIsBuilding(t,f) && t.content.building==='barracks').length; }
function gMusterCount(f) {
  // a barracks that marched rests for a year before it can march again
  return gTiles.filter(t => gIsBuilding(t,f) && t.content.building==='barracks'
    && t.content.stance==='muster'
    && !(t.content.restUntil && gYear < t.content.restUntil)).length;
}
function gDefendersNear(f, target) {
  return gTiles.filter(t => gIsBuilding(t,f) && t.content.building==='barracks' && t.content.stance==='defend'
    && Math.max(Math.abs(t.x-target.x), Math.abs(t.y-target.y)) <= GAME.WAR.DEF_RANGE).length;
}
function gWarReady(f) { return gHasPort(f) && gMusterCount(f) >= 1; }
function gRaid(attacker, target) {
  const defender = target.content.f;
  const atk = gMusterCount(attacker);
  const def = GAME.WAR.DEF_BASE + GAME.WAR.DEF_PER_BARRACKS * gDefendersNear(defender, target);
  const label = GLABEL[target.content.building] || '?';
  if (atk > def) {
    // the army that marched must rest: every active muster sits out a year
    for (const t of gTiles) if (gIsBuilding(t,attacker) && t.content.building==='barracks'
      && t.content.stance==='muster' && !(t.content.restUntil && gYear < t.content.restUntil)) {
      t.content.restUntil = gYear + 2;
    }
    if (target.content.building === 'port') {
      const cells = target.content.cells || [[0,0]];
      cells.forEach(([dx,dy]) => { const tt = gAt(target.x+dx, target.y+dy); if (tt) tt.content = null; });
      gToast(attacker==='bab' ? `\u{1F525} ${atk}v${def} — their port burns; Assyria is stranded`
                              : `\u{1F525} ${atk}v${def} — Assyria burned your port!`, attacker==='bab'?undefined:'assy');
    } else {
      const extra = atk - def - 1;
      const conquered = [target, ...gNearestN(target.x, target.y, extra, tt =>
        gIsBuilding(tt, defender) && tt!==target && tt.content.building!=='port')];
      for (const b of conquered) {
        b.content.f = attacker;
        if (b.content.building==='barracks') { b.content.stance='work'; b.content.pending=null; }
        b.content.lastActed = gYear;
      }
      const n = conquered.length;
      gToast(attacker==='bab' ? `⚔ ${atk}v${def} — ${n>1?n+' buildings convert':'the '+label+' converts'} to Babylon`
                              : `⚔ ${atk}v${def} — Assyria converted ${n>1?n+' of your buildings':'your '+label}!`, attacker==='bab'?undefined:'assy');
    }
  } else {
    for (const t of gTiles) if (gIsBuilding(t,attacker) && t.content.building==='barracks' && t.content.stance==='muster') {
      t.content.stance = 'work'; t.content.pending = null;
    }
    gToast(attacker==='bab' ? `\u{1F6E1} ${atk}v${def} — the raid breaks; your army disbands`
                            : `\u{1F6E1} ${atk}v${def} — you repelled Assyria's raid!`, attacker==='bab'?undefined:'assy');
  }
  return true;
}
function gTryRaid(target) {
  if (!gHasPort('bab')) { gToast('⚓ No crossing — you need a port on the river'); return false; }
  if (gMusterCount('bab') < 1) {
    const resting = gTiles.some(t => gIsBuilding(t,'bab') && t.content.building==='barracks'
      && t.content.stance==='muster' && t.content.restUntil && gYear < t.content.restUntil);
    gToast(resting ? '\u{1F3D5} The army is resting — it can march again next year'
                   : '⚔ No army — muster a barracks first (takes a year)');
    return false;
  }
  return gRaid('bab', target);
}

// ---------- year advance ----------
function gAdvanceYear() {
  if (gOver) return;
  gAiTurn('assy');
  gYear++;
  for (const t of gTiles) if (gIsBuilding(t) && t.content.building==='barracks' && t.content.pending) {
    t.content.stance = t.content.pending; t.content.pending = null;
  }
  for (const t of gTiles) if (gIsReed(t,false) && gYear >= t.content.readyYear) t.content.mature = true;
  const done = new Set();
  for (const t of gTiles) {
    if (!gIsScaffold(t)) continue;
    const gid = t.content.groupId;
    if (done.has(gid)) continue;
    done.add(gid);
    const members = gTiles.filter(tt => gIsScaffold(tt) && tt.content.groupId===gid);
    if (!members.every(m => m.content.hasClay && m.content.readyYear!==null && gYear >= m.content.readyYear)) continue;
    const f = members[0].content.f;
    const building = gShapeBuilding(members);
    if (!building) {
      for (const m of members) m.content = { kind:'building', f, building:'house', cells:[[0,0]], seed: m.content.seed };
      if (f==='bab') gToast('The plan had no shape — it settles into houses');
    } else {
      const anchorT = members.slice().sort((a,b) => a.y-b.y || a.x-b.x)[0];
      const cells = members.map(m => [m.x-anchorT.x, m.y-anchorT.y]);
      const obj = { kind:'building', f, building, cells, seed: anchorT.content.seed };
      if (building==='barracks') obj.stance = 'work';
      gFillCells(anchorT.x, anchorT.y, cells, obj);
      if (building!=='house') {
        if (f==='bab') gToast(`⬆ ${GLABEL[building]} completed`);
        else if (building==='port') gToast('⚑ Assyria built a port — they can cross now', 'assy');
        else gToast(`⚑ Assyria completed a ${GLABEL[building]}`, 'assy');
      }
    }
  }
  gUpdateMaxHand('bab');
  gUpdateMaxHand('assy');
  gCheckDoom('bab');
  gCheckDoom('assy');
  gCheckVictory();
  gDeriveGrid();
  gameRebuild();
  gRefreshHover();
  updateGameHUD();
  render();
}
function gUpdateMaxHand(f) {
  const S = gF[f];
  const count = gTiles.filter(t => gIsBuilding(t,f)).length;
  let m = 1;
  for (let size=2; size<=4; size++) if (count >= GAME.HAND_UNLOCK[size]) m = size;
  if (m > S.maxHand) {
    S.maxHand = m; S.hand = m;
    if (f==='bab') { handSize = m; gToast(`⬆ Your hand grows — size ${m}`); }
    else gToast('⚑ Assyria\'s reach grows', 'assy');
  }
}

// ---------- doom + victory ----------
function gCheckDoom(f) {
  const S = gF[f];
  const anyReed = gTiles.some(t => gIsReed(t,false,f));
  if (!anyReed && !S.doomed) {
    S.doomed = true;
    gToast(f==='bab' ? '☠ No reed left anywhere — your civilisation is doomed'
                     : '☠ Assyria has stripped its bank bare — they are doomed', f==='assy'?'assy':undefined);
  } else if (anyReed) S.doomed = false;
}
function gDevelopedCounts() {
  let bab=0, assy=0;
  for (const t of gTiles) {
    const a = gAnchorOf(t);
    if (a) (a.content.f==='bab') ? bab++ : assy++;
  }
  return { bab, assy, total: bab+assy };
}
function gEndGame(winner, reason) {
  if (gOver) return;
  gOver = { winner, reason, year: gYear };
  document.getElementById('verdictTitle').textContent =
    winner==='bab' ? '\u{12000} BABYLON PREVAILS' : '⚑ ASSYRIA PREVAILS';
  document.getElementById('verdictWhy').textContent = `${reason} — year ${gYear}`;
  document.getElementById('verdict').style.display = 'flex';
}
function gCheckVictory() {
  if (gOver) return;
  if (gF.bab.doomed)  return gEndGame('assy', 'Babylon let the last reed die');
  if (gF.assy.doomed) return gEndGame('bab',  'Assyria stripped its bank bare');
  const d = gDevelopedCounts();
  if (d.total >= GAME.VICTORY.MIN_DEVELOPED) {
    if (d.bab/d.total >= GAME.VICTORY.SHARE) gEndGame('bab', `Babylon's footprint covers ${Math.round(100*d.bab/d.total)}% of the world`);
    else if (d.assy/d.total >= GAME.VICTORY.SHARE) gEndGame('assy', `Assyria's footprint covers ${Math.round(100*d.assy/d.total)}% of the world`);
  }
}

// ---------- the mirror god ----------
function gReedTilesOf(f) { return gTiles.filter(t => gIsReed(t,false,f)).length; }
function gAiHome(f) {
  const cx = N >> 1;
  const off = Math.round(N * 0.14);
  const y = f==='assy' ? Math.max(2, canalRows[cx] - off)
                       : Math.min(N-3, canalRows[cx] + canalWidths[cx] - 1 + off);
  return { x: cx, y };
}
function gAiTurn(f) {
  if (gOver) return;
  for (const t of gTiles) {
    if (!gIsBuilding(t, f) || t.content.building==='barracks' || t.content.building==='port') continue;
    if (!gHasTask(t)) continue;
    if (t.content.building==='farm') {
      const wouldHarvest = gTiles.some(tt => gIsReed(tt,true,f) &&
        Math.max(Math.abs(tt.x-t.x),Math.abs(tt.y-t.y))<=GAME.FARM_REACH);
      if (!wouldHarvest || gReedTilesOf(f) > GAME.AI.MIN_KEEP) gDispatch(t, 'work');
      continue;
    }
    const needClay = gTiles.some(tt => gIsScaffold(tt, f) && !tt.content.hasClay);
    const safeHarvest = gReedTilesOf(f) > GAME.AI.MIN_KEEP && gF[f].reed < GAME.AI.REED_CAP;
    if (needClay || safeHarvest) gDispatch(t, 'work');
  }
  const threat = gHasPort(gOther(f)) && gMusterCount(gOther(f)) >= 1;
  let rank = 0;
  for (const t of gTiles) {
    if (!gIsBuilding(t, f) || t.content.building!=='barracks') continue;
    let want;
    if (threat && !gHasPort(f)) want = 'defend';
    else if (threat)            want = (rank % 2 === 0) ? 'defend' : 'muster';
    else if (gHasPort(f))       want = 'muster';
    else                        want = 'work';
    rank++;
    const b = t.content;
    if (b.stance !== want && b.pending !== want && b.lastActed !== gYear) gDispatch(t, want);
  }
  gAiGodAction(f);
}
function gAiFindShapeSpot(f, size, opts = {}) {
  const home = gAiHome(f);
  function search(requireAllWet) {
    let best=null, bestD=Infinity;
    for (const t of gTiles) {
      if (t.terrain==='water' || t.content || gSideOf(t.x,t.y)!==f) continue;

// ---------- world init ----------
function initGameState() {
  gYear = 0; gOver = null; gGroup = 0; handSize = 1;
  // world-size scaling: the proto's floor (30) suited a 30x18 map; here the
  // share win waits until the world is proportionally built-up
  GAME.VICTORY.MIN_DEVELOPED = Math.max(30, Math.round(N * N / 55));
  GAME.WAR.ECON_TRIGGER = Math.max(16, Math.round(N * N / 120));
  document.getElementById('verdict').style.display = 'none';
  gF = {
    bab:  { reed:3, hand:1, maxHand:1, doomed:false },
    assy: { reed:3, hand:1, maxHand:1, doomed:false },
  };
  // terrain: BFS Chebyshev distance from the river, wet band with noisy reach
  const dist = new Int16Array(N*N).fill(999);
  const queue = [];
  for (let i = 0; i < N*N; i++) if (canalMask[i]) { dist[i] = 0; queue.push(i); }
  for (let qi = 0; qi < queue.length; qi++) {
    const i = queue[qi], x = i % N, y = (i / N) | 0;
    if (dist[i] >= 8) continue;
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
      if (!dx && !dy) continue;
      const nx=x+dx, ny=y+dy;
      if (nx<0||nx>=N||ny<0||ny>=N) continue;
      const ni = ny*N+nx;
      if (dist[ni] > dist[i]+1) { dist[ni] = dist[i]+1; queue.push(ni); }
    }
  }
  gTiles = [];
  for (let y=0; y<N; y++) for (let x=0; x<N; x++) {
    const i = y*N+x;
    let terrain;
    if (canalMask[i]) terrain = 'water';
    else {
      const reach = GAME.WET_REACH - 1 + Math.round(hash01(globalSeed, x, y, 0x3E7));
      terrain = dist[i] <= reach ? 'wet' : 'dry';
    }
    gTiles.push({ x, y, terrain, content: null });
  }
  // wild reed: near-mirrored pairs across the channel for a fair start
  const K = Math.max(8, Math.round(N / 4));
  let placed = 0;
  for (let tries=0; tries<K*40 && placed<K; tries++) {
    const x = 2 + Math.floor(hash01(globalSeed, tries, 7, 0x5EED1) * (N-4));
    const d = 1 + Math.floor(hash01(globalSeed, tries, 9, 0x5EED2) * 3);
    const yN = canalRows[x] - d;
    const yS = canalRows[x] + canalWidths[x] - 1 + d;
    const tN = gAt(x, yN), tS = gAt(x, yS);
    if (tN && tS && tN.terrain==='wet' && tS.terrain==='wet' && !tN.content && !tS.content) {
      tN.content = { kind:'reed', f:'assy', mature:true };
      tS.content = { kind:'reed', f:'bab',  mature:true };
      placed++;
    }
  }
}

// project game state into the legacy grid/records (kept systems + dev census)
function gDeriveGrid() {
  grid.fill(0);
  for (const t of gTiles) {
    const a = gAnchorOf(t) || (gIsScaffold(t) ? t : null);
    if (a) grid[t.y * N + t.x] = civIdOf(a.content.f);
  }

}

          const rng = mulberry32(cellSeed);

            // n=0 renders the legacy "lonely tile" palm grove — a placed house
            // is ALWAYS a house, so floor at 1 (density still enriches form)

// ---------- action bubbles (the 2D prototype's floating hints, in 3D) ----------

  for (const t of gTiles) {
    if (!gIsBuilding(t, 'bab') || !gHasTask(t)) continue;
    const b = t.content;
    const icon = b.building === 'barracks' ? '⚔'

    spr.scale.set(0.55, 0.55, 1);

}

  if (previewMesh.instanceColor) previewMesh.instanceColor.needsUpdate = true;
  if (gHover.label) {
    ghostLabelEl.textContent = gHover.label;
    ghostLabelEl.style.display = 'block';
    ghostLabelEl.style.left = gHoverCx + 'px';
    ghostLabelEl.style.top = gHoverCy + 'px';
    ghostLabelEl.style.borderColor = '#' + col.getHexString();
  }
  render();
}
function gHideHover() {
  gHover = null;
  ghostLabelEl.style.display = 'none';
  if (previewMesh && previewMesh.count) { previewMesh.count = 0; render(); }
}

// the war is over — put the tablet down and walk the ruins (camera stays

document.getElementById('verdictDismiss').onclick = () => {

// stance menu: shown when clicking one of your barracks

for (const btn of stanceMenuEl.querySelectorAll('button')) {

function gameClick(tx, ty, clientX, clientY) {
  if (gOver) return;
  gHideStanceMenu();
  const t = gAt(tx, ty);
  if (!t) return;
  const anchor = gAnchorOf(t);
  if (anchor && anchor.content.f === 'bab') {
    if (anchor.content.building === 'barracks') {
      stanceTarget = anchor;
      stanceMenuEl.style.display = 'flex';
      stanceMenuEl.style.left = Math.min(clientX, innerWidth - 240) + 'px';
      stanceMenuEl.style.top = clientY + 'px';
      return;
    }
    if (gDispatch(anchor)) { gDeriveGrid(); gameRebuild(); updateGameHUD(); render(); }
    return;
  }
  if (anchor && anchor.content.f !== 'bab') {
    if (gTryRaid(anchor)) gAdvanceYear();
    return;
  }
  if (anchor) return;
  if (gTryBuildFarm(t, 'bab')) { gAdvanceYear(); return; }
  const r = gGodAction(t, 'bab');
  if (r === 'year') gAdvanceYear();
  else if (r === 'free') { gDeriveGrid(); gameRebuild(); gRefreshHover(); updateGameHUD(); render(); }
}

/* ============================================================================
   GOD MODE (LEGACY, DORMANT) — the player is the automaton. Click to paint
   tiles alive; the generator decides what appears. Verb ladder (see
   GOD_GAME_MODE.md):
     Paint  — always available. Convert desert tiles to city.
     Sculpt — unlocked by the Great Ziggurat (a 10+ monument). Carves the
              accumulated churn/tell sediment back toward the floor, with soft
              falloff — and razes the buildings that made the height (lossy).
   Brush: one global slider, range [1, area of your largest building], 1:1 —
   an N-tile building buys an N-tile brush. Geometry: grow-from-center (the N
   nearest tiles to the click).
   ------------------------------------------------------------------------- */

let verb = 'paint';
let brushSize = 1;
let sculptUnlocked = false;
let timeOn = true;                   // BABYLON 2: the war has a clock; time is on by default
const PAINT_DEPOSIT = 0.02;          // immediate sediment per painted tile vertex

/* -- the live layer: consecrated lifetimes, click-as-turn, scaffolding -------
   Record flags (on the per-tile birth records):
     r.c — consecrated: player paint; the culture rule can't kill it, but it
           expires after r.L generations and crumbles back to open ground.
     r.L — lifetime in generations, size-scaled + seeded jitter.
     r.s — scaffolding: painted this click, completes (loses the flag) on the
           player's next click.
   Vernacular tiles (grown by the culture rule) carry no flags and live/die
   by the rule alone — with the standard scaffold/ruin telegraphs.
   ------------------------------------------------------------------------- */

const LIFE_BASE = 50, LIFE_SCALE = 25, LIFE_JITTER = 0.15;
// √area: monuments stand long but not forever — the player must get to see
// their greatest work fall. Jitter is per-birth + seeded, so a district
// painted in one stroke decays over a window, not as a demolition wave.
function rollLifetime(seed, area = 1) {
  return Math.max(10, Math.round((LIFE_BASE + LIFE_SCALE * Math.sqrt(area))
    * (1 - LIFE_JITTER + 2 * LIFE_JITTER * mulberry32(seed)())));
}

// fraction of lifetime lived, or null for vernacular / unclocked tiles
function senesOf(r) {
  return r && r.c && r.L ? Math.min(1, (generation - r.g) / r.L) : null;
}

// last click's construction completes: scaffolds become buildings
function finishScaffolds() {
  for (const r of records) if (r && r.s) r.s = false;
}

// One landmark, one lifetime, one collapse — but ONLY at the god's hand.
// Called with the tile indices touched by this click: a detected monument
// square containing freshly-painted tiles ADOPTS all its members (vernacular
// squatters who complete a landmark are consecrated into it), syncs them to
// one clock and rolls a single size-scaled lifetime. Squares the sprawl forms
// on its own are never adopted — the world can't consecrate itself, or
// adoption creep spreads immortality across the whole map (verified bug).
function syncMonumentClocks(touched) {
  if (!touched || !touched.size) return;
  for (const z of allZigs(grid).zigs) {
    const members = [];
    let hit = false;
    for (let y = z.y0; y < z.y0 + z.size; y++) for (let x = z.x0; x < z.x0 + z.size; x++) {
      const i = y * N + x;
      if (!records[i]) { members.length = 0; break; }  // shouldn't happen for a detected square
      members.push(records[i]);
      if (touched.has(i)) hit = true;
    }
    if (!members.length || !hit) continue;
    const gmax = Math.max(...members.map(r => r.g));   // youngest member's clock
    const L = rollLifetime(hashSeed(globalSeed, z.x0 ^ Math.imul(gmax + 1, 0x9E37), z.y0, 0x11FE), z.size * z.size);
    for (const r of members) { r.c = true; r.g = gmax; r.L = L; }
  }
}

const verbPaintBtn = document.getElementById('verbPaint');
const verbSculptBtn = document.getElementById('verbSculpt');
const brushEl = document.getElementById('brush');
const brushLabelEl = document.getElementById('brushLabel');
const brushMaxEl = document.getElementById('brushMax');

function setVerbUI(v) {
  verb = v;
  verbPaintBtn.classList.toggle('active', v === 'paint');
  verbSculptBtn.classList.toggle('active', v === 'sculpt');
}
verbPaintBtn.onclick = () => setVerbUI('paint');
verbSculptBtn.onclick = () => { if (sculptUnlocked) setVerbUI('sculpt'); };

// The keystone rule: max brush area = footprint area of the largest structure
// on the map. Single-tile buildings give 1; a size-s monument gives s*s.
function maxBrushArea(f = BABYLON) {
  const zigs = detectZiggurats(grid, f).zigs;
  let s = 1;
  for (const z of zigs) s = Math.max(s, z.size * z.size);
  return Math.min(s, 100);   // cap at the great-ziggurat footprint: no quadratic runaway (playtest #1)
}

function updateBrushUI() {
  const max = maxBrushArea();
  brushEl.max = max;
  if (brushSize > max) brushSize = max;
  brushEl.value = brushSize;
  brushLabelEl.textContent = brushSize;
  brushMaxEl.textContent = max;
}

// The verb ladder, made explicit. Each rung is diegetic — the structure IS
// the tool, and the locked label names what to build next:
//   Paint      — always yours.
//   Brush      — max area = your largest building's footprint (self-enforcing
//                via maxBrushArea; the slider tooltip names the next rung).
//   Sculpt     — unlocked by a Great Ziggurat (10+ footprint). Persists until
//                reset: the knowledge outlives the monument.
function updateUnlocks() {
  if (!sculptUnlocked && detectZiggurats(grid, BABYLON).zigs.some(z => z.size >= 10)) {
    sculptUnlocked = true;               // only YOUR great ziggurat unlocks your hand
  }
  verbSculptBtn.disabled = !sculptUnlocked;
  verbSculptBtn.innerHTML = sculptUnlocked ? '&#9968;&#65039; Sculpt' : '&#9968;&#65039; Sculpt &#128274;';
  verbSculptBtn.title = sculptUnlocked
    ? 'Lowers terrain; destroys the buildings on it'
    : 'Locked: requires a great ziggurat';
  if (!sculptUnlocked && verb === 'sculpt') setVerbUI('paint');
  // brush max hint: what raises it
  const max = maxBrushArea();
  brushEl.title = brushMaxEl.title =
    max < 9 ? 'Build a 3×3 block to increase the maximum brush size'
    : max < 100 ? 'Max brush size equals the area of your largest building'
    : 'Maximum brush size reached';
}

// Grow-from-center: the `count` nearest valid tiles to the clicked tile,
// by distance from the click point — organic rounded blobs, exact area.
// f = which god is reaching. Paint fills open desert or renews that god's own
// aging tiles; it NEVER lands on the rival's ground (all aggression is
// growth, per BABYLON-2.md). Sculpt targets own/empty land only — no smiting
// enemy territory.
function growFromCenter(tx, ty, px, pz, count, forSculpt, f = BABYLON) {
  const cells = [];
  const R = Math.ceil(Math.sqrt(count)) + 2;      // search window comfortably over-covers count
  for (let y = Math.max(0, ty - R); y <= Math.min(N - 1, ty + R); y++) {
    for (let x = Math.max(0, tx - R); x <= Math.min(N - 1, tx + R); x++) {
      const i = y * N + x;
      if (canalOn && canalMask[i]) continue;                 // the river belongs to no one
      if (grid[i] && grid[i] !== f) continue;                // the rival's ground is not yours to touch
      if (!forSculpt) {
        if (grid[i]) {                                       // renew your own aging consecrated tiles…
          const sf = senesOf(records[i]);
          if (sf === null || sf < 0.6) continue;
        } else {                                             // …or claim empty ground within your reach
          if (saltField && saltField[i] > 0) continue;       // never build on scorched earth
          if (timeOn && projectedSupply(f, x, y) <= 0) continue;   // supply-connected only
        }
      }
      const dx = (x + 0.5 - N / 2) - px, dz = (y + 0.5 - N / 2) - pz;
      cells.push({ x, y, d2: dx * dx + dz * dz });
    }
  }
  cells.sort((a, b) => a.d2 - b.d2);
  return cells.slice(0, count);
}

// Lay consecrated tiles for either god — the shared hand behind the player's
// click and the AI's turn. Mutates grid/records/churn; no world step.
function applyPaint(f, cells) {
  if (!cells.length) return false;
  for (const c of cells) grid[c.y * N + c.x] = f;
  records = recordBirths(grid, records, generation);         // newborns roll their form now
  for (const c of cells) {
    const r = records[c.y * N + c.x];
    r.c = true;                                              // consecrated: the rule can't kill it
    r.g = generation;                                        // renewal resets the clock (form kept: restoration)
    r.L = rollLifetime(hashSeed(globalSeed, c.x, c.y, generation ^ 0x11FE));
    if (timeOn) r.s = true;                                  // lands as scaffolding, completes next turn
    for (const v of [HV(c.x, c.y), HV(c.x + 1, c.y), HV(c.x, c.y + 1), HV(c.x + 1, c.y + 1)]) {
      churnDelta[v] = Math.min(CHURN_MAX, churnDelta[v] + PAINT_DEPOSIT);   // immediate sediment deposit
    }
  }
  syncMonumentClocks(new Set(cells.map(c => c.y * N + c.x)));
  return true;
}

/* -- THE RIVAL GOD (Assyria) — scripted priorities, one click per turn, the
   same verbs and the same brush economy. No cheating (mirror principle).
   Priority ladder v1: renew a dying monument member if one is critical,
   otherwise expand from the frontier, biased toward the river (and the
   far bank beyond it). Dumb but symmetrical. -------------------------------- */
function aiTurn() {
  const brush = Math.max(1, Math.min(maxBrushArea(ASSYRIA), 25));  // AI keeps a modest hand
  // 1. renewal: any consecrated Assyrian tile in its last 15%? re-consecrate there.
  for (let i = 0; i < N * N; i++) {
    if (grid[i] !== ASSYRIA) continue;
    const r = records[i], sf = senesOf(r);
    if (sf !== null && sf >= 0.85) {
      const x = i % N, y = (i / N) | 0;
      applyPaint(ASSYRIA, growFromCenter(x, y, x + 0.5 - N / 2, y + 0.5 - N / 2, brush, false, ASSYRIA));
      return;
    }
  }
  // 2. expansion: pick the frontier tile that advances best toward the river
  let best = null, bestScore = -1e9;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (grid[i]) continue;
    if (canalOn && canalMask[i]) continue;
    if (!neighbourCountF(grid, x, y, ASSYRIA)) continue;
    const riverY = canalOn ? canalRows[x] : N / 2;
    const s = -Math.abs(y - riverY) + hash01(globalSeed, x, y, 0xA1D ^ generation) * 8;
    if (s > bestScore) { bestScore = s; best = { x, y }; }
  }
  if (!best) return;
  applyPaint(ASSYRIA, growFromCenter(best.x, best.y,
    best.x + 0.5 - N / 2, best.y + 0.5 - N / 2, brush, false, ASSYRIA));
}

function paintAt(tx, ty, px, pz) {
  const cells = growFromCenter(tx, ty, px, pz, brushSize, false, BABYLON);
  if (!cells.length) return;
  if (timeOn) finishScaffolds();                             // last turn's construction completes
  applyPaint(BABYLON, cells);
  if (timeOn) {
    aiTurn();                                                // the rival god answers
    stepCity();                                              // then the world takes its turn
    updateBrushUI();
    return;
  }
  stampTells(allZigs(grid).zigs);                    // a new monument stamps its platform
  updateGroundHeights();
  updateWalls();
  updateUnlocks();
  updateBrushUI();
  rebuildInstances();
  render();
}

// Lossy undo-terraform. Soft falloff: the click centre goes to the floor, the
// outer ring keeps most of its height. Tiles losing a real fraction of their
// sediment lose their buildings too — the district is spent as raw material.
function sculptAt(tx, ty, px, pz) {
  const cells = growFromCenter(tx, ty, px, pz, brushSize, true);
  if (!cells.length) return;
  const dmax = Math.sqrt(cells[cells.length - 1].d2) + 0.001;
  const vertexCut = new Map();                               // vertex -> strongest cut fraction
  let razed = false;
  for (const c of cells) {
    const f = brushSize === 1 ? 1 : Math.pow(1 - Math.sqrt(c.d2) / dmax, 0.7);   // 1 at centre -> 0 at rim
    for (const v of [HV(c.x, c.y), HV(c.x + 1, c.y), HV(c.x, c.y + 1), HV(c.x + 1, c.y + 1)]) {
      vertexCut.set(v, Math.max(vertexCut.get(v) || 0, f));
    }
    if (f > 0.35 && grid[c.y * N + c.x]) {                   // lossy: the height cost its makers
      grid[c.y * N + c.x] = 0;
      razed = true;
    }
  }
  for (const [v, f] of vertexCut) {                          // carve accumulated sediment only —
    churnDelta[v] *= 1 - f;                                  // never below the natural floor
    tellDelta[v] *= 1 - f;
  }
  if (razed) records = recordBirths(grid, records, generation);
  // sculpt does NOT advance the turn — destruction should be seen, not
  // instantly regrown over by the sprawl (playtest #3)
  if (timeOn) { updateGroundHeights(); updateWalls(); updateBrushUI(); rebuildInstances(); render(); return; }
  updateGroundHeights();
  updateWalls();
  updateBrushUI();
  rebuildInstances();
  render();
}

// Click-to-act: raycast the ground mesh; a press that barely moves is a click,
// a drag stays with OrbitControls.
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
let _downX = 0, _downY = 0, _downTime = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  _downX = e.clientX; _downY = e.clientY; _downTime = performance.now();
});
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - _downX, e.clientY - _downY) > 6) return;   // it was a camera drag
  if (performance.now() - _downTime > 600) return;                       // long-press: not a click
  const r = renderer.domElement.getBoundingClientRect();
  _ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  _ray.setFromCamera(_ndc, camera);
  const hit = gridGround ? _ray.intersectObject(gridGround)[0] : null;
  if (!hit) return;
  const px = hit.point.x, pz = hit.point.z;                 // world coords, grid centred at origin
  const tx = Math.floor(px + N / 2), ty = Math.floor(pz + N / 2);
  if (tx < 0 || tx >= N || ty < 0 || ty >= N) { gHideStanceMenu(); return; }
  gameClick(tx, ty, e.clientX, e.clientY);                  // BABYLON 3: the game's one verb
});

/* ----------------------------------------------------------------------------
   BRUSH PREVIEW — hover highlight of the exact grow-from-center blob the next
   click will touch, so aiming is informed, not hopeful. Paint: cream = fresh
   ground, blue = renewal of an aging consecrated tile. Sculpt: red = falloff
   past the raze threshold (buildings destroyed), amber = height lowered only.
   Flat instanced quads floating just above the terrain; recomputed only when
   the hovered tile / brush / verb / generation changes.
   ------------------------------------------------------------------------- */

const previewGeo = new THREE.PlaneGeometry(1, 1);
previewGeo.rotateX(-Math.PI / 2);
const previewMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.45, depthWrite: false });
let previewMesh = null, previewCap = 0;
let _prevKey = '';
const _cPaint = new THREE.Color(0xfff2c8), _cRenew = new THREE.Color(0x86d7ff),
      _cRaze = new THREE.Color(0xd23b2a), _cLower = new THREE.Color(0xe6a13c);

function ensurePreview(n) {
  if (previewMesh && n <= previewCap) return;
  if (previewMesh) scene.remove(previewMesh);
  previewCap = Math.max(n, 16);
  previewMesh = new THREE.InstancedMesh(previewGeo, previewMat, previewCap);
  previewMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  previewMesh.frustumCulled = false;
  previewMesh.count = 0;
  scene.add(previewMesh);
}

function hidePreview() {
  _prevKey = '';
  if (previewMesh && previewMesh.count) { previewMesh.count = 0; render(); }
}

function showPreview(tx, ty, px, pz) {
  const key = tx + ',' + ty + ',' + brushSize + ',' + verb + ',' + generation;
  if (key === _prevKey) return;                            // nothing changed since last frame
  _prevKey = key;
  const forSculpt = verb === 'sculpt';
  const cells = growFromCenter(tx, ty, px, pz, brushSize, forSculpt);
  if (!cells.length) { hidePreview(); return; }
  ensurePreview(cells.length);
  const dmax = Math.sqrt(cells[cells.length - 1].d2) + 0.001;
  for (let k = 0; k < cells.length; k++) {
    const c = cells[k];
    const t = tileTransform(c.x, c.y);
    composeMatrix(_localMat, t.cx, t.cy + 0.04, t.cz, 0, t.yaw, 0, t.sx, 1, t.sz);
    previewMesh.setMatrixAt(k, _localMat);
    let col;
    if (forSculpt) {                                       // mirrors sculptAt's falloff exactly
      const f = brushSize === 1 ? 1 : Math.pow(1 - Math.sqrt(c.d2) / dmax, 0.7);
      col = f > 0.35 ? _cRaze : _cLower;
    } else {
      col = grid[c.y * N + c.x] ? _cRenew : _cPaint;
    }
    previewMesh.setColorAt(k, col);
  }
  previewMesh.count = cells.length;
  previewMesh.instanceMatrix.needsUpdate = true;
  if (previewMesh.instanceColor) previewMesh.instanceColor.needsUpdate = true;
  render();
}

renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) { gHideHover(); return; }                 // dragging the camera, not aiming
  const r = renderer.domElement.getBoundingClientRect();
  _ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  _ray.setFromCamera(_ndc, camera);
  const hit = gridGround ? _ray.intersectObject(gridGround)[0] : null;
  if (!hit) { gHideHover(); return; }
  const px = hit.point.x, pz = hit.point.z;
  const tx = Math.floor(px + N / 2), ty = Math.floor(pz + N / 2);
  if (tx < 0 || tx >= N || ty < 0 || ty >= N) { gHideHover(); return; }
  gShowHover(tx, ty, e.clientX, e.clientY);                // BABYLON 3: the honest ghost
});
renderer.domElement.addEventListener('pointerleave', () => gHideHover());

/* ----------------------------------------------------------------------------
   SUPPLY OVERLAY — a toggled map tinting each owned tile by its supply: blue
   for Babylon, red for Assyria, brighter = better fed; scorched-earth salt in
   dark grey. The strategy view; the diorama stays clean by default.
   ------------------------------------------------------------------------- */
const overlayGeo = new THREE.PlaneGeometry(1, 1);
overlayGeo.rotateX(-Math.PI / 2);
const overlayMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.55, depthWrite: false, vertexColors: true });
let overlayMesh = null, overlayCap = 0, overlayOn = false;
const _cBab = new THREE.Color(0x3a7bd5), _cAssy = new THREE.Color(0xd23b2a),
      _cSalt = new THREE.Color(0x3a3330), _ovCol = new THREE.Color();

function refreshOverlay() {
  if (!overlayOn) { if (overlayMesh) { overlayMesh.count = 0; } return; }
  const tiles = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (grid[i]) tiles.push(i);
    else if (saltField && saltField[i] > 0) tiles.push(i | 0x40000000);   // flag: salted
  }
  if (!overlayMesh || tiles.length > overlayCap) {
    if (overlayMesh) scene.remove(overlayMesh);
    overlayCap = Math.max(tiles.length, 256);
    overlayMesh = new THREE.InstancedMesh(overlayGeo, overlayMat, overlayCap);
    overlayMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    overlayMesh.frustumCulled = false;
    scene.add(overlayMesh);
  }
  for (let k = 0; k < tiles.length; k++) {
    const salted = tiles[k] & 0x40000000, i = tiles[k] & 0x3FFFFFFF;
    const x = i % N, y = (i / N) | 0;
    const t = tileTransform(x, y);
    composeMatrix(_localMat, t.cx, t.cy + 0.06, t.cz, 0, t.yaw, 0, t.sx, 1, t.sz);
    overlayMesh.setMatrixAt(k, _localMat);
    if (salted) _ovCol.copy(_cSalt);
    else {
      const f = grid[i], sup = supplyOf(f)[i];
      const b = Math.min(1, 0.25 + sup / 18);            // brightness by supply strength
      _ovCol.copy(f === ASSYRIA ? _cAssy : _cBab).multiplyScalar(b);
    }
    overlayMesh.setColorAt(k, _ovCol);
  }
  overlayMesh.count = tiles.length;
  overlayMesh.instanceMatrix.needsUpdate = true;
  if (overlayMesh.instanceColor) overlayMesh.instanceColor.needsUpdate = true;
}

const seedEl = document.getElementById('seed');
const genEl = document.getElementById('gen');
const playBtn = document.getElementById('play');

function updateGenLabel() { genEl.textContent = 'year ' + generation; }

function setSeed(s) {

  seedEl.value = globalSeed;
  resetCity();
}

// Time: the god's own verb. OFF -> ON adopts everything standing as
// consecrated, born NOW (nothing aged while time was stopped). ON -> OFF
// freezes mid-arc — half-bleached stays half-bleached, scaffolds hold, the
// flood stops mid-sweep. State is preserved, never reset.
const timeToggleEl = document.getElementById('timeToggle');
timeToggleEl.onchange = () => {
  timeOn = timeToggleEl.checked;
  if (timeOn) {
    const adopted = new Set();
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      const r = records[i];
      if (!grid[i] || !r) continue;
      r.c = true;
      r.g = generation;
      r.L = rollLifetime(hashSeed(globalSeed, x, y, generation ^ 0xAD07));
      adopted.add(i);
    }
    syncMonumentClocks(adopted);
  }
  rebuildInstances();
  render();
};

// (culture select removed: both nations run the same mirrored sprawl rule)

const gridSizeEl = document.getElementById('gridSize');
gridSizeEl.onchange = () => {                  // grid size change: structural, needs a full reset
  N = Math.max(16, Math.min(256, gridSizeEl.valueAsNumber | 0));
  gridSizeEl.value = N;
  updateCameraFraming();
  resetCity();
};

const buildingCapEl = document.getElementById('buildingCap');
buildingCapEl.onchange = () => {               // cap change only affects LOD selection, no reset needed
  buildingCap = Math.max(1, buildingCapEl.valueAsNumber | 0);
  rebuildInstances();
  render();
};

const canalToggleEl = document.getElementById('canalToggle');
canalToggleEl.onchange = () => {               // river shapes the simulation, so this is a reset
  canalOn = canalToggleEl.checked;
  resetCity();
};

const riverWidthEl = document.getElementById('riverWidth');
riverWidthEl.oninput = () => {                 // live: widen/narrow without resetting the city (baseline under a flow preset)
  riverWidth = riverWidthEl.valueAsNumber | 0;
  if (canalOn) setRiverWidth();
};

const riverFlowEl = document.getElementById('riverFlow');
for (let i = 0; i < RIVER_FLOWS.length; i++) {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = RIVER_FLOWS[i].name;
  riverFlowEl.appendChild(opt);
}
riverFlowEl.onchange = () => {                 // switching flow re-lays the channel for the current generation
  riverFlow = RIVER_FLOWS[+riverFlowEl.value];
  if (canalOn) setRiverWidth();
};

const oceanToggleEl = document.getElementById('oceanToggle');
oceanToggleEl.onchange = () => {               // scenery swap; on the island it also (un)dresses the tidal reeds
  oceanOn = oceanToggleEl.checked;
  applyOcean();
  if (circularIsland) rebuildInstances();      // spawn/clear the foreshore reeds
  render();
};

const circularToggleEl = document.getElementById('circularToggle');
circularToggleEl.onchange = () => {            // layout change: needs full rebuild
  circularIsland = circularToggleEl.checked;
  resetCity();
};

document.getElementById('step').onclick = () => gAdvanceYear();   // BABYLON 3
// Wait: play out N years, animated (~7/sec) so the god can watch the city
// live. Clicking again mid-wait stops it.
const waitBtn = document.getElementById('wait');
let waitTimer = null, waitLeft = 0;
function stopWait() {
  if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
  waitBtn.innerHTML = '&#8987; Wait';
}
waitBtn.onclick = () => {
  if (gOver) return;
  if (waitTimer) { stopWait(); return; }               // second click cancels
  waitLeft = Math.max(1, Math.min(100, document.getElementById('waitYears').valueAsNumber | 0));
  waitTimer = setInterval(() => {
    gAdvanceYear();                                // BABYLON 3: years pass, Assyria acts
    waitBtn.textContent = '⏳ ' + --waitLeft;      // countdown on the button
    if (waitLeft <= 0 || gOver) stopWait();
  }, 220);
};
document.getElementById('reset').onclick = () => {     // Anew: back to the tablet
  stopPlay();
  landingEl.classList.remove('gone');
};
document.getElementById('supplyBtn').onclick = (e) => {  // strategy supply map
  overlayOn = !overlayOn;
  e.currentTarget.classList.toggle('active', overlayOn);
  refreshOverlay();
  render();
};
// THE TABLET — world settings are chosen here and locked in by Begin. The
// landing stays in the DOM: "Anew" wipes the world and returns to it. The old
// in-game world panel remains in the code (hidden) for dev use.
const landingEl = document.getElementById('landing');
const setupSeedEl = document.getElementById('setupSeed');
document.getElementById('setupRandom').onclick = () => {
  setupSeedEl.value = Math.floor(Math.random() * 1e6);
};
const setupFlowEl = document.getElementById('setupFlow');
for (let i = 0; i < RIVER_FLOWS.length; i++) {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = RIVER_FLOWS[i].name;
  setupFlowEl.appendChild(opt);
}
setupFlowEl.value = 1;                       // Seasonal: the river breathes by default
document.getElementById('begin').onclick = () => {
  // carve the chosen settings into the world (mirrored into the hidden dev
  // panel controls so their state stays consistent)
  globalSeed = setupSeedEl.valueAsNumber | 0;
  seedEl.value = globalSeed;
  N = Math.max(16, Math.min(256, +document.getElementById('setupSize').value));
  gridSizeEl.value = N;
  canalOn = true;                            // BABYLON 3: the river IS the game
  canalToggleEl.checked = true;
  riverFlow = RIVER_FLOWS[+setupFlowEl.value];
  riverFlowEl.value = setupFlowEl.value;     // keep the hidden dev panel consistent
  oceanOn = document.getElementById('setupOcean').checked;
  oceanToggleEl.checked = oceanOn;
  circularIsland = document.getElementById('setupIsland').checked;
  circularToggleEl.checked = circularIsland;
  updateCameraFraming();
  resetCity();
  resize();
  timeOn = true;                           // the war always has a clock
  timeToggleEl.checked = true;
  landingEl.classList.add('gone');
};

let playTimer = null;
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; playBtn.innerHTML = '&#9654;'; playBtn.title = 'Advance time automatically'; }
}
function startPlay() {
  stopPlay();
  playTimer = setInterval(stepCity, 1000 / parseFloat(speedEl.value));
  playBtn.innerHTML = '&#10074;&#10074;';
  playBtn.title = 'Pause';
}
playBtn.onclick = () => (playTimer ? stopPlay() : startPlay());
const speedEl = document.getElementById('speed');
speedEl.onchange = () => { if (playTimer) startPlay(); };

/* ----------------------------------------------------------------------------
   POST-PROCESSING — tilt-shift miniature look. A horizontal focus band across
   the screen centre stays sharp; blur ramps in above and below it, which is
   what sells the city as a hand-built diorama. Two cheap separable passes
   (H + V); phones skip the composer entirely and render direct.
   ------------------------------------------------------------------------- */
let composer = null, tiltH = null, tiltV = null;
let TILT_FOCUS = 0.48;               // focus band centre, 0..1 up the screen (city sits just below middle)
let TILT_BLUR = 2.2;                 // blur strength in pixels at the screen edge
if (!isPhone) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  tiltH = new ShaderPass(HorizontalTiltShiftShader);
  tiltV = new ShaderPass(VerticalTiltShiftShader);
  tiltH.uniforms.r.value = tiltV.uniforms.r.value = TILT_FOCUS;
  composer.addPass(tiltH);
  composer.addPass(tiltV);
}

function render() {
  if (composer) composer.render();
  else renderer.render(scene, camera);
}
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const pr = Math.min(devicePixelRatio, isPhone ? 1.5 : 2);
  renderer.setSize(w, h);
  renderer.setPixelRatio(pr);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (composer) {
    composer.setSize(w, h);
    composer.setPixelRatio(pr);
    tiltH.uniforms.h.value = TILT_BLUR / (w * pr);   // separable blur step, in UV units
    tiltV.uniforms.v.value = TILT_BLUR / (h * pr);
  }
  render();
}

// Ambient animation: the water must move even while the god is thinking, so
// desktop trades render-on-demand for a continuous loop (~1ms/frame — cheap).
// Phones keep on-demand rendering and static water to save battery.
if (!isPhone) {
  (function ambient() {
    requestAnimationFrame(ambient);
    if (document.hidden) return;                     // tab in background: skip work
    waterTime.value = performance.now() / 1000;
    render();
  })();
}
addEventListener('resize', resize);

// Phones: lighten the defaults (smaller grid + fewer full-detail buildings) so
// it stays smooth on mobile GPUs. (isPhone is declared at renderer setup —
// shadows and post-processing key off it too.)
if (isPhone) {
  N = 40;
  buildingCap = 900;
}

globalSeed = seedEl.valueAsNumber | 0;
gridSizeEl.value = N;
buildingCapEl.value = buildingCap;
updateCameraFraming();
resetCity();
resize();

// dev hook for headless sanity checks (harmless in production)
window.__city = {
  // ---- BABYLON 3 game surface (mirrors prototype-2d's __proto) ----
  game: {
    get year() { return gYear; },
    get F() { return gF; },
    get gameOver() { return gOver; },
    tiles: () => gTiles,
    tileAt: gAt, sideOf: gSideOf, developedCounts: gDevelopedCounts,
    counts() {
      const c = { year: gYear, developed: gDevelopedCounts() };
      for (const f of ['bab','assy']) {
        c[f] = {
          reed: gF[f].reed, hand: gF[f].hand, maxHand: gF[f].maxHand, doomed: gF[f].doomed,
          buildings: {}, reedTiles: gTiles.filter(t=>gIsReed(t,false,f)).length,
          matureReed: gTiles.filter(t=>gIsReed(t,true,f)).length,
          scaffolds: gTiles.filter(t=>gIsScaffold(t,f)).length,
        };
        for (const t of gTiles) if (gIsBuilding(t,f))
          c[f].buildings[t.content.building] = (c[f].buildings[t.content.building]||0)+1;
      }
      return c;
    },
    clickTile: (x,y) => gameClick(x, y, innerWidth/2, innerHeight/2),
    stance: (x,y,want) => { const a = gAnchorOf(gAt(x,y)); if (a) { gDispatch(a, want); gDeriveGrid(); gameRebuild(); updateGameHUD(); render(); } },
    hoverAt: (x,y) => { gShowHover(x, y, innerWidth/2, innerHeight/2); return gHover; },
    setHand: (n) => { handSize = Math.max(1, Math.min(n, gF.bab.maxHand)); gF.bab.hand = handSize; updateGameHUD(); },
    wait: () => gAdvanceYear(),
    botYear: () => { if (!gOver) { gAiTurn('bab'); gAdvanceYear(); } },
    war: { hasPort: gHasPort, barracksCount: gBarracksCount, musterCount: gMusterCount, warReady: gWarReady, defendersNear: gDefendersNear },
    tryPlaceShape: gTryPlaceShape, shapeBuilding: gShapeBuilding,
    bubbles: () => bubbleSprites.length,
    GAME,
    reset: () => resetCity(),
  },
  // god-mode surface
  paintAt: (tx, ty) => paintAt(tx, ty, tx + 0.5 - N / 2, ty + 0.5 - N / 2),
  sculptAt: (tx, ty) => sculptAt(tx, ty, tx + 0.5 - N / 2, ty + 0.5 - N / 2),
  setBrush: (n) => { brushSize = Math.max(1, n | 0); updateBrushUI(); },
  setVerb: (v) => setVerbUI(v),
  brush: () => ({ size: brushSize, max: maxBrushArea(), verb, sculptUnlocked }),
  forceUnlock: () => { sculptUnlocked = true; updateUnlocks(); },
  setTime: (on) => { timeToggleEl.checked = !!on; timeToggleEl.onchange(); },
  preview: (tx, ty) => { showPreview(tx, ty, tx + 0.5 - N / 2, ty + 0.5 - N / 2); return previewMesh ? previewMesh.count : 0; },
  hidePreview,
  tilt: (focus, blur) => {           // live-tune the miniature look: focus 0..1, blur px
    if (!composer) return 'no composer (phone path)';
    if (focus !== undefined) TILT_FOCUS = focus;
    if (blur !== undefined) TILT_BLUR = blur;
    tiltH.uniforms.r.value = tiltV.uniforms.r.value = TILT_FOCUS;
    resize();                        // recomputes the blur-step uniforms and renders
    return { focus: TILT_FOCUS, blur: TILT_BLUR };
  },
  shadows: (on) => {                 // toggle for perf comparison
    renderer.shadowMap.enabled = !!on;
    sun.castShadow = !!on;
    MATS.sand.needsUpdate = true;    // force material recompile
    render();
    return renderer.shadowMap.enabled;
  },
  time: () => timeOn,
  aiTurn,                                    // let tests drive the rival god directly
  supplyAt: (x, y) => ({ bab: +supplyB[y * N + x].toFixed(1), assy: +supplyA[y * N + x].toFixed(1), salt: saltField[y * N + x] }),
  supplyStats: () => {
    let bMax = 0, aMax = 0, salted = 0;
    for (let i = 0; i < N * N; i++) { if (supplyB[i] > bMax) bMax = supplyB[i]; if (supplyA[i] > aMax) aMax = supplyA[i]; if (saltField[i] > 0) salted++; }
    return { babMax: +bMax.toFixed(1), assyMax: +aMax.toFixed(1), saltedTiles: salted };
  },
  toggleSupply: () => { overlayOn = !overlayOn; refreshOverlay(); render(); return overlayOn; },
  recordAt: (x, y) => { const r = records[y * N + x]; return r && { ...r, senes: senesOf(r) }; },
  census: () => {                       // per-nation + consecrated/vernacular counts
    const t = { babylon: 0, assyria: 0, babC: 0, assyC: 0, scaffolding: 0 };
    for (let i = 0; i < N * N; i++) {
      const f = grid[i];
      if (!f) continue;
      const r = records[i];
      if (f === BABYLON) { t.babylon++; if (r && r.c) t.babC++; }
      else { t.assyria++; if (r && r.c) t.assyC++; }
      if (r && r.s) t.scaffolding++;
    }
    return t;
  },
  churn: () => {
    let max = 0, sum = 0;
    for (let v = 0; v < churnDelta.length; v++) { if (churnDelta[v] > max) max = churnDelta[v]; sum += churnDelta[v]; }
    return { max: +max.toFixed(3), sum: +sum.toFixed(1) };
  },
  generateBuilding,
  alive: () => grid.reduce((a, b) => a + b, 0),
  gen: () => generation,
  zigs: () => allZigs(grid).zigs.length,
  templeZig: () => templeZig && { ...templeZig },   // footprint of the special (tallest) ziggurat
  bucketCount: () => buckets.size,
  activeBucketKeys: () => [...buckets.entries()].filter(([, b]) => b.mesh.count > 0).map(([k]) => k),
  bucketCounts: () => Object.fromEntries([...buckets.entries()].filter(([, b]) => b.mesh.count > 0).map(([k, b]) => [k, b.mesh.count])),
  activeBuckets: () => { let c = 0; for (const b of buckets.values()) if (b.mesh.count > 0) c++; return c; },
  instanceTotal: () => { let n = 0; for (const b of buckets.values()) n += b.mesh.count; return n; },
  drawCalls: () => renderer.info.render.calls,
  stepTiming: () => { const t0 = performance.now(); stepCity(); return performance.now() - t0; },
  gridN: () => N,
  cap: () => buildingCap,
  walls: () => wallProjects.map(p => ({ ...p.rect, built: p.built, total: p.queue.length, grand: p.grand })),
  wallRuinCount: () => wallRuins.size,
  canalCells: () => canalMask.reduce((a, b) => a + b, 0),
  canalSpan: (x) => [canalRows[x], canalRows[x] + canalWidths[x] - 1],   // [top, bottom] at column x
  riverFlow: () => riverFlow.name,
  tileTransform,
  terrainHeight,
  floodDistAt: (x, y) => floodDist[y * N + x],
  terrain: () => {
    let min = 1e9, max = -1e9, tellMax = 0, tellSum = 0, erosionMax = 0, erosionSum = 0;
    for (let v = 0; v < heightField.length; v++) {
      const h = Math.max(CHANNEL_BED, heightField[v] + tellDelta[v] - erosionDelta[v]);
      if (h < min) min = h; if (h > max) max = h;
      if (tellDelta[v] > tellMax) tellMax = tellDelta[v];
      tellSum += tellDelta[v];
      if (erosionDelta[v] > erosionMax) erosionMax = erosionDelta[v];
      erosionSum += erosionDelta[v];
    }
    return {
      min: +min.toFixed(2), max: +max.toFixed(2),
      tellMax: +tellMax.toFixed(2), tellSum: +tellSum.toFixed(1),
      erosionMax: +erosionMax.toFixed(3), erosionSum: +erosionSum.toFixed(1),
      waterLevel: WATER_LEVEL, channelBed: CHANNEL_BED,
    };
  },
};
</script>
</body>
</html>
