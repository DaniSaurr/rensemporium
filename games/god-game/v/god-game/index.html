  // tilt so fused quarters stay coherent; lone huts lean into the slope).
  const h00 = terrainHeight(x, y), h10 = terrainHeight(x + 1, y),
        h01 = terrainHeight(x, y + 1), h11 = terrainHeight(x + 1, y + 1);
  const cy = (h00 + h10 + h01 + h11) / 4;
  const slopeX = ((h10 + h11) - (h00 + h01)) / 2 / sx;   // rise toward +x
  const slopeZ = ((h01 + h11) - (h00 + h10)) / 2 / sz;   // rise toward +z
  const tx = -Math.atan(slopeZ), tz = Math.atan(slopeX);
  return { cx, cy, cz, yaw: -yaw, sx, sz, tx, tz };
}

/* ============================================================================
   RENDER LAYER — Three.js, render-on-demand (no continuous loop).
   ------------------------------------------------------------------------- */

const MATS = {
  sand:       new THREE.MeshStandardMaterial({ color: 0xd9c197, roughness: 0.95 }),
  sandLight:  new THREE.MeshStandardMaterial({ color: 0xe9d8b0, roughness: 0.95 }),
  sandDark:   new THREE.MeshStandardMaterial({ color: 0xb99e6f, roughness: 0.95 }),
  window:     new THREE.MeshBasicMaterial({ color: 0x2a2018 }),   // unlit: flat constant dark, reads as a void not a lit block
  wood:       new THREE.MeshStandardMaterial({ color: 0x7a5a38, roughness: 0.9 }),
  cloth:      new THREE.MeshStandardMaterial({ color: 0x6b4a3a, roughness: 1.0, side: THREE.DoubleSide }),
  clothRed:   new THREE.MeshStandardMaterial({ color: 0xbe4a35, roughness: 1.0, side: THREE.DoubleSide }),
  clothPlum:  new THREE.MeshStandardMaterial({ color: 0x99506e, roughness: 1.0, side: THREE.DoubleSide }),
  clothOchre: new THREE.MeshStandardMaterial({ color: 0xcf9a44, roughness: 1.0, side: THREE.DoubleSide }),
  lapis:      new THREE.MeshStandardMaterial({ color: 0x1f4e9c, roughness: 0.35, metalness: 0.15 }),
  gold:       new THREE.MeshStandardMaterial({ color: 0xd4a437, roughness: 0.3, metalness: 0.6 }),
  palm:       new THREE.MeshStandardMaterial({ color: 0x4e7a34, roughness: 0.9 }),
  // reserved for the single tallest ziggurat in the city (see rebuildInstances)
  bitumen:    new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 0.85, metalness: 0.05 }),
  skyBlue:    new THREE.MeshStandardMaterial({ color: 0x6bb8d6, roughness: 0.4, metalness: 0.05 }),
  orange:     new THREE.MeshStandardMaterial({ color: 0xdb7b2e, roughness: 0.55, metalness: 0.05 }),
};

const GEOS = {
  box:      new THREE.BoxGeometry(1, 1, 1),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 8),
  cone:     new THREE.CylinderGeometry(0.06, 0.5, 1, 7),
  sphere:   new THREE.SphereGeometry(0.5, 8, 6),
  arch:     new THREE.TorusGeometry(0.5, 0.1, 8, 12, Math.PI),
};

/* ============================================================================
   CANAL — a seeded meandering river (the Euphrates) crossing the grid west to
   east, two tiles wide. Canal cells are forced dead in the automaton, so the
   city grows along its banks. Tiles near the river form a green floodplain
   with palms and reeds. Both ends are faked out to the horizon.
   ------------------------------------------------------------------------- */

let canalOn = true;
let oceanOn = false;
let canalMask = null;               // Uint8Array N*N, 1 = water
let floodDist = null;               // Uint8Array N*N, Chebyshev distance to water (255 = far)
let canalRows = null;               // per column x: upper row of the channel
let canalWidths = null;             // per column x: channel width in cells (varies under a flow preset)
let riverWidth = 1;                 // channel width in cells, user-controllable (baseline under a flow preset)

// River flow presets — every active one is a TRAVELLING wave. Each defines a
// waveform `wave(g)` in [0,1] over (fractional) generation g, and `travel`, the
// number of generations the wave takes to cross the river. buildCanal() samples
// it per column at a time lag of x/N * travel, so the waveform sweeps DOWN the
// channel (west -> east) instead of the whole river pulsing in unison — the
// "traveling crest" read, generalised. At any instant width varies smoothly
// along X; over generations the pattern drifts downstream.
//
// riverWidth is the MINIMUM (the wave only ever adds width on top, up to
// FLOW_AMP); buildCanal() also floors at riverWidth and caps at 6, so the floor
// is a hard guarantee. Manual disables modulation entirely (wave: null).
const FLOW_AMP = 3;
const wrapPhase = (g, period) => (((g % period) + period) % period) / period;   // 0..1, safe for negative g
const RIVER_FLOWS = [
  { name: 'Manual', wave: null, travel: 0 },
  { name: 'Seasonal', travel: 113, wave: g =>              // a gentle swell drifting downstream (~one wavelength spans the river)
      0.5 + 0.5 * Math.sin(g / 18) },
  { name: 'Annual flood', travel: 60, wave: g => {         // slow rise, sharp crest, long recede — the flood sweeps down the valley
      const period = 60, riseLen = period * 0.4;
      const t = ((g % period) + period) % period;
      const s = t < riseLen ? t / riseLen : 1 - (t - riseLen) / (period - riseLen);
      return Math.pow(Math.max(0, s), 2.2);
    } },
  { name: 'Traveling crest', travel: 80, wave: g => {      // a narrow flood pulse sweeping downstream (~5-cell crest)
      const p = wrapPhase(g, 80);
      return Math.exp(-((p - 0.5) ** 2) / (2 * 0.08 ** 2));
    } },
  { name: 'Drought / steady', travel: 0, wave: () => 0 },  // flat at the minimum, for contrast
];
let riverFlow = RIVER_FLOWS[0];

function buildCanal() {
  canalMask = new Uint8Array(N * N);
  floodDist = new Uint8Array(N * N).fill(255);
  canalRows = new Int16Array(N);
  canalWidths = new Int16Array(N);
  if (!canalOn) return;
  // per-column width: sample the travelling waveform at this column's time lag
  // so the swell sweeps downstream rather than the whole river changing at once.
  const widthAt = riverFlow.wave
    ? (x) => riverWidth + riverFlow.wave(generation - (x / N) * riverFlow.travel) * FLOW_AMP
    : () => riverWidth;
  let c = Math.round(N / 2 + (hash01(globalSeed, 0, 0, 0x41C4E) - 0.5) * N * 0.3);   // centre line (width-independent)
  for (let x = 0; x < N; x++) {
    const w = Math.max(riverWidth, Math.min(6, Math.round(widthAt(x))));   // riverWidth is the floor, never subtracted below
    const half = Math.floor(w / 2);                 // channel grows symmetrically around the centre
    const drift = Math.floor(hash01(globalSeed, x, 1, 0x717E5) * 3) - 1;
    c = Math.max(1 + half, Math.min(N - 1 - w + half, c + drift));
    const top = c - half;                         // channel occupies rows [top, top + w - 1]
    canalRows[x] = top;
    canalWidths[x] = w;
    for (let k = 0; k < w; k++) canalMask[(top + k) * N + x] = 1;
  }
  // floodplain distance: stamp a radius-2 neighbourhood around every water cell
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!canalMask[y * N + x]) continue;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= N || ny < 0 || ny >= N) continue;
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      const i = ny * N + nx;
      if (d < floodDist[i]) floodDist[i] = d;
    }
  }
}

// The river is older than the city: its cells are always dead. Applied after
// seeding and after every automaton step (including the lookahead, so the
// telegraphing stays consistent).
function applyCanal(g) {
  if (!canalOn) return g;
  for (let i = 0; i < g.length; i++) if (canalMask[i]) g[i] = 0;
  return g;
}

// GOD MODE step. Time OFF: frozen diorama — the grid only changes through
// player input and the river; stepping just re-applies the canal.
// Time ON: the vernacular takes its turn under the selected culture (preset
// rule), but CONSECRATED tiles (player paint) can't be killed by the rule —
// they stand until their lifetime expires, then crumble to open ground the
// rule (or the brush) can reclaim. Pure in (g, gen): safe for the lookahead,
// so expiry telegraphs as a ruin one turn ahead like any other death.
function stepSim(g, gen) {
  if (!timeOn) return applyCanal(g.slice());
  const next = preset.step(g, gen);
  for (let i = 0; i < g.length; i++) {
    const r = records && records[i];
    if (g[i] && r && r.c) next[i] = (gen + 1 - r.g >= r.L) ? 0 : 1;
  }
  return applyCanal(next);
}

/* ============================================================================
   TERRAIN — a third procedural layer alongside the automaton and the
   architecture (see terrain-plan.md). Three buffers over the (N+1)^2 lattice:

   - heightField: immutable, seeded value-noise (hills + undulation +
     roughness), gentle amplitude so the RTS diorama read survives. The canal
     is carved down into it below WATER_LEVEL, so the river sits in a real
     valley and fertility = "low ground near water" for free.
   - tellDelta: persistent and monotonically increasing. Only ziggurats stamp
     it (flatten their footprint up to the local high point, with a terraced
     skirt). Because it never decreases, a ziggurat's platform outlives the
     ziggurat itself — the city slowly grows mounds where monuments stood,
     like real Mesopotamian tells.
   - erosionDelta: persistent and monotonically increasing, subtracted rather
     than added. The riverbank loses a little sediment each generation, the
     same "only ever accumulates" persistence as tellDelta, just the other
     direction. Floored at CHANNEL_BED — the river's own carved bed — so a
     bank can settle down to meet the water but never erode past it.

   Rendered terrain = heightField + tellDelta - erosionDelta, floored at CHANNEL_BED.
   ------------------------------------------------------------------------- */

let heightField = null;             // Float32Array (N+1)^2 — immutable base elevation
let tellDelta = null;               // Float32Array (N+1)^2 — persistent monument mounds
let erosionDelta = null;            // Float32Array (N+1)^2 — persistent bank sediment loss
let churnDelta = null;              // Float32Array (N+1)^2 — GOD MODE: sediment accreted by building churn; the sculpt verb carves it back down
const WATER_LEVEL = -0.18;          // one flat water plane; land is generally >= 0
const CHANNEL_BED = WATER_LEVEL - 0.12;   // the canal's own carved depth; erosion never digs past it

const HV = (i, j) => j * (N + 1) + i;
const terrainHeight = (i, j) =>
  Math.max(CHANNEL_BED, heightField[HV(i, j)] + tellDelta[HV(i, j)] + (churnDelta ? churnDelta[HV(i, j)] : 0) - erosionDelta[HV(i, j)]);

// GOD MODE churn sediment: every generation an occupied tile deposits a little
// height on its 4 corner vertices — the slow layer under the fast building
// layer. Long-lived dense districts literally become high ground.
const CHURN_RATE = 0.008;           // per occupied tile, per generation, per vertex
const CHURN_MAX = 2.2;              // cap so ancient quarters plateau instead of spiking
function stampChurn() {
  let changed = false;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!grid[y * N + x]) continue;
    for (const v of [HV(x, y), HV(x + 1, y), HV(x, y + 1), HV(x + 1, y + 1)]) {
      if (churnDelta[v] < CHURN_MAX) { churnDelta[v] = Math.min(CHURN_MAX, churnDelta[v] + CHURN_RATE); changed = true; }
    }
  }
  return changed;
}

// seeded value noise in [0,1]: smooth interpolation of hashed lattice values
function valueNoise(i, j, wavelength, salt) {
  const gx = i / wavelength, gy = j / wavelength;
  const x0 = Math.floor(gx), y0 = Math.floor(gy);
  const fx = gx - x0, fy = gy - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const v00 = hash01(globalSeed, x0, y0, salt), v10 = hash01(globalSeed, x0 + 1, y0, salt);
  const v01 = hash01(globalSeed, x0, y0 + 1, salt), v11 = hash01(globalSeed, x0 + 1, y0 + 1, salt);
  return (v00 * (1 - sx) + v10 * sx) * (1 - sy) + (v01 * (1 - sx) + v11 * sx) * sy;
}

function buildHeightField() {
  heightField = new Float32Array((N + 1) * (N + 1));
  // keep accumulated tells and erosion across a re-carve (river-width change);
  // resetCity clears them by nulling both first for a fresh city.
  if (!tellDelta || tellDelta.length !== (N + 1) * (N + 1)) tellDelta = new Float32Array((N + 1) * (N + 1));
  if (!erosionDelta || erosionDelta.length !== (N + 1) * (N + 1)) erosionDelta = new Float32Array((N + 1) * (N + 1));
  if (!churnDelta || churnDelta.length !== (N + 1) * (N + 1)) churnDelta = new Float32Array((N + 1) * (N + 1));
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    // three octaves: major landforms, medium undulation, fine roughness
    let h = (valueNoise(i, j, N / 2.5, 0x411) - 0.5) * 1.3
          + (valueNoise(i, j, N / 8, 0x412) - 0.5) * 0.4
          + (valueNoise(i, j, 2.3, 0x413) - 0.5) * 0.08;
    h = Math.max(0, h + 0.45);      // bias above the water table; clipped lows read as desert flats
    // fade to 0 at the grid rim so the city plateau meets the outer desert cleanly
    const rim = Math.min(i, j, N - i, N - j) / 5;
    h *= rim >= 1 ? 1 : rim * rim * (3 - 2 * rim);
    // carve the canal valley: bed below water, banks stepping up from it
    const d = vertexFloodDist(i, j);
    if (d === 0) h = CHANNEL_BED;
    else if (d === 1) h = Math.min(h, WATER_LEVEL + 0.06);
    else if (d === 2) h = Math.min(h, WATER_LEVEL + 0.3);
    heightField[HV(i, j)] = h;
  }
}

// Ziggurats flatten their footprint up to its local high point (a level
// platform), with a half-height terraced skirt one vertex out. tellDelta only
// ever increases, so the platform persists as a tell after the ziggurat dies.
function stampTells(zigs) {
  let changed = false;
  for (const z of zigs) {
    const i0 = z.x0, j0 = z.y0, i1 = z.x0 + z.size, j1 = z.y0 + z.size;
    let plateau = -Infinity;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++)
      plateau = Math.max(plateau, terrainHeight(i, j));
    // GOD MODE: the plateau is measured off full terrain (incl. churn), so the
    // stamped delta must subtract churn too — otherwise tell absorbs churn and
    // the plateau feeds back on itself, climbing every generation.
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const need = plateau - heightField[HV(i, j)] - churnDelta[HV(i, j)];
      if (need > tellDelta[HV(i, j)] + 1e-4) { tellDelta[HV(i, j)] = need; changed = true; }
    }
    for (let j = j0 - 1; j <= j1 + 1; j++) for (let i = i0 - 1; i <= i1 + 1; i++) {
      if (i >= i0 && i <= i1 && j >= j0 && j <= j1) continue;
      if (i < 0 || i > N || j < 0 || j > N) continue;
      const need = (plateau - heightField[HV(i, j)] - churnDelta[HV(i, j)]) * 0.5;
      if (need > tellDelta[HV(i, j)] + 1e-4) { tellDelta[HV(i, j)] = need; changed = true; }
    }
  }
  return changed;
}

// River erosion: the immediate bank (1-2 cells out) loses a little sediment
// each generation — small, so it reads as settling rather than carving.
// erosionDelta only ever grows, and terrainHeight() floors at CHANNEL_BED, so
// a bank can sink down to meet the river but the river's own bed — its
// current position — stays the lowest point either way.
const EROSION_RATE = 0.0015;        // per generation, at the immediate bank
function stampErosion() {
  if (!canalOn) return false;
  let changed = false;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const d = vertexFloodDist(i, j);
    if (d < 1 || d > 2) continue;             // only the banks erode; the bed is already at the floor
    const v = HV(i, j);
    const room = (heightField[v] + tellDelta[v] - erosionDelta[v]) - CHANNEL_BED;
    if (room <= 0) continue;                  // already settled to the floor
    erosionDelta[v] += Math.min(room, EROSION_RATE / d);   // farther bank erodes slower
    changed = true;
  }
  return changed;
}

/* ============================================================================
   INSTANCING — one InstancedMesh per (shape, material) pair ("bucket"), shared
   across every tile and ziggurat in the city, instead of a mesh tree per
   building. The generator already emits primitive instruction lists rather
   than direct meshes, so this is the mechanical swap the spec called for:
   thousands of individual meshes/draw-calls collapse into a few dozen.
   Capacity grows with headroom (1.5x) so it rarely needs to reallocate.
   ------------------------------------------------------------------------- */

class InstancedBucket {
  constructor(shape, matKey) {
    this.shape = shape;
    this.matKey = matKey;
    this.capacity = 0;
    this.mesh = null;
  }
  ensureCapacity(n) {
    if (this.mesh && n <= this.capacity) return;
    const newCap = Math.max(n, Math.ceil((this.capacity || 8) * 1.5), 16);
    const mesh = new THREE.InstancedMesh(GEOS[this.shape], MATS[this.matKey] || MATS.sand, newCap);
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.frustumCulled = false;         // instances span the whole city; culling the bucket wastes nothing
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    if (this.mesh) scene.remove(this.mesh);
    this.mesh = mesh;
    this.capacity = newCap;
    scene.add(this.mesh);
  }
}

const buckets = new Map();              // "shape:matKey" -> InstancedBucket
function getBucket(shape, matKey) {
  const key = shape + ':' + matKey;
  let b = buckets.get(key);
  if (!b) { b = new InstancedBucket(shape, matKey); buckets.set(key, b); }
  return b;
}

// scratch objects reused every instance to avoid per-call allocation
const _pos = new THREE.Vector3(), _euler = new THREE.Euler(), _quat = new THREE.Quaternion(), _scl = new THREE.Vector3();
function composeMatrix(out, px, py, pz, rx, ry, rz, sx, sy, sz) {
  _pos.set(px, py, pz);
  _euler.set(rx, ry, rz);
  _quat.setFromEuler(_euler);
  _scl.set(sx, sy, sz);
  return out.compose(_pos, _quat, _scl);
}

const wrap = document.getElementById('canvas-wrap');
// phones get the lightweight path: no shadows, no post-processing
const isPhone = matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 820;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = !isPhone;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9dc4e6);   // daytime sky blue
scene.fog = new THREE.Fog(0xe4d4b4, 1, 1);      // warm sandy haze at the horizon

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.addEventListener('change', render);

const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.castShadow = !isPhone;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;          // instanced boxes: pushes samples off the surface, kills acne
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0xc7a86e, 0.9));

// Camera/fog/shadow framing scales with grid size N — called on load and
// whenever the user changes the grid size.
function updateCameraFraming() {
  scene.fog.near = N * 2.2;
  scene.fog.far = N * 5;
  camera.far = N * 12;
  camera.position.set(0, N * 0.94, N * 1.06);
  camera.updateProjectionMatrix();
  controls.update();                 // reorient the camera to look at the target (else it faces default -Z)
  sun.position.set(N * 0.75, N * 1.12, N * 0.5);
  // shadow frustum hugs the grid (plus a margin for tall monuments at the rim)
  const s = N * 0.75;
  sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
  sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = N * 4;
  sun.shadow.camera.updateProjectionMatrix();
}

// beyond the grid: endless desert, or (ocean mode) endless sea with a sandy shore
const desertMaterial = new THREE.MeshStandardMaterial({ color: 0xdcc396, roughness: 1 });
// polygonOffset pushes the sea plane slightly back in depth so the tidal
// foreshore reliably wins the thin band where they cross at the shoreline —
// no coin-flip depth ties to shimmer as the camera moves.
const seaMaterial = new THREE.MeshStandardMaterial({ color: 0x3a7ba8, roughness: 0.3, metalness: 0.1,
  polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
const outerGroundY = () => oceanOn ? WATER_LEVEL - 0.1 : WATER_LEVEL - 0.07;   // below water so it's never occluding
const outerGround = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), desertMaterial);
outerGround.rotation.x = -Math.PI / 2;
outerGround.position.y = outerGroundY();
outerGround.receiveShadow = true;
scene.add(outerGround);

let shoreRing = null;               // sandy apron so the city sits on an island, rebuilt when N changes
function applyOcean() {
  outerGround.material = oceanOn ? seaMaterial : desertMaterial;
  outerGround.position.y = outerGroundY();
  buildGroundSkirt();               // skirt bottom tracks outerGroundY() too
  if (shoreRing) { scene.remove(shoreRing); shoreRing.geometry.dispose(); shoreRing = null; }
  // Square grid keeps its flat square apron. The circular island replaces the
  // apron with a tidal zone (built separately) — so only build the flat ring here.
  if (oceanOn && !circularIsland) {
    shoreRing = new THREE.Mesh(new THREE.PlaneGeometry(N + 14, N + 14), desertMaterial);
    shoreRing.rotation.x = -Math.PI / 2;
    shoreRing.position.y = WATER_LEVEL - 0.04;   // sand apron just above the sea, below the city rim
    shoreRing.receiveShadow = true;
    scene.add(shoreRing);
  }
  buildTidalZone();                 // circular+ocean only; disposes itself otherwise
}

/* ----------------------------------------------------------------------------
   TIDAL ZONE — the circular island's coast. Instead of a flat sand apron, an
   annulus ramping from the city rim down under the sea, coloured dry sand ->
   wet sand -> salt marsh -> mud, with a seeded wobbly waterline (inlets and
   sandbars). It's the sea's answer to the river's green floodplain: the reed
   clumps that dress it are scattered in the instancing pass (rebuildInstances).
   ------------------------------------------------------------------------- */

let tidalMesh = null;
let _tidalPh = null;                // seeded harmonic phases for the wobbly coast
const _cSandDry = new THREE.Color(0xd7bd90);
const _cSandWet = new THREE.Color(0x9c8358);
const _cMarsh   = new THREE.Color(0x6f7d3d);
const _cMud     = new THREE.Color(0x54492c);
const _cShallow = new THREE.Color(0x3f6f8c);   // blend toward the sea at the waterline
const _tcT = new THREE.Color();

// Shared geometry so the mesh and the reed scatter agree on where the coast is.
// Rin tucks a good way UNDER the city rim (N/2) so the annulus always underlaps
// the island ground — no gap can open at the seam.
function tidalGeom() {
  return { seaY: outerGroundY(), Rin: N / 2 - 1.4, width: Math.max(8, N * 0.18) };
}
function tidalWobble(a) {
  let n = 0;
  for (let k = 1; k <= 5; k++) n += Math.sin(a * k + _tidalPh[k - 1]) / k;
  return n * 0.5;                              // roughly [-1, 1]
}
// (angle, t in [0,1] from coast to open sea) -> world x/z and terrain height h.
// The wobble is masked to zero at the inner edge (t=0) and eases in by t~0.4, so
// the seam under the city stays a clean circle and only the waterline gets ragged.
function tidalSample(a, t) {
  const { seaY, Rin, width } = tidalGeom();
  const w = tidalWobble(a);
  const u = Math.min(1, t / 0.4), mask = u * u * (3 - 2 * u);   // smoothstep 0 -> 0.4
  const rad = Rin + t * width + w * width * 0.2 * mask;
  // Height in two acts. Above water: a broad, gently-sloping exposed foreshore
  // from the coast down to the shoreline. Below: a STEEP plunge to a deep
  // seabed. The submerged part must dive well clear of the flat sea plane — if
  // it instead ran nearly parallel just beneath it, that wide near-coplanar band
  // is what shimmered against the sea when orbiting/zooming (depth-buffer fight).
  const tSh = 0.7;                                // shoreline at 70% out: most of the flat is dry
  const shoreY = seaY + 0.015;                    // foreshore bottoms out a hair above the sea plane
  let h;
  if (t < tSh) {
    const s = (t / tSh) * (t / tSh) * (3 - 2 * (t / tSh));       // smoothstep, flattens into the tide
    h = s * shoreY;
  } else {
    const p = (t - tSh) / (1 - tSh);
    h = shoreY + p * (2 - p) * ((seaY - 1.8) - shoreY);          // ease-out: steep at the shore, deep below
  }
  h += w * 0.05 * (1 - t) * mask;                 // small sandbars on the exposed flat
  return { x: Math.cos(a) * rad, z: Math.sin(a) * rad, h };
}

function buildTidalZone() {
  if (tidalMesh) { scene.remove(tidalMesh); tidalMesh.geometry.dispose(); tidalMesh = null; }
  if (!(circularIsland && oceanOn) || !lattice) return;
  _tidalPh = [];
  for (let k = 0; k < 5; k++) _tidalPh.push(hash01(globalSeed, k, 7, 0x7DA1) * Math.PI * 2);
  const { seaY, width } = tidalGeom();
  const rings = 16, seg = Math.max(120, Math.round(N * 2.5));
  const verts = [], colors = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const t = r / rings;
    for (let s = 0; s <= seg; s++) {
      const a = (s / seg) * Math.PI * 2;
      const smp = tidalSample(a, t);
      verts.push(smp.x, smp.h, smp.z);
      const above = smp.h - seaY;              // >0 exposed foreshore, <=0 sunk under the sea plane
      if (above > 0.20) {                      // upper beach: dry, drying to wet as it nears the tide
        _tcT.copy(_cSandDry).lerp(_cSandWet, Math.min(1, (0.34 - above) / 0.14));
      } else if (above > 0.06) {               // mid foreshore: wet sand blotched with salt marsh
        const marsh = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(a * 6 + _tidalPh[0]));
        _tcT.copy(_cSandWet).lerp(_cMarsh, ((0.20 - above) / 0.14) * marsh);
      } else {                                 // waterline and below: mud grading into the sea colour
        _tcT.copy(_cMud).lerp(_cShallow, Math.min(1, (0.06 - above) / 0.14));
      }
      colors.push(_tcT.r, _tcT.g, _tcT.b);
    }
  }
  const stride = seg + 1;
  for (let r = 0; r < rings; r++) for (let s = 0; s < seg; s++) {
    const a = r * stride + s, b = a + 1, c = a + stride, d = c + 1;
    idx.push(a, b, c, b, d, c);              // wound so normals face up
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  tidalMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  tidalMesh.receiveShadow = true;
  scene.add(tidalMesh);
}

// Reed/marsh tuft: a spray of thin green blades, dressing the wet foreshore.
function reedClump(rng, out) {
  const n = 4 + Math.floor(rng() * 5);
  for (let i = 0; i < n; i++) {
    const rr = range(rng, 0, 0.22), aa = rng() * Math.PI * 2, hh = range(rng, 0.22, 0.55);
    out.push(I('cone', 'palm', [Math.cos(aa) * rr, hh / 2, Math.sin(aa) * rr],
      [0.05, hh, 0.05], [range(rng, -0.12, 0.12), 0, range(rng, -0.12, 0.12)]));
  }
}

// grid ground: a real warped mesh whose vertices follow the jittered lattice
let gridGround = null;
// vertex colours: sand base, green floodplain near the river, darker sunken riverbed
const _groundSand = new THREE.Color(0xd7bd90);
const _groundGreen = new THREE.Color(0x93a95e);
const _groundBed = new THREE.Color(0x9a8a68);
const _tmpColor = new THREE.Color();

// distance-to-water sampled at a lattice vertex = min over its (up to 4) adjacent cells
function vertexFloodDist(i, j) {
  if (!canalOn) return 255;
  let d = 255;
  for (const [cx, cy] of [[i - 1, j - 1], [i, j - 1], [i - 1, j], [i, j]]) {
    if (cx < 0 || cx >= N || cy < 0 || cy >= N) continue;
    d = Math.min(d, floodDist[cy * N + cx]);
  }
  return d;
}

function buildGroundMesh() {
  if (gridGround) { scene.remove(gridGround); gridGround.geometry.dispose(); }
  const geo = new THREE.PlaneGeometry(N, N, N, N);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array((N + 1) * (N + 1) * 3);
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    const v = j * (N + 1) + i;
    pos.setX(v, lattice[j][i].x);
    pos.setZ(v, lattice[j][i].z);
    pos.setY(v, terrainHeight(i, j));  // heightField + tells (canal valley already carved in)
    const d = vertexFloodDist(i, j);
    if (d === 0) {
      _tmpColor.copy(_groundBed);
    } else if (d === 1) {
      _tmpColor.copy(_groundSand).lerp(_groundGreen, 0.75);
    } else if (d === 2) {
      _tmpColor.copy(_groundSand).lerp(_groundGreen, 0.35);
    } else {
      _tmpColor.copy(_groundSand);
    }
    colors[v * 3] = _tmpColor.r; colors[v * 3 + 1] = _tmpColor.g; colors[v * 3 + 2] = _tmpColor.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  gridGround = new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  gridGround.receiveShadow = true;
  scene.add(gridGround);
  buildGroundSkirt();
}

// Perimeter "curtain": the grid ground's rim fades toward height 0, but the
// outer desert plane sits at a fixed lower Y (below the water level) — so
// without this there's a permanent step-down cliff at the seam with nothing
// filling it, letting the camera see straight under the grid's edge. This
// wraps the boundary with a vertical strip connecting rim height down to the
// outer plane's height, so the seam always reads as solid ground.
let groundSkirt = null;
function buildGroundSkirt() {
  if (groundSkirt) { scene.remove(groundSkirt); groundSkirt.geometry.dispose(); groundSkirt = null; }
  if (!lattice) return;
  const bottomY = outerGroundY() - 0.3;   // a bit past the outer plane so no seam even if it shifts
  const ring = [];
  for (let i = 0; i <= N; i++) ring.push([i, 0]);
  for (let j = 1; j <= N; j++) ring.push([N, j]);
  for (let i = N - 1; i >= 0; i--) ring.push([i, N]);
  for (let j = N - 1; j >= 1; j--) ring.push([0, j]);
  const verts = [];
  for (const [i, j] of ring) {
    const p = lattice[j][i];
    verts.push(p.x, terrainHeight(i, j), p.z, p.x, bottomY, p.z);
  }
  const idx = [];
  for (let k = 0; k < ring.length; k++) {
    const kn = (k + 1) % ring.length;
    const a = k * 2, b = k * 2 + 1, c = kn * 2, d = kn * 2 + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  groundSkirt = new THREE.Mesh(geo,
    new THREE.MeshStandardMaterial({ color: 0xc9ab7a, roughness: 1, side: THREE.DoubleSide }));
  groundSkirt.receiveShadow = true;
  scene.add(groundSkirt);
}

// Cheap per-step terrain refresh: tells grew, so rewrite vertex heights in
// place (colours are static per seed — no need to touch them).
function updateGroundHeights() {
  if (!gridGround) return;
  const pos = gridGround.geometry.attributes.position;
  for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
    pos.setY(j * (N + 1) + i, terrainHeight(i, j));
  }
  pos.needsUpdate = true;
  buildGroundSkirt();                // rim heights may have shifted too (tells near the edge)
  gridGround.geometry.computeVertexNormals();
}

// Water surface: flat quads over every canal cell (following the jittered
// lattice), plus two straight strips carrying the river to the horizon.
let waterMesh = null, horizonWater = null;
const WATER_Y = WATER_LEVEL;        // the one water plane, shared with the carved valley
const waterMaterial = new THREE.MeshStandardMaterial({ color: 0x2f6d9e, roughness: 0.25, metalness: 0.1 });

// LIVING WATER — perturb the surface normal with travelling sine waves in the
// fragment shader, so sunlight glints and shifts across the river without any
// extra geometry. World-position based, so tile seams stay continuous. The
// same patch dresses the open sea. Driven by uTime from the ambient loop.
const waterTime = { value: 0 };
function patchWater(mat, amp) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = waterTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>',
        '#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;\nvarying vec3 vWPos;')
      .replace('#include <normal_fragment_begin>', `#include <normal_fragment_begin>
        {
          float w1 = sin(vWPos.x * 2.3 + uTime * 1.3) + sin(vWPos.x * 4.1 + vWPos.z * 1.7 - uTime * 0.8);
          float w2 = sin(vWPos.z * 2.9 + uTime * 1.0) + sin((vWPos.x + vWPos.z) * 1.6 - uTime * 1.6);
          normal = normalize(normal + vec3(w1, 0.0, w2) * ${amp});
        }`);
  };
}
patchWater(waterMaterial, '0.10');   // river: lively glints between the banks
patchWater(seaMaterial, '0.05');     // open sea: broader, calmer swell

function buildWaterMesh() {
  if (waterMesh) { scene.remove(waterMesh); waterMesh.geometry.dispose(); waterMesh = null; }
  if (horizonWater) { scene.remove(horizonWater); horizonWater.geometry.dispose(); horizonWater = null; }
  if (!canalOn) return;
  const verts = [], idx = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!canalMask[y * N + x]) continue;
    const p00 = lattice[y][x], p10 = lattice[y][x + 1], p01 = lattice[y + 1][x], p11 = lattice[y + 1][x + 1];
    const base = verts.length / 3;
    verts.push(p00.x, WATER_Y, p00.z, p10.x, WATER_Y, p10.z, p01.x, WATER_Y, p01.z, p11.x, WATER_Y, p11.z);
    idx.push(base, base + 2, base + 1, base + 1, base + 2, base + 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  waterMesh = new THREE.Mesh(geo, waterMaterial);
  waterMesh.receiveShadow = true;
  scene.add(waterMesh);

  // horizon strips: continue the channel straight off both edges, under the fog.
  // A circular island has no straight edges for the channel to run off — the
  // river simply meets the round coast — so skip them there.
  if (circularIsland) return;
  const L = N * 6;
  const w0 = canalWidths[0], wN = canalWidths[N - 1];
  const wIn = lattice[canalRows[0]][0], wOut = lattice[canalRows[0] + w0][0];
  const eIn = lattice[canalRows[N - 1]][N], eOut = lattice[canalRows[N - 1] + wN][N];
  const hVerts = new Float32Array([
    wIn.x - L, WATER_Y, wIn.z,  wIn.x, WATER_Y, wIn.z,  wOut.x - L, WATER_Y, wOut.z,  wOut.x, WATER_Y, wOut.z,
    eIn.x, WATER_Y, eIn.z,  eIn.x + L, WATER_Y, eIn.z,  eOut.x, WATER_Y, eOut.z,  eOut.x + L, WATER_Y, eOut.z,
  ]);
  const hGeo = new THREE.BufferGeometry();
  hGeo.setAttribute('position', new THREE.BufferAttribute(hVerts, 3));
  hGeo.setIndex([0, 2, 1, 1, 2, 3, 4, 6, 5, 5, 6, 7]);
  hGeo.computeVertexNormals();
  horizonWater = new THREE.Mesh(hGeo, waterMaterial);
  scene.add(horizonWater);
}

/* ============================================================================
   CITY STATE — automaton + per-tile birth records + two-frame lookahead.
   ------------------------------------------------------------------------- */

let globalSeed = 1;
let preset = PRESETS.find(p => p.name === 'Caravan Sprawl');   // default culture: gentle sprawl
let buildingCap = 2500;             // max tiles per rebuild that get the full decorated recipe
let grid = null;                    // current committed generation
let generation = 0;
let records = null;                 // per tile: {seed, n} fixed at birth, or null

function recordBirths(newGrid, oldRecords, gen) {
  const recs = new Array(N * N).fill(null);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (!newGrid[i]) continue;
    if (oldRecords && oldRecords[i]) {
      recs[i] = oldRecords[i];      // survivor: form fixed at birth, never re-rolls
    } else {
      recs[i] = { seed: hashSeed(globalSeed, x, y, gen), n: neighbourCount(newGrid, x, y), g: gen };
    }
  }
  return recs;
}

function resetCity() {
  generation = 0;
  buildLattice(globalSeed);
  buildCanal();
  templeZig = null;                  // fresh city: re-pick the special ziggurat from scratch
  tellDelta = null;                  // fresh city: clear tells and erosion before rebuilding the base
  erosionDelta = null;
  buildHeightField();                // fresh immutable base + cleared tells/erosion
  resetWalls();
  grid = applyCanal(new Uint8Array(N * N));   // blank desert — the player paints the city
  churnDelta = new Float32Array((N + 1) * (N + 1));
  sculptUnlocked = false;
  updateBrushUI();
  records = recordBirths(grid, null, 0);
  stampTells(detectZiggurats(grid).zigs);
  buildGroundMesh();                 // reads heightField + tells
  buildWaterMesh();
  applyOcean();                      // shore ring size tracks N
  rebuildInstances();
  updateGenLabel();
  render();
}

function stepCity() {
  const next = stepSim(grid, generation);
  generation++;
  grid = next;
  if (canalOn && riverFlow.wave) {              // auto flow preset: re-lay the channel for this generation
    buildCanal();
    grid = applyCanal(grid);
    buildHeightField();
    buildGroundMesh();
    buildWaterMesh();
  }
  records = recordBirths(grid, records, generation);
  const tellsChanged = stampTells(detectZiggurats(grid).zigs);
  const erosionChanged = stampErosion();          // all three must run every step; don't short-circuit
  const churnChanged = stampChurn();              // occupied districts slowly rise
  if (tellsChanged || erosionChanged || churnChanged) updateGroundHeights();
  updateUnlocks();
  updateBrushUI();                                // vernacular growth/decay moves the brush max too
  updateWalls();
  rebuildInstances();
  updateGenLabel();
  render();
}

// River width changed live: re-lay the channel, drown any buildings now under
// water, re-carve the valley (tells preserved), and let the city react — the new
// bank sprouts docks/floodplain, and the automaton evolves from the new state.
function setRiverWidth() {
  buildCanal();
  grid = applyCanal(grid);           // kill buildings on the newly-covered tiles
  records = recordBirths(grid, records, generation);   // drop records for drowned tiles
  buildHeightField();                // re-carve the valley, keep tells
  buildGroundMesh();
  buildWaterMesh();
  rebuildInstances();
  render();
}

/* ============================================================================
   ZIGGURAT DETECTION — read-only pass over Life state. Maximal solid squares
   (>= 3x3), claimed largest-first non-overlapping. Claimed tiles opt out of
   per-tile building generation. Runs on both current and next grid so a
   collapsing ziggurat gets one "ruined ziggurat" telegraph frame.
   ------------------------------------------------------------------------- */

function detectZiggurats(g) {
  // dp[i] = side of the largest solid square whose bottom-right corner is i
  const dp = new Int16Array(N * N);
  let maxS = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (!g[i]) continue;
    dp[i] = (x > 0 && y > 0) ? 1 + Math.min(dp[i - 1], dp[i - N], dp[i - N - 1]) : 1;
    if (dp[i] > maxS) maxS = dp[i];
  }
  const claimed = new Uint8Array(N * N);
  const zigs = [];
  for (let s = maxS; s >= 3; s--) {            // largest-first
    for (let y = s - 1; y < N; y++) for (let x = s - 1; x < N; x++) {
      if (dp[y * N + x] < s) continue;
      const x0 = x - s + 1, y0 = y - s + 1;
      let free = true;
      outer: for (let yy = y0; yy <= y; yy++) for (let xx = x0; xx <= x; xx++) {
        if (claimed[yy * N + xx]) { free = false; break outer; }
      }
      if (!free) continue;
      for (let yy = y0; yy <= y; yy++) for (let xx = x0; xx <= x; xx++) claimed[yy * N + xx] = 1;
      zigs.push({ x0, y0, size: s });
    }
  }
  return { zigs, claimed };
}

const zigsOverlap = (a, b) =>
  a.x0 < b.x0 + b.size && b.x0 < a.x0 + a.size &&
  a.y0 < b.y0 + b.size && b.y0 < a.y0 + a.size;

// Aim the ramp-stair at the face with the least living city beside it (2-deep
// strip; out-of-bounds counts as open sand). Faces: 0 +z(y+), 1 +x, 2 -z, 3 -x.
function bestStairFace(z, g) {
  const strips = [
    { dx: 0, dy: 1 }, { dx: 1, dy: 0 }, { dx: 0, dy: -1 }, { dx: -1, dy: 0 },
  ];
  let best = 0, bestCount = Infinity;
  for (let f = 0; f < 4; f++) {
    const { dx, dy } = strips[f];
    let count = 0;
    for (let depth = 1; depth <= 2; depth++) for (let k = 0; k < z.size; k++) {
      const x = dx !== 0 ? z.x0 + (dx > 0 ? z.size - 1 + depth : -depth) : z.x0 + k;
      const y = dy !== 0 ? z.y0 + (dy > 0 ? z.size - 1 + depth : -depth) : z.y0 + k;
      if (x >= 0 && x < N && y >= 0 && y < N) count += g[y * N + x];
    }
    if (count < bestCount) { bestCount = count; best = f; }
  }
  return best;
}

/* ============================================================================
   WALLS — temenos precinct walls seeded by ziggurats, growing into a grand
   city wall. Lifecycle: a ziggurat that persists >= 3 generations gets a
   precinct wall project (rectangle around it +2 margin, max 4 concurrent,
   largest/oldest first). A crew builds M segments per generation, so the wall
   crawls around the ring, telegraphed by scaffolds. Projects whose rings
   touch merge into one; a finished ring pressed by outside growth expands;
   a ring covering most of the city snaps to the whole city's extent (the
   grand wall). Outgrown or orphaned rings persist forever as ruins that the
   city swallows. Segments over the canal are skipped: water gates.
   ------------------------------------------------------------------------- */

let zigTracks = [];                 // {x0, y0, size, age} — persistence across generations
let templeZig = null;               // {x0, y0, size} of the current special (tallest) ziggurat — persists across rebuilds so the coloured crown doesn't hop between near-equal peers
let wallProjects = [];              // {rect, queue:[{x,y}], built, grand}
let wallRuins = new Map();          // "x,y" -> true; render ruin while tile is empty
const WALL_MAX_PROJECTS = 4;
const WALL_MIN_ZIG_AGE = 3;

function resetWalls() {
  zigTracks = [];
  wallProjects = [];
  wallRuins = new Map();
}

const rectsTouch = (a, b) =>
  a.x0 <= b.x1 + 1 && b.x0 <= a.x1 + 1 && a.y0 <= b.y1 + 1 && b.y0 <= a.y1 + 1;
const rectArea = r => (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1);
const clampRect = r => ({
  x0: Math.max(0, r.x0), y0: Math.max(0, r.y0),
  x1: Math.min(N - 1, r.x1), y1: Math.min(N - 1, r.y1),
});

// Ordered ring of perimeter tiles, clockwise from the south-side gate position.
function ringTiles(rect) {
  const { x0, y0, x1, y1 } = rect;
  const tiles = [];
  const midX = (x0 + x1) >> 1;
  for (let x = midX; x <= x1; x++) tiles.push({ x, y: y1 });          // south: mid -> east
  for (let y = y1 - 1; y >= y0; y--) tiles.push({ x: x1, y });        // east edge up
  for (let x = x1 - 1; x >= x0; x--) tiles.push({ x, y: y0 });        // north edge west
  for (let y = y0 + 1; y <= y1; y++) tiles.push({ x: x0, y });        // west edge down
  for (let x = x0 + 1; x < midX; x++) tiles.push({ x, y: y1 });       // south: west -> mid
  return tiles;
}

function startProject(rect, grand) {
  rect = clampRect(rect);
  wallProjects.push({ rect, queue: ringTiles(rect), built: 0, grand: !!grand, age: 0, missing: 0 });
}

function abandonProject(p) {
  for (let k = 0; k < p.built; k++) wallRuins.set(p.queue[k].x + ',' + p.queue[k].y, true);
  wallProjects.splice(wallProjects.indexOf(p), 1);
}

// bounding box of established city tiles (2+ neighbours, so stray hamlets don't count)
function cityBBox() {
  let x0 = N, y0 = N, x1 = -1, y1 = -1;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (grid[y * N + x] && neighbourCount(grid, x, y) >= 2) {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return x1 < 0 ? null : { x0, y0, x1, y1 };
}

function updateWalls() {
  const zigs = detectZiggurats(grid).zigs;

  // 1. persistence tracking: a ziggurat inherits the age of any overlapping predecessor
  zigTracks = zigs.map(z => {
    let age = 1;
    for (const t of zigTracks) if (zigsOverlap(z, t)) age = Math.max(age, t.age + 1);
    return { ...z, age };
  });

  for (const p of wallProjects) p.age++;

  // 2. orphaned precinct projects: with a grace period, so a ziggurat that
  //    flickers out for a generation doesn't dump its whole ring to ruins.
  //    (The grand wall isn't tied to one ziggurat, so it's exempt.)
  for (const p of [...wallProjects]) {
    if (p.grand) continue;
    const hasZig = zigs.some(z =>
      z.x0 >= p.rect.x0 && z.x0 + z.size - 1 <= p.rect.x1 &&
      z.y0 >= p.rect.y0 && z.y0 + z.size - 1 <= p.rect.y1);
    p.missing = hasZig ? 0 : p.missing + 1;
    if (p.missing >= 3) abandonProject(p);
  }

  // 3. merging: two COMPLETED precinct rings that touch become one precinct.
  //    Gating on completion (not the build frontier) stops constant re-merging.
  let merged = true;
  while (merged) {
    merged = false;
    outer: for (let a = 0; a < wallProjects.length; a++) {
      for (let b = a + 1; b < wallProjects.length; b++) {
        const pa = wallProjects[a], pb = wallProjects[b];
        if (pa.grand || pb.grand) continue;
        if (pa.built < pa.queue.length || pb.built < pb.queue.length) continue;
        if (!rectsTouch(pa.rect, pb.rect)) continue;
        const union = {
          x0: Math.min(pa.rect.x0, pb.rect.x0), y0: Math.min(pa.rect.y0, pb.rect.y0),
          x1: Math.max(pa.rect.x1, pb.rect.x1), y1: Math.max(pa.rect.y1, pb.rect.y1),
        };
        abandonProject(pb); abandonProject(pa);
        startProject(union, false);
        merged = true;
        break outer;
      }
    }
  }

  // 4. grand wall: a single one-time promotion once the city is large and at
  //    least one precinct is mature. Promotion retires the precincts (they
  //    become the inner-ring ruins the grand wall encloses). Afterwards the
  //    grand wall only re-expands when the city has genuinely outgrown it, on
  //    a long cooldown — so expansion is an era, not a per-tick event.
  const bbox = cityBBox();
  const grand = wallProjects.find(p => p.grand);
  if (grand && !bbox) {
    abandonProject(grand);                          // city died out; retire the ring
  } else if (bbox) {
    const bw = bbox.x1 - bbox.x0 + 1, bh = bbox.y1 - bbox.y0 + 1;
    if (!grand) {
      const cityLarge = bw >= N * 0.5 && bh >= N * 0.5;
      const maturePrecinct = wallProjects.some(p => p.built === p.queue.length && p.age >= 4);
      if (cityLarge && maturePrecinct) {
        for (const p of [...wallProjects]) abandonProject(p);
        startProject({ x0: bbox.x0 - 1, y0: bbox.y0 - 1, x1: bbox.x1 + 1, y1: bbox.y1 + 1 }, true);
      }
    } else if (grand.built === grand.queue.length && grand.age >= 8) {
      const outgrown = bbox.x0 < grand.rect.x0 || bbox.y0 < grand.rect.y0 ||
                       bbox.x1 > grand.rect.x1 || bbox.y1 > grand.rect.y1;
      if (outgrown) {
        abandonProject(grand);
        startProject({ x0: bbox.x0 - 1, y0: bbox.y0 - 1, x1: bbox.x1 + 1, y1: bbox.y1 + 1 }, true);
      }
    }
  }

  // 5. new precinct projects — only while there's no grand wall yet. Worthy
  //    ziggurats (old enough, not already walled), largest then oldest first.
  if (!wallProjects.some(p => p.grand)) {
    const candidates = zigTracks
      .filter(t => t.age >= WALL_MIN_ZIG_AGE)
      .filter(t => !wallProjects.some(p =>
        t.x0 >= p.rect.x0 - 2 && t.x0 + t.size - 1 <= p.rect.x1 + 2 &&
        t.y0 >= p.rect.y0 - 2 && t.y0 + t.size - 1 <= p.rect.y1 + 2))
      .sort((a, b) => b.size - a.size || b.age - a.age);
    for (const t of candidates) {
      if (wallProjects.length >= WALL_MAX_PROJECTS) break;
      startProject({ x0: t.x0 - 2, y0: t.y0 - 2, x1: t.x0 + t.size + 1, y1: t.y0 + t.size + 1 }, false);
    }
  }

  // 6. construction: each crew lays several segments per generation
  for (const p of wallProjects) {
    const M = Math.max(8, Math.ceil(p.queue.length / 20));
    p.built = Math.min(p.queue.length, p.built + M);
  }

  // safety valve: bound the ruin memory on very long runs. Genuine outgrown
  // rings are few now, so this only ever trims truly ancient history.
  if (wallRuins.size > 4000) {
    let excess = wallRuins.size - 4000;
    for (const k of wallRuins.keys()) { if (excess-- <= 0) break; wallRuins.delete(k); }
  }
}

// Current render state of every wall tile: "x,y" -> {type, seed, run}
// type: built | tower | gate | scaffold. run: 0 = wall runs along x, 1 = along z.
function wallClaims() {
  const claims = new Map();
  for (const p of wallProjects) {
    const { x0, y0, x1, y1 } = p.rect;
    const gateXs = new Set([(x0 + x1) >> 1]);
    for (let k = 0; k < Math.min(p.queue.length, p.built + 12); k++) {
      const { x, y } = p.queue[k];
      if (canalOn && canalMask[y * N + x]) continue;      // water gate: river breaches the wall
      const key = x + ',' + y;
      const seed = hashSeed(globalSeed, x, y, 0x3A11);
      if (k >= p.built) { claims.set(key, { type: 'scaffold', seed }); continue; }
      const corner = (x === x0 || x === x1) && (y === y0 || y === y1);
      const onNS = y === y0 || y === y1;                  // north/south edge: wall runs along x
      const gate = !corner && ((onNS && gateXs.has(x)) || (!onNS && y === (y0 + y1) >> 1));
      claims.set(key, { type: corner ? 'tower' : gate ? 'gate' : 'built', seed, run: onNS ? 0 : 1 });
    }
  }
  return claims;
}

// Wall segment instructions, tile-local (same frame the building generator uses)
// Foundation skirt: walls sit at the tile's AVERAGE corner height, but the
// ground mesh follows the exact per-corner slope, so a flat-bottomed wall box
// can float above a dip and expose open air underneath. A tall skirt reaching
// well below any plausible terrain variation closes that gap unconditionally,
// cheaper and more robust than trying to contour-match the footprint.
const WALL_SKIRT_DEPTH = 2.5;
function wallSkirt(out, mat = 'sandDark') {
  out.push(I('box', mat, [0, -WALL_SKIRT_DEPTH / 2, 0], [1, WALL_SKIRT_DEPTH, 1]));
}

function generateWallSegment(claim) {
  const out = [];
  const rng = mulberry32(claim.seed);
  if (claim.type === 'scaffold') return generateScaffold(claim.seed);
  if (claim.type === 'tower') {
    wallSkirt(out, 'sand');
    out.push(I('box', 'sand', [0, 0.55, 0], [1, 1.1, 1]));
    cornice(rng, out, { pos: [0, 0.55, 0], scale: [1, 1.1, 1] }, 'sandDark', false);
    return out;
  }
  wallSkirt(out);
  const h = 0.75;
  out.push(I('box', 'sand', [0, h / 2, 0], [1, h, 1]));
  // crenellation teeth along the top, following the wall's run direction
  for (let i = 0; i < 5; i++) {
    const t = (i + 0.5) / 5 - 0.5;
    out.push(I('box', 'sandDark',
      claim.run === 0 ? [t, h + 0.08, 0] : [0, h + 0.08, t],
      [0.11, 0.16, 0.11]));
  }
  if (claim.type === 'gate') {
    // dark opening through both faces + arch, perpendicular to the run
    const d = claim.run === 0 ? [0.36, 0.5, 1.06] : [1.06, 0.5, 0.36];
    out.push(I('box', 'window', [0, 0.25, 0], d));
    archHead(out, 0, 0.5, 0, 0.42, 0.21, 0.07, 0.06,
      claim.run === 0 ? 'z' : 'x', 'sandDark');
  }
  return out;
}

function generateWallRuin(seed) {
  const out = [];
  const rng = mulberry32(seed);
  const h = 0.2 + rng() * 0.18;
  out.push(I('box', 'sandDark', [0, h / 2, 0], [1, h, 1]));
  for (let i = 0; i < 3; i++) {
    const s = 0.06 + rng() * 0.08;
    out.push(I('box', 'sand', [(rng() - 0.5) * 0.8, h + s / 2, (rng() - 0.5) * 0.8],
      [s, s, s], [0, rng() * Math.PI, 0]));
  }
  return out;
}

/* ============================================================================
   REBUILD — recomputes every tile + ziggurat's instructions and writes their
   transformed instances into the shared buckets. Runs on every step/reset
   (per spec, rebuild cost matters more than steady-state render cost, since
   this only happens on step, not every frame). Four tile cases from the
   two-frame lookahead: stable building / sand / scaffold (about to be born) /
   ruin (about to die). Ziggurat-claimed tiles are skipped for per-tile
   generation; ziggurat tier count is re-evaluated fresh every call (the
   deliberate exception to "no re-roll on survival").
   ------------------------------------------------------------------------- */

const _tileMat = new THREE.Matrix4(), _localMat = new THREE.Matrix4(), _worldMat = new THREE.Matrix4();

// Terrain-tilt factor by neighbour count: lone huts lean into the slope,
// dense fused blocks stay near-upright so continuous quarters read coherent.
function tiltForNeighbours(n) {
  return n >= 5 ? 0.1 : n >= 3 ? 0.25 : 0.6;
}

// Cheap stand-in for a stable building beyond the building cap: one plain box,
// roughly storey-height, no decoration. ~1 primitive instead of ~40-100, but
// still visibly "something is here" rather than lying that the tile is sand.
const _placeholderStoreys = [0, 1, 1, 2, 3, 3, 3, 3, 3];
function generatePlaceholder(n) {
  const h = Math.max(0.28, _placeholderStoreys[n] * 0.32);
  return [{ shape: 'box', mat: 'sand', pos: [0, h / 2, 0], scale: [1, h, 1], rot: [0, 0, 0] }];
}

function rebuildInstances() {
  const next = stepSim(grid, generation);        // lookahead, not committed
  const curZ = detectZiggurats(grid);
  const nextZ = detectZiggurats(next);

  const sources = [];                            // { matrix: Matrix4, instructions: [] }
  const stableCandidates = [];                    // { x, y, dist2 } — the capped, expensive case
  const claims = wallClaims();                    // active wall segments/scaffolds by tile

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (curZ.claimed[i]) continue;                // ziggurat footprint: no per-tile building
    if (canalOn && canalMask[i]) continue;        // water: nothing builds on the river
    let instructions = null;
    let tiltF = 0.4;                              // how much this structure leans with the terrain
    const wc = claims.get(x + ',' + y);
    const cur = grid[i], fut = next[i];
    if (wc) {                                     // active wall segment claims the tile outright
      instructions = generateWallSegment(wc);
      tiltF = 0;                                  // walls stay upright, stepping with the ground
    } else if (cur && canalOn && floodDist[i] === 1) {   // riverbank: a dock, not a building
      let wx = 0, wz = 0;                          // which way the water lies (for the pier finger)
      if (y > 0 && canalMask[i - N]) wz = -1;
      else if (y < N - 1 && canalMask[i + N]) wz = 1;
      else if (x > 0 && canalMask[i - 1]) wx = -1;
      else if (x < N - 1 && canalMask[i + 1]) wx = 1;
      instructions = generateDock(hashSeed(globalSeed, x, y, 0xD0C65), wx, wz);
      tiltF = 0;                                  // docks stay level
    } else if (cur && fut) {                       // stable building: subject to the cap, handled below
      const dx = x - N / 2, dy = y - N / 2;
      stableCandidates.push({ x, y, dist2: dx * dx + dy * dy });
      continue;
    } else if (cur && !fut) {                      // ruin: already cheap, always full detail
      const r = records[i];
      instructions = generateBuilding(r.n, r.seed, 'ruin');
      tiltF = tiltForNeighbours(r.n);
    } else if (!cur && fut) {                      // scaffold: already cheap, always full detail
      instructions = generateScaffold(hashSeed(globalSeed, x, y, generation + 1));
      tiltF = 0.3;
    } else if (wallRuins.has(x + ',' + y)) {       // crumbled old wall on otherwise empty ground
      instructions = generateWallRuin(hashSeed(globalSeed, x, y, 0x3A11));
    } else if (canalOn && floodDist[i] <= 2) {     // floodplain scenery: reeds, palms, crop fields
      const roll = hash01(globalSeed, x, y, 0x9A1A);   // static per seed, so greenery doesn't flicker
      if (floodDist[i] === 1 && roll < 0.3) {
        instructions = [];
        const rng = mulberry32(hashSeed(globalSeed, x, y, 0x9EED));
        const reeds = 3 + Math.floor(rng() * 4);
        for (let k = 0; k < reeds; k++) {
          instructions.push(I('cone', 'palm',
            [(rng() - 0.5) * 0.8, 0.11, (rng() - 0.5) * 0.8],
            [0.03, 0.22 + rng() * 0.12, 0.03], [0, 0, (rng() - 0.5) * 0.3]));
        }
      } else if (roll < 0.62) {                     // irrigated fields across the floodplain
        instructions = [];
        cropField(mulberry32(hashSeed(globalSeed, x, y, 0xF1E1D)), instructions);
        tiltF = 1;                                  // flat soil bed: snap fully to the terrain face, no float/gap
      } else if (roll > 0.88) {
        instructions = [];
        const rng = mulberry32(hashSeed(globalSeed, x, y, 0x9A1A));
        palmTree(rng, instructions, (rng() - 0.5) * 0.5, (rng() - 0.5) * 0.5, 0.9);
      } else {
        continue;
      }
    } else {
      // stable sand: one market stall per frontage tile (the "edge" layer).
      // A single stall against one built neighbour keeps maze presets from
      // carpeting every corridor — cheap and reads as an occasional stall.
      let dx = 0, dy = 0;
      if (y > 0 && grid[i - N] && !curZ.claimed[i - N]) dy = -1;
      else if (y < N - 1 && grid[i + N] && !curZ.claimed[i + N]) dy = 1;
      else if (x > 0 && grid[i - 1] && !curZ.claimed[i - 1]) dx = -1;
      else if (x < N - 1 && grid[i + 1] && !curZ.claimed[i + 1]) dx = 1;
      else continue;                                     // no frontage: nothing to draw
      if (hash01(globalSeed, x, y, 0x57A11) >= 0.28) continue;
      instructions = [];
      marketStall(instructions, dx, dy, CLOTHS[Math.floor(hash01(globalSeed, x, y, 0x5C0) * 3)]);
      tiltF = 0;
    }
    const t = tileTransform(x, y);
    const m = composeMatrix(new THREE.Matrix4(),
      t.cx, t.cy, t.cz, t.tx * tiltF, t.yaw, t.tz * tiltF, t.sx, 1, t.sz);
    sources.push({ matrix: m, instructions });
  }

  // building cap: full decorated recipe for the buildingCap tiles closest to
  // the grid center, cheap placeholder box for the rest. Priority is fixed
  // (center-out), not camera-based, which reinforces the dense-core/fading-
  // outskirts read the jittered dead-edge grid already has.
  stableCandidates.sort((a, b) => a.dist2 - b.dist2);
  for (let k = 0; k < stableCandidates.length; k++) {
    const { x, y } = stableCandidates[k];
    const i = y * N + x;
    const r = records[i];
    const full = k < buildingCap;
    const senes = senesOf(r);
    const instructions =
      r.s ? generateScaffold(r.seed)                          // painted this click: under construction
      : full ? generateBuilding(r.n, r.seed,
          senes !== null && senes >= 0.95 ? 'ruin' : 'normal', // last 5%: ruin telegraph, still alive
          generation - (r.g || 0), senes)
      : generatePlaceholder(r.n);
    const t = tileTransform(x, y);
    const tiltF = full ? tiltForNeighbours(r.n) : 0;   // placeholders stay cheap and upright
    const m = composeMatrix(new THREE.Matrix4(),
      t.cx, t.cy, t.cz, t.tx * tiltF, t.yaw, t.tz * tiltF, t.sx, 1, t.sz);
    sources.push({ matrix: m, instructions });
  }

  // ---- vertex furniture: read the 4 cells meeting at each interior lattice
  // vertex and drop a small structure keyed to how many are built. 3 built +
  // 1 sand -> courtyard well; 2+2 -> frontage brazier/palm; 1+3 -> outer-corner
  // obelisk. Skips vertices touching a ziggurat or the canal. Uses grid geometry
  // (the lines/vertices) the per-tile pass ignores. ----
  // Allocation-free: index the 4 cells (NW/NE/SW/SE) by flat grid index.
  const claimedArr = curZ.claimed;
  for (let j = 1; j < N; j++) for (let i = 1; i < N; i++) {
    const iNW = (j - 1) * N + (i - 1), iNE = (j - 1) * N + i, iSW = j * N + (i - 1), iSE = j * N + i;
    const alive = grid[iNW] + grid[iNE] + grid[iSW] + grid[iSE];
    if (alive === 0 || alive === 4) continue;              // open desert or buried interior
    if (claimedArr[iNW] || claimedArr[iNE] || claimedArr[iSW] || claimedArr[iSE]) continue;
    if (canalOn && (canalMask[iNW] || canalMask[iNE] || canalMask[iSW] || canalMask[iSE])) continue;
    const gate = hash01(globalSeed, i, j, 0x7E27);         // cheap gate, no closure
    if (!(alive === 3 ? gate < 0.55 : alive === 2 ? gate < 0.45 : gate < 0.12)) continue;
    const rng = mulberry32(hashSeed(globalSeed, i, j, 0x7E28));
    const instructions = [];
    if (alive === 3) well(rng, instructions);
    else if (alive === 2) { if (gate < 0.3) brazier(rng, instructions); else palmTree(rng, instructions, 0, 0, 0.8); }
    else obelisk(rng, instructions);                       // alive === 1
    // sit it in open ground: pull the vertex toward the centroid of the sand cells
    const v = lattice[j][i];
    let sx = 0, sz = 0, nd = 0;
    if (!grid[iNW]) { const p = lattice[j - 1][i - 1], q = lattice[j][i]; sx += (p.x + q.x) / 2; sz += (p.z + q.z) / 2; nd++; }
    if (!grid[iNE]) { const p = lattice[j - 1][i], q = lattice[j][i + 1]; sx += (p.x + q.x) / 2; sz += (p.z + q.z) / 2; nd++; }
    if (!grid[iSW]) { const p = lattice[j][i - 1], q = lattice[j + 1][i]; sx += (p.x + q.x) / 2; sz += (p.z + q.z) / 2; nd++; }
    if (!grid[iSE]) { const p = lattice[j][i], q = lattice[j + 1][i + 1]; sx += (p.x + q.x) / 2; sz += (p.z + q.z) / 2; nd++; }
    const px = v.x + (sx / nd - v.x) * 0.55, pz = v.z + (sz / nd - v.z) * 0.55;
    const m = composeMatrix(new THREE.Matrix4(), px, terrainHeight(i, j), pz, 0, rng() * Math.PI * 2, 0, 1, 1, 1);
    sources.push({ matrix: m, instructions });
  }

  // ---- boats drifting on the canal (float on the water plane, not terrain) ----
  if (canalOn) {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      if (!canalMask[i]) continue;
      if (hash01(globalSeed, x, y, 0xB0A7) >= 0.06) continue;   // a scattering of boats, not a jam
      const rng = mulberry32(hashSeed(globalSeed, x, y, 0xB0A8));
      const p00 = lattice[y][x], p10 = lattice[y][x + 1], p01 = lattice[y + 1][x], p11 = lattice[y + 1][x + 1];
      const cx = (p00.x + p10.x + p01.x + p11.x) / 4, cz = (p00.z + p10.z + p01.z + p11.z) / 4;
      const instructions = [];
      boat(rng, instructions);
      const m = composeMatrix(new THREE.Matrix4(), cx, WATER_LEVEL + 0.02, cz, 0, (rng() - 0.5) * 0.4, 0, 1, 1, 1);
      sources.push({ matrix: m, instructions });
    }
  }

  // ---- reed clumps dressing the tidal foreshore (circular island, ocean on) ----
  if (circularIsland && oceanOn && _tidalPh) {
    const seaY = outerGroundY();
    const clumps = Math.round(N * 3);
    for (let k = 0; k < clumps; k++) {
      const a = hash01(globalSeed, k, 3, 0x71DA) * Math.PI * 2;
      const t = 0.16 + hash01(globalSeed, k, 4, 0x71DB) * 0.5;   // wet band, coast -> waterline
      const smp = tidalSample(a, t);
      if (smp.h < seaY + 0.02) continue;             // skip the fully submerged outer flats
      const rng = mulberry32(hashSeed(globalSeed, k, 0, 0x71DC));
      const instructions = [];
      reedClump(rng, instructions);
      const m = composeMatrix(new THREE.Matrix4(), smp.x, smp.h, smp.z, 0, rng() * Math.PI * 2, 0, 1, 1, 1);
      sources.push({ matrix: m, instructions });
    }
  }

  // ziggurats: exempt from the cap, always full. Two passes: first place every
  // one normally and measure its absolute world peak (terrain lift + tell mound
  // included, not just tier count — a squat ziggurat on a tall mound can beat a
  // taller one sitting low); then the single tallest true ziggurat (size 3-4, or
  // the grand ziggurat-on-podium band 10+ — gardens/palaces in between aren't
  // ziggurats) gets regenerated with the reference photo's bitumen/sky-blue/
  // orange palette in place of the usual sand/lapis/gold.
  const zigEntries = [];
  for (const z of curZ.zigs) {
    const survives = nextZ.zigs.some(n => zigsOverlap(z, n));
    const seed = hashSeed(globalSeed, z.x0, z.y0, 0x5169);
    let variant = survives ? 'normal' : 'ruin';
    // consecrated-monument lifecycle: scaffolding while any member tile is
    // under construction; ruin telegraph through the synced clock's last 5%
    let anyS = false, allC = true, rc = null;
    for (let yy = z.y0; yy < z.y0 + z.size; yy++) for (let xx = z.x0; xx < z.x0 + z.size; xx++) {
      const r = records[yy * N + xx];
      if (r && r.s) anyS = true;
      if (!r || !r.c) allC = false; else rc = r;
    }
    if (anyS) variant = 'scaffold';
    else if (variant === 'normal' && allC && rc) {
      const frac = senesOf(rc);                       // members share one synced clock
      if (frac !== null && frac >= 0.95) variant = 'ruin';
    }
    const stairFace = bestStairFace(z, grid);
    const instructions = variant === 'scaffold'
      ? monumentConstruction(z.size, seed ^ 0x5CAF)   // all monument types share the construction site
      : generateMonument(z.size, seed, variant, stairFace);
    // affine placement from the footprint's four jittered lattice corners
    const p00 = lattice[z.y0][z.x0], p10 = lattice[z.y0][z.x0 + z.size],
          p01 = lattice[z.y0 + z.size][z.x0], p11 = lattice[z.y0 + z.size][z.x0 + z.size];
    const cx = (p00.x + p10.x + p01.x + p11.x) / 4;
    const cz = (p00.z + p10.z + p01.z + p11.z) / 4;
    const yaw = -(Math.atan2(p10.z - p00.z, p10.x - p00.x) + Math.atan2(p11.z - p01.z, p11.x - p01.x)) / 2;
    const len = (a, b) => Math.hypot(b.x - a.x, b.z - a.z);
    const sx = (len(p00, p10) + len(p01, p11)) / 2 / z.size;
    const sz = (len(p00, p01) + len(p10, p11)) / 2 / z.size;
    // upright on its stamped tell platform (flat after stampTells, so avg = plateau)
    const cy = (terrainHeight(z.x0, z.y0) + terrainHeight(z.x0 + z.size, z.y0) +
                terrainHeight(z.x0, z.y0 + z.size) + terrainHeight(z.x0 + z.size, z.y0 + z.size)) / 4;
    let localTop = 0;                                // highest point of the instruction set, tile-local
    for (const ins of instructions) localTop = Math.max(localTop, ins.pos[1] + ins.scale[1] / 2);
    zigEntries.push({
      z, seed, variant, stairFace, instructions, cx, cy, cz, yaw, sx, sz,
      // GOD MODE: only a grand ziggurat (size 10+) can wear the special
      // crown — that's also the sculpt-unlock threshold, so the palette
      // change doubles as the "sculpt is now unlocked" telegraph.
      isZiggurat: z.size >= 10,
      peakY: cy + localTop,
    });
  }
  // hysteresis: the reigning temple keeps the crown unless another true
  // ziggurat's peak beats it by a clear margin, so near-equal peers (or peaks
  // jittering across generations as the automaton churns) don't trade the
  // colour scheme back and forth. Less than one tier (tierH 0.55) so a
  // genuinely taller ziggurat still takes over, but terrain/tell jitter won't.
  const TEMPLE_HYSTERESIS = 0.4;
  let tallest = null;
  for (const e of zigEntries) if (e.isZiggurat && (!tallest || e.peakY > tallest.peakY)) tallest = e;
  let chosen = tallest;
  if (templeZig) {
    const reigning = zigEntries.find(e => e.isZiggurat && zigsOverlap(e.z, templeZig));
    if (reigning && tallest && tallest.peakY - reigning.peakY < TEMPLE_HYSTERESIS) chosen = reigning;
  }
  templeZig = chosen ? { x0: chosen.z.x0, y0: chosen.z.y0, size: chosen.z.size } : null;
  if (chosen && chosen.variant !== 'scaffold') {   // a construction site takes no crown yet
    chosen.instructions = generateMonument(chosen.z.size, chosen.seed, chosen.variant, chosen.stairFace, true);
  }
  for (const e of zigEntries) {
    const m = composeMatrix(new THREE.Matrix4(), e.cx, e.cy, e.cz, 0, e.yaw, 0, e.sx, 1, e.sz);
    sources.push({ matrix: m, instructions: e.instructions });
  }

  // pass 1: count instances needed per bucket, grow capacity up front
  const counts = new Map();
  for (const src of sources) for (const ins of src.instructions) {
    const key = ins.shape + ':' + ins.mat;
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  for (const [key, n] of counts) {
    const [shape, matKey] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    getBucket(shape, matKey).ensureCapacity(n);
  }

  // pass 2: write world matrices (tile transform * instruction-local transform)
  const cursors = new Map();
  for (const src of sources) {
    _tileMat.copy(src.matrix);
    for (const ins of src.instructions) {
      const key = ins.shape + ':' + ins.mat;
      composeMatrix(_localMat, ins.pos[0], ins.pos[1], ins.pos[2],
        ins.rot[0], ins.rot[1], ins.rot[2], ins.scale[0], ins.scale[1], ins.scale[2]);
      _worldMat.multiplyMatrices(_tileMat, _localMat);
      const idx = cursors.get(key) || 0;
      buckets.get(key).mesh.setMatrixAt(idx, _worldMat);
      cursors.set(key, idx + 1);
    }
  }

  // finalize: buckets untouched this frame draw nothing (count = 0)
  for (const [key, bucket] of buckets) {
    bucket.mesh.count = counts.get(key) || 0;
    bucket.mesh.instanceMatrix.needsUpdate = true;
  }
}

/* ============================================================================
   GOD MODE — the player is the automaton. Click to paint tiles alive; the
   generator decides what appears. Verb ladder (see GOD_GAME_MODE.md):
     Paint  — always available. Convert desert tiles to city.
     Sculpt — unlocked by the Great Ziggurat (a 10+ monument). Carves the
              accumulated churn/tell sediment back toward the floor, with soft
              falloff — and razes the buildings that made the height (lossy).
   Brush: one global slider, range [1, area of your largest building], 1:1 —
   an N-tile building buys an N-tile brush. Geometry: grow-from-center (the N
   nearest tiles to the click).
   ------------------------------------------------------------------------- */

let verb = 'paint';
let brushSize = 1;
let sculptUnlocked = false;
let timeOn = false;                  // the Time checkbox: frozen diorama vs living world
const PAINT_DEPOSIT = 0.02;          // immediate sediment per painted tile vertex

/* -- the live layer: consecrated lifetimes, click-as-turn, scaffolding -------
   Record flags (on the per-tile birth records):
     r.c — consecrated: player paint; the culture rule can't kill it, but it
           expires after r.L generations and crumbles back to open ground.
     r.L — lifetime in generations, size-scaled + seeded jitter.
     r.s — scaffolding: painted this click, completes (loses the flag) on the
           player's next click.
   Vernacular tiles (grown by the culture rule) carry no flags and live/die
   by the rule alone — with the standard scaffold/ruin telegraphs.
   ------------------------------------------------------------------------- */

const LIFE_BASE = 50, LIFE_SCALE = 25, LIFE_JITTER = 0.15;
// √area: monuments stand long but not forever — the player must get to see
// their greatest work fall. Jitter is per-birth + seeded, so a district
// painted in one stroke decays over a window, not as a demolition wave.
function rollLifetime(seed, area = 1) {
  return Math.max(10, Math.round((LIFE_BASE + LIFE_SCALE * Math.sqrt(area))
    * (1 - LIFE_JITTER + 2 * LIFE_JITTER * mulberry32(seed)())));
}

// fraction of lifetime lived, or null for vernacular / unclocked tiles
function senesOf(r) {
  return r && r.c && r.L ? Math.min(1, (generation - r.g) / r.L) : null;
}

// last click's construction completes: scaffolds become buildings
function finishScaffolds() {
  for (const r of records) if (r && r.s) r.s = false;
}

// One landmark, one lifetime, one collapse — but ONLY at the god's hand.
// Called with the tile indices touched by this click: a detected monument
// square containing freshly-painted tiles ADOPTS all its members (vernacular
// squatters who complete a landmark are consecrated into it), syncs them to
// one clock and rolls a single size-scaled lifetime. Squares the sprawl forms
// on its own are never adopted — the world can't consecrate itself, or
// adoption creep spreads immortality across the whole map (verified bug).
function syncMonumentClocks(touched) {
  if (!touched || !touched.size) return;
  for (const z of detectZiggurats(grid).zigs) {
    const members = [];
    let hit = false;
    for (let y = z.y0; y < z.y0 + z.size; y++) for (let x = z.x0; x < z.x0 + z.size; x++) {
      const i = y * N + x;
      if (!records[i]) { members.length = 0; break; }  // shouldn't happen for a detected square
      members.push(records[i]);
      if (touched.has(i)) hit = true;
    }
    if (!members.length || !hit) continue;
    const gmax = Math.max(...members.map(r => r.g));   // youngest member's clock
    const L = rollLifetime(hashSeed(globalSeed, z.x0 ^ Math.imul(gmax + 1, 0x9E37), z.y0, 0x11FE), z.size * z.size);
    for (const r of members) { r.c = true; r.g = gmax; r.L = L; }
  }
}

const verbPaintBtn = document.getElementById('verbPaint');
const verbSculptBtn = document.getElementById('verbSculpt');
const brushEl = document.getElementById('brush');
const brushLabelEl = document.getElementById('brushLabel');
const brushMaxEl = document.getElementById('brushMax');

function setVerbUI(v) {
  verb = v;
  verbPaintBtn.classList.toggle('active', v === 'paint');
  verbSculptBtn.classList.toggle('active', v === 'sculpt');
}
verbPaintBtn.onclick = () => setVerbUI('paint');
verbSculptBtn.onclick = () => { if (sculptUnlocked) setVerbUI('sculpt'); };

// The keystone rule: max brush area = footprint area of the largest structure
// on the map. Single-tile buildings give 1; a size-s monument gives s*s.
function maxBrushArea() {
  let anyAlive = false;
  for (let i = 0; i < grid.length; i++) if (grid[i]) { anyAlive = true; break; }
  if (!anyAlive) return 1;
  const zigs = detectZiggurats(grid).zigs;
  let s = 1;
  for (const z of zigs) s = Math.max(s, z.size * z.size);
  return Math.min(s, 100);   // cap at the great-ziggurat footprint: no quadratic runaway (playtest #1)
}

function updateBrushUI() {
  const max = maxBrushArea();
  brushEl.max = max;
  if (brushSize > max) brushSize = max;
  brushEl.value = brushSize;
  brushLabelEl.textContent = brushSize;
  brushMaxEl.textContent = max;
}

// The verb ladder, made explicit. Each rung is diegetic — the structure IS
// the tool, and the locked label names what to build next:
//   Paint      — always yours.
//   Brush      — max area = your largest building's footprint (self-enforcing
//                via maxBrushArea; the slider tooltip names the next rung).
//   Sculpt     — unlocked by a Great Ziggurat (10+ footprint). Persists until
//                reset: the knowledge outlives the monument.
function updateUnlocks() {
  if (!sculptUnlocked && detectZiggurats(grid).zigs.some(z => z.size >= 10)) {
    sculptUnlocked = true;
  }
  verbSculptBtn.disabled = !sculptUnlocked;
  verbSculptBtn.innerHTML = sculptUnlocked ? '&#9968;&#65039; Sculpt' : '&#9968;&#65039; Sculpt &#128274;';
  verbSculptBtn.title = sculptUnlocked
    ? 'Lowers terrain; destroys the buildings on it'
    : 'Locked: requires a great ziggurat';
  if (!sculptUnlocked && verb === 'sculpt') setVerbUI('paint');
  // brush max hint: what raises it
  const max = maxBrushArea();
  brushEl.title = brushMaxEl.title =
    max < 9 ? 'Build a 3×3 block to increase the maximum brush size'
    : max < 100 ? 'Max brush size equals the area of your largest building'
    : 'Maximum brush size reached';
}

// Grow-from-center: the `count` nearest valid tiles to the clicked tile,
// by distance from the click point — organic rounded blobs, exact area.
// Paint targets dead land; sculpt targets any land (water is never valid).
function growFromCenter(tx, ty, px, pz, count, forSculpt) {
  const cells = [];
  const R = Math.ceil(Math.sqrt(count)) + 2;      // search window comfortably over-covers count
  for (let y = Math.max(0, ty - R); y <= Math.min(N - 1, ty + R); y++) {
    for (let x = Math.max(0, tx - R); x <= Math.min(N - 1, tx + R); x++) {
      const i = y * N + x;
      if (canalOn && canalMask[i]) continue;                 // the river is not yours
      if (!forSculpt && grid[i]) {                           // paint fills open desert…
        const f = senesOf(records[i]);
        if (f === null || f < 0.6) continue;                 // …or renews aging consecrated tiles
      }
      const dx = (x + 0.5 - N / 2) - px, dz = (y + 0.5 - N / 2) - pz;
      cells.push({ x, y, d2: dx * dx + dz * dz });
    }
  }
  cells.sort((a, b) => a.d2 - b.d2);
  return cells.slice(0, count);
}

function paintAt(tx, ty, px, pz) {
  const cells = growFromCenter(tx, ty, px, pz, brushSize, false);
  if (!cells.length) return;
  if (timeOn) finishScaffolds();                             // last click's construction completes
  for (const c of cells) grid[c.y * N + c.x] = 1;
  records = recordBirths(grid, records, generation);         // newborns roll their form now
  for (const c of cells) {
    const r = records[c.y * N + c.x];
    r.c = true;                                              // consecrated: yours, the rule can't kill it
    r.g = generation;                                        // renewal resets the clock (form is kept: restoration)
    r.L = rollLifetime(hashSeed(globalSeed, c.x, c.y, generation ^ 0x11FE));
    if (timeOn) r.s = true;                                  // lands as scaffolding, completes next click
    for (const v of [HV(c.x, c.y), HV(c.x + 1, c.y), HV(c.x, c.y + 1), HV(c.x + 1, c.y + 1)]) {
      churnDelta[v] = Math.min(CHURN_MAX, churnDelta[v] + PAINT_DEPOSIT);   // immediate sediment deposit
    }
  }
  syncMonumentClocks(new Set(cells.map(c => c.y * N + c.x)));
  if (timeOn) { stepCity(); updateBrushUI(); return; }       // click = turn: the world responds
  stampTells(detectZiggurats(grid).zigs);                    // a new monument stamps its platform
  updateGroundHeights();
  updateWalls();
  updateUnlocks();
  updateBrushUI();
  rebuildInstances();
  render();
}

// Lossy undo-terraform. Soft falloff: the click centre goes to the floor, the
// outer ring keeps most of its height. Tiles losing a real fraction of their
// sediment lose their buildings too — the district is spent as raw material.
function sculptAt(tx, ty, px, pz) {
  const cells = growFromCenter(tx, ty, px, pz, brushSize, true);
  if (!cells.length) return;
  const dmax = Math.sqrt(cells[cells.length - 1].d2) + 0.001;
  const vertexCut = new Map();                               // vertex -> strongest cut fraction
  let razed = false;
  for (const c of cells) {
    const f = brushSize === 1 ? 1 : Math.pow(1 - Math.sqrt(c.d2) / dmax, 0.7);   // 1 at centre -> 0 at rim
    for (const v of [HV(c.x, c.y), HV(c.x + 1, c.y), HV(c.x, c.y + 1), HV(c.x + 1, c.y + 1)]) {
      vertexCut.set(v, Math.max(vertexCut.get(v) || 0, f));
    }
    if (f > 0.35 && grid[c.y * N + c.x]) {                   // lossy: the height cost its makers
      grid[c.y * N + c.x] = 0;
      razed = true;
    }
  }
  for (const [v, f] of vertexCut) {                          // carve accumulated sediment only —
    churnDelta[v] *= 1 - f;                                  // never below the natural floor
    tellDelta[v] *= 1 - f;
  }
  if (razed) records = recordBirths(grid, records, generation);
  // sculpt does NOT advance the turn — destruction should be seen, not
  // instantly regrown over by the sprawl (playtest #3)
  if (timeOn) { updateGroundHeights(); updateWalls(); updateBrushUI(); rebuildInstances(); render(); return; }
  updateGroundHeights();
  updateWalls();
  updateBrushUI();
  rebuildInstances();
  render();
}

// Click-to-act: raycast the ground mesh; a press that barely moves is a click,
